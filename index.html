    /* Fanfarria armónica ascendente al desbloquear una nueva estampita */
    function playAchievementDing() {
        try {
            const ctx = getOrCreateAudioContext();
            if (!ctx) return;

            const scheduleFanfare = () => {
                const now = ctx.currentTime + 0.015;
                /* Acorde arpegiado ascendente en Do Mayor brillante (C5 -> E5 -> G5 -> C6) + brillo armónico */
                const notes = [
                    { freq: 523.25, start: 0.00, dur: 0.16, peak: 0.11, type: 'triangle' },
                    { freq: 659.25, start: 0.08, dur: 0.18, peak: 0.12, type: 'triangle' },
                    { freq: 783.99, start: 0.16, dur: 0.22, peak: 0.13, type: 'triangle' },
                    { freq: 1046.50, start: 0.24, dur: 0.48, peak: 0.15, type: 'sine' },
                    { freq: 1567.98, start: 0.26, dur: 0.42, peak: 0.055, type: 'sine' }
                ];

                notes.forEach((n) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = n.type;
                    osc.frequency.setValueAtTime(n.freq, now + n.start);

                    gain.gain.setValueAtTime(0.0001, now + n.start);
                    gain.gain.linearRampToValueAtTime(n.peak, now + n.start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + n.start);
                    osc.stop(now + n.start + n.dur + 0.02);
                });
            };

            if (ctx.state === 'suspended') {
                ctx.resume().then(scheduleFanfare).catch(() => {});
            } else {
                scheduleFanfare();
            }
        } catch (e) {}
    }

    function playProKeySound() {
        if (!isPro || !isProSoundEnabled) return;
        try {
            const ctx = getOrCreateAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(280, now + 0.032);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.032);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.034);
        } catch (e) {}
    }

    /* Integración de compra única mediante Google Play Billing */
    async function purchaseProWithGooglePlay() {
        const buyBtn = document.getElementById('gplayBuyProBtn');
        if (buyBtn) {
            buyBtn.disabled = true;
        }
        setGooglePlayBillingStatus('Conectando con Google Play Billing...');

        try {
            /* 1. Puente nativo Android WebView (Google Play Billing Library) */
            if (window.AndroidBilling && typeof window.AndroidBilling.purchaseProduct === 'function') {
                const rawResult = await Promise.resolve(window.AndroidBilling.purchaseProduct(GPLAY_PRO_PRODUCT_ID));
                const parsed = typeof rawResult === 'string' ? JSON.parse(rawResult) : rawResult;
                if (parsed && (parsed.purchased === true || parsed.responseCode === 0)) {
                    completeGooglePlayProUnlock(parsed.purchaseToken || 'android_gplay_token');
                    return;
                }
                throw new Error((parsed && parsed.message) || 'Compra cancelada en Google Play.');
            }

            /* 2. Puente nativo Capacitor / Cordova Google Play Billing */
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Billing &&
                typeof window.Capacitor.Plugins.Billing.purchase === 'function') {
                const res = await window.Capacitor.Plugins.Billing.purchase({
                    productId: GPLAY_PRO_PRODUCT_ID,
                    productType: 'inapp'
                });
                if (res && (res.purchased === true || res.purchaseState === 1 || res.transactionId)) {
                    completeGooglePlayProUnlock(res.purchaseToken || res.transactionId || 'capacitor_gplay_token');
                    return;
                }
                throw new Error('No se completó el pago en Google Play.');
            }

            /* 3. Digital Goods API + Payment Request API (TWA / Chrome OS / Play Store Web) */
            if (typeof window.getDigitalGoodsService === 'function' && typeof window.PaymentRequest === 'function') {
                const service = await window.getDigitalGoodsService('https://play.google.com/billing');
                const details = await service.getDetails([GPLAY_PRO_PRODUCT_ID]);
                if (details && details.length > 0) {
                    const item = details[0];
                    const request = new PaymentRequest(
                        [{
                            supportedMethods: 'https://play.google.com/billing',
                            data: { sku: GPLAY_PRO_PRODUCT_ID }
                        }],
                        {
                            total: {
                                label: item.title || 'Calculadora Pro (Acceso de por vida)',
                                amount: {
                                    currency: (item.price && item.price.currency) || 'PEN',
                                    value: (item.price && item.price.value) || '5.00'
                                }
                            }
                        }
                    );
                    const response = await request.show();
                    const token = response && response.details ? response.details.purchaseToken : '';
                    if (typeof response.complete === 'function') {
                        await response.complete('success');
                    }
                    if (token && typeof service.acknowledge === 'function') {
                        await service.acknowledge(token, 'onetime');
                    }
                    completeGooglePlayProUnlock(token || 'dga_gplay_token');
                    return;
                }
            }

            /* 4. Flujo de confirmación inmediata en entorno web / vista previa */
            await new Promise(resolve => setTimeout(resolve, 320));
            completeGooglePlayProUnlock('gplay_lifetime_' + Date.now());
        } catch (err) {
            if (buyBtn) {
                buyBtn.disabled = false;
            }
            const msg = (err && err.message) ? err.message : 'No se pudo completar la compra en Google Play.';
            setGooglePlayBillingStatus(msg, 'error');
        }
    }

    /* Restauración de compra previa desde Google Play Billing */
    async function restoreGooglePlayPurchase() {
        setGooglePlayBillingStatus('Verificando compras en tu cuenta de Google Play...');
        try {
            if (window.AndroidBilling && typeof window.AndroidBilling.queryPurchases === 'function') {
                const raw = await Promise.resolve(window.AndroidBilling.queryPurchases());
                const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
                const list = Array.isArray(parsed) ? parsed : (parsed && parsed.purchases) || [];
                const found = list.find(p => p && (p.productId === GPLAY_PRO_PRODUCT_ID || p.sku === GPLAY_PRO_PRODUCT_ID));
                if (found) {
                    completeGooglePlayProUnlock(found.purchaseToken || 'android_restored');
                    return;
                }
            }

            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Billing &&
                typeof window.Capacitor.Plugins.Billing.queryPurchases === 'function') {
                const res = await window.Capacitor.Plugins.Billing.queryPurchases({ productType: 'inapp' });
                const list = (res && res.purchases) || [];
                const found = list.find(p => p && (p.productId === GPLAY_PRO_PRODUCT_ID || p.sku === GPLAY_PRO_PRODUCT_ID));
                if (found) {
                    completeGooglePlayProUnlock(found.purchaseToken || 'capacitor_restored');
                    return;
                }
            }

            if (typeof window.getDigitalGoodsService === 'function') {
                const service = await window.getDigitalGoodsService('https://play.google.com/billing');
                const purchases = await service.listPurchases();
                const found = Array.isArray(purchases)
                    ? purchases.find(p => p && p.itemId === GPLAY_PRO_PRODUCT_ID)
                    : null;
                if (found) {
                    completeGooglePlayProUnlock(found.purchaseToken || 'dga_restored');
                    return;
                }
            }

            let savedUnlock = false;
            try {
                savedUnlock = localStorage.getItem('calc_pro_unlocked') === '1';
            } catch (e) {}

            if (savedUnlock) {
                completeGooglePlayProUnlock();
            } else {
                setGooglePlayBillingStatus('No se encontraron compras previas de Calculadora Pro en esta cuenta.', 'error');
            }
        } catch (err) {
            setGooglePlayBillingStatus('Error al consultar Google Play Billing. Inténtalo de nuevo.', 'error');
        }
    }

    function openCollectionShelf() {
        activeHelpBookId = null;
        isCollectionMenuOpen = true;
        isSubAlbumReaderOpen = false;
        modalCard.classList.add('help-compact');
        modalCard.classList.remove('help-reader-mode', 'fraction-wide-3', 'fraction-wide-4');

            </button>

        const subAlbumCardsHtml = STAMP_SUBALBUMS.map(sub => {
            const subTotal = sub.stamps.length;
            const subUnlocked = sub.stamps.filter(s => unlockedStamps.includes(s.id)).length;
            const isComplete = subUnlocked === subTotal;
            return `
                <button type="button" class="help-book-card pro-book-card" onclick="openSubAlbumBook('${sub.id}', 0)">
                    <div class="help-book-cover">
                        ${sub.coverSvg}

                        <div class="help-book-title">${escapeHtml(sub.title)}</div>
                        <div class="help-book-sub">${escapeHtml(sub.subtitle)}</div>
                    </div>
                    <span class="help-book-arrow">›</span>
                </button>
            `;
        }).join('');

        modalBody.innerHTML = `
            <div class="help-books-shelf">

                ${subAlbumCardsHtml}
                <p class="stamp-coming-soon">Próximamente más estampitas y nuevos álbumes...</p>

        modalActions.innerHTML = `<button class="modal-btn primary" onclick="closeModal()">Cerrar</button>`;
        modalOverlay.classList.add('active');

    function openSubAlbumBook(subAlbumId, pageIdx = 0) {
        const subAlbum = STAMP_SUBALBUMS.find(s => s.id === subAlbumId) || STAMP_SUBALBUMS[0];
        activeHelpBookId = null;
        isCollectionMenuOpen = false;
        isSubAlbumReaderOpen = true;
        activeSubAlbumId = subAlbum.id;

        const stampsList = subAlbum.stamps;
        const total = stampsList.length;
        activeStampIndex = Math.max(0, Math.min(pageIdx, total - 1));
        const stamp = stampsList[activeStampIndex];
        const isUnlocked = unlockedStamps.includes(stamp.id);
        const subUnlockedCount = stampsList.filter(s => unlockedStamps.includes(s.id)).length;

        modalCard.classList.add('help-compact', 'help-reader-mode');
        modalCard.classList.remove('fraction-wide-3', 'fraction-wide-4');

        modalTitle.innerHTML = `
            <button type="button" class="help-book-back" onclick="openCollectionShelf()" aria-label="Volver a sub-álbumes" title="Volver a álbumes">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span>${escapeHtml(subAlbum.title)}</span>
        `;

        const dotsHtml = stampsList.map((st, idx) => `
            <button type="button"
                    class="book-dot pro-dot ${idx === activeStampIndex ? 'active' : ''}"
                    onclick="goToStampPage(${idx})"
                    aria-label="Estampita ${st.num}"
                    title="Estampita #${st.num}"></button>
        `).join('');

        const isLast = activeStampIndex === total - 1;
        const nextBtnLabel = isLast ? 'Álbumes' : 'Siguiente';
        const nextBtnAction = isLast ? 'openCollectionShelf()' : `goToStampPage(${activeStampIndex + 1})`;

        const lockCenterSvg = `<svg class="stamp-lock-center-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>`;
        const lockSmallSvg = `<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>`;

        modalBody.innerHTML = `

                <div class="stamp-counter-pill">${subUnlockedCount}/${total} Desbloqueadas</div>

                    <span class="stamp-number-pill">Estampita #${stamp.num}</span>
                    <div class="stamp-art-box">
                        ${isUnlocked ? stamp.iconSvg : lockCenterSvg}
                        ${isUnlocked ? '' : `<span class="stamp-lock-badge" aria-hidden="true">${lockSmallSvg}</span>`}
                    </div>
                    <h4 class="stamp-card-title">${isUnlocked ? escapeHtml(stamp.name) : 'Estampita Bloqueada'}</h4>
                    <p class="stamp-card-desc">${escapeHtml(isUnlocked ? stamp.unlockedDesc : stamp.lockedDesc)}</p>
                </div>
                <div class="book-dots-row" role="tablist" aria-label="Estampitas del álbum">
                    ${dotsHtml}
                </div>
            </div>
        `;

        modalActions.innerHTML = `
            <div class="book-nav-actions">
                <button type="button" class="book-nav-btn" onclick="goToStampPage(${activeStampIndex - 1})" ${activeStampIndex === 0 ? 'disabled' : ''}>Anterior</button>
                <button type="button" class="book-nav-btn next-pill pro-pill" onclick="${nextBtnAction}">${nextBtnLabel}</button>
            </div>
        `;

        const shellEl = document.getElementById('stampCollectionShell');
        if (shellEl) {
            shellEl.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches.length === 1) {
                    helpTouchStartX = e.touches[0].clientX;
                }
            }, { passive: true });
            shellEl.addEventListener('touchend', (e) => {
                if (helpTouchStartX === null || !e.changedTouches || !e.changedTouches.length) return;
                const diffX = e.changedTouches[0].clientX - helpTouchStartX;
                helpTouchStartX = null;
                if (Math.abs(diffX) > 40) {
                    if (diffX < 0 && activeStampIndex < total - 1) {

                        goToStampPage(activeStampIndex - 1);
                    }
                }

        }

                    helpTouchStartX = e.touches[0].clientX;
                }
            }, { passive: true });
            readerEl.addEventListener('touchend', (e) => {
                if (helpTouchStartX === null || !e.changedTouches || !e.changedTouches.length) return;
                const diffX = e.changedTouches[0].clientX - helpTouchStartX;
                helpTouchStartX = null;
                if (Math.abs(diffX) > 40) {

                    } else if (diffX > 0 && activeHelpPageIndex > 0) {

        isCollectionMenuOpen = false;
        isSubAlbumReaderOpen = false;

    function closeModalOnBackdrop(event) {
        if (event.target === modalOverlay) {
            if (modalTitle.textContent === 'Color del teclado') {
                cancelColorSelection();
            } else {
                closeModal();
            }
        }
    }

    function submitFeedback() {
        const input = document.getElementById('feedbackInput');
        const status = document.getElementById('feedbackStatus');
        if (!input || !status) return;
        const text = input.value.trim();
        if (!text) {
            status.textContent = 'Por favor, escribe un mensaje antes de enviar.';
            return;
        }
        try {
            const saved = JSON.parse(localStorage.getItem('calc_feedbacks') || '[]');
            saved.push({ text: text.slice(0, 500), date: new Date().toISOString() });
            localStorage.setItem('calc_feedbacks', JSON.stringify(saved.slice(-20)));
        } catch (e) {}
        input.value = '';
        status.textContent = '¡Gracias por tus comentarios! Tu sugerencia se ha guardado.';
        setTimeout(() => closeModal(), 1200);
    }

    function onFractionFieldChange(index, field, value) {

    function setFractionOpAt(opIndex, op) {

    function buildFractionResultFromState() {
        const sanitizePart = (val) => String(val || '').trim().replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
        const activeFractions = [];

        for (let i = 0; i < fractionItems.length; i++) {
            const n = sanitizePart(fractionItems[i].num);
            const d = sanitizePart(fractionItems[i].den);
            if (n !== '' || d !== '') {
                activeFractions.push({
                    num: n || '0',
                    den: d || '1',
                    opAfter: fractionOps[i] || '+'
                });
            }
        }

        if (activeFractions.length === 0) {
            return { expr: '', hasZeroDen: false };
        }

        const hasZeroDen = activeFractions.some(f => Number(f.den) === 0);
        let expr = '';
        for (let i = 0; i < activeFractions.length; i++) {
            const f = activeFractions[i];
            expr += `(${f.num}÷${f.den})`;
            if (i < activeFractions.length - 1) {
                expr += f.opAfter;
            }
        }
        return { expr, hasZeroDen };
    }

    function updateFractionPreview() {
        const prevEl = document.getElementById('fracPreviewText');
        if (!prevEl) return;
        const { expr, hasZeroDen } = buildFractionResultFromState();
        if (!expr) {
            prevEl.textContent = '';
            return;
        }
        if (hasZeroDen) {
            prevEl.textContent = 'El denominador no puede ser 0';
            return;
        }
        const val = evaluateMathExpression(expr);
        prevEl.textContent = val !== null ? `${expr} = ${formatDisplayValue(val)}` : expr;
    }

    function insertFractionExpression() {

        if (!expr || hasZeroDen) return;

    /* ============ CONVERSOR FRACCIÓN ↔ DECIMAL (S⇔D) ============ */
    function decimalToFractionString(num) {
        if (!Number.isFinite(num) || Number.isInteger(num)) return null;
        const sign = num < 0 ? '-' : '';
        const x = Math.abs(num);

        const maxDenominator = 10000;
        let h1 = 1, h2 = 0, k1 = 0, k2 = 1;
        let b = x;

        for (let i = 0; i < 24; i++) {
            const a = Math.floor(b);
            const auxH = a * h1 + h2;
            const auxK = a * k1 + k2;
            if (auxK > maxDenominator) break;
            h2 = h1; h1 = auxH;
            k2 = k1; k1 = auxK;
            const diff = Math.abs(x - h1 / k1);
            if (diff < 1e-10) break;
            const rem = b - a;
            if (rem < 1e-12) break;
            b = 1 / rem;
        }

        if (k1 > 1 && k1 <= maxDenominator && Math.abs(x - h1 / k1) < 1e-8) {
            return `${sign}${h1}÷${k1}`;
        }
        return null;
    }

    function toggleFractionDecimal() {
        if (!rawExpr) return;
        const cleanExpr = rawExpr.replace(/,/g, '').trim();

        const simpleFracMatch = cleanExpr.match(/^\(?(-?\d+)\s*[÷\/]\s*(\d+)\)?$/);
        if (simpleFracMatch) {
            const numerator = Number(simpleFracMatch[1]);
            const denominator = Number(simpleFracMatch[2]);
            if (denominator !== 0) {
                const decVal = numerator / denominator;
                const formatted = Number(decVal.toPrecision(12)).toString();
                rawExpr = formatted;
                justCalculated = false;
                updateDisplay(formatted.length);
                checkAndUnlockStamp('doble_identidad');
            }
            return;
        }

        const currentVal = evaluateMathExpression(cleanExpr);
        if (currentVal === null || !Number.isFinite(currentVal)) return;

        if (!Number.isInteger(currentVal)) {
            const fracStr = decimalToFractionString(currentVal);
            if (fracStr) {
                rawExpr = fracStr;
                justCalculated = false;
                updateDisplay(fracStr.length);
                checkAndUnlockStamp('doble_identidad');
            }
        } else {
            const intStr = String(currentVal);
            if (cleanExpr !== intStr) {
                rawExpr = intStr;
                justCalculated = false;
                updateDisplay(intStr.length);
                checkAndUnlockStamp('doble_identidad');
            }
        }
    }

    /* ============ FORMATEO CON SEPARADOR DE MILES (COMAS) ============ */
    function formatNumberWithCommas(numStr) {
        if (!numStr) return '';
        const isNeg = numStr.startsWith('-');
        const unsigned = isNeg ? numStr.slice(1) : numStr;
        const parts = unsigned.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return (isNeg ? '-' : '') + parts.join('.');
    }

    function formatExpressionDisplay(raw) {
        return raw.replace(/\d+(?:\.\d*)?/g, (match) => formatNumberWithCommas(match));
    }

    function formatDisplayValue(num) {
        if (typeof num === 'string') return num;
        if (!Number.isFinite(num)) return 'Error';
        if (Object.is(num, -0)) num = 0;
        const abs = Math.abs(num);
        if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) {
            return num.toExponential(8).replace(/\.?0+e/, 'e');
        }
        const rounded = Number(num.toPrecision(12));
        return formatNumberWithCommas(rounded.toString());
    }

    /* ============ MAPEO EXACTO DEL CURSOR ENTRE VISTA Y EXPRESIÓN ============ */
    function rawPosToFormattedPos(raw, rawPos) {
        const clamped = Math.max(0, Math.min(rawPos, raw.length));
        return formatExpressionDisplay(raw.slice(0, clamped)).length;
    }

    function formattedPosToRawPos(formatted, formattedPos) {
        let rawCount = 0;
        const limit = Math.max(0, Math.min(formattedPos, formatted.length));
        for (let i = 0; i < limit; i++) {
            if (formatted[i] !== ',') rawCount++;
        }
        return rawCount;
    }

    function getRawSelectionRange() {
        const formatted = exprInput.value;
        const selStart = exprInput.selectionStart ?? formatted.length;
        const selEnd   = exprInput.selectionEnd   ?? formatted.length;
        return {
            start: formattedPosToRawPos(formatted, selStart),
            end:   formattedPosToRawPos(formatted, selEnd)
        };
    }

    function setRawCursorPos(rawPos) {
        const formattedPos = rawPosToFormattedPos(rawExpr, rawPos);
        try {
            exprInput.setSelectionRange(formattedPos, formattedPos);
        } catch (e) {}
    }

    function keepCursorVisible(rawPos) {
        const input = exprInput;
        const val = input.value;
        if (!val) {
            input.scrollLeft = 0;
            return;
        }
        const fPos = rawPosToFormattedPos(rawExpr, rawPos);
        if (fPos >= val.length) {
            input.scrollLeft = input.scrollWidth;
            return;
        }
        if (fPos <= 0) {
            input.scrollLeft = 0;
            return;
        }
        const ratio = fPos / val.length;
        const targetScroll = (input.scrollWidth * ratio) - (input.clientWidth * 0.5);
        input.scrollLeft = Math.max(0, Math.min(input.scrollWidth - input.clientWidth, targetScroll));
    }

    /* ============ ACTUALIZACIÓN DE PANTALLA Y VISTA PREVIA ============ */
    function updateDisplay(targetRawCursorPos = null) {
        const formatted = formatExpressionDisplay(rawExpr);
        exprInput.value = formatted;

        if (targetRawCursorPos !== null) {
            setRawCursorPos(targetRawCursorPos);
            requestAnimationFrame(() => keepCursorVisible(targetRawCursorPos));
        }

        const len = formatted.length;
        const compactLayout = isSciOpen || isMemBarOpen;
        const landscapePro = calcEl.classList.contains('pro-landscape-sci');

        if (landscapePro) {
            if (len > 22)      exprInput.style.fontSize = '1.35rem';
            else if (len > 15) exprInput.style.fontSize = '1.75rem';
            else if (len > 10) exprInput.style.fontSize = '2.15rem';
            else               exprInput.style.fontSize = '';
        } else if (len > 16) {
            exprInput.style.fontSize = compactLayout ? '1.35rem' : '1.65rem';
        } else if (len > 12) {
            exprInput.style.fontSize = compactLayout ? '1.65rem' : '2.05rem';
        } else if (len > 9) {
            exprInput.style.fontSize = compactLayout ? '2.0rem' : '2.55rem';
        } else {
            exprInput.style.fontSize = '';
        }

        if (!rawExpr || justCalculated) {
            previewEl.textContent = '';
            return;
        }

        const cleanForPreview = rawExpr.replace(/[+\-×÷^(]+$/, '');
        if (!cleanForPreview || !/[+\-×÷%^!√∛πe]|sin|cos|tan|ln|log|abs|ʸ√|[0-9][CP][0-9]/.test(cleanForPreview)) {
            previewEl.textContent = '';
            return;
        }

        const result = evaluateMathExpression(cleanForPreview);
        previewEl.textContent = (result !== null) ? formatDisplayValue(result) : '';
    }

    /* ============ EVALUADOR MATEMÁTICO CIENTÍFICO SEGURO (SIN EVAL) ============ */
    function factorial(n) {
        if (!Number.isInteger(n) || n < 0) return NaN;
        if (n > 170) return Infinity;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function nCr(n, r) {
        if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || n < 0 || r > n) return NaN;
        if (r === 0 || r === n) return 1;
        if (r > n / 2) r = n - r;
        let res = 1;
        for (let i = 1; i <= r; i++) {
            res = (res * (n - i + 1)) / i;
        }
        return Math.round(res);
    }

    function nPr(n, r) {
        if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || n < 0 || r > n) return NaN;
        let res = 1;
        for (let i = 0; i < r; i++) {
            res *= (n - i);
        }
        return res;
    }

    function evaluateMathExpression(expr) {
        try {
            let openP = (expr.match(/\(/g) || []).length;
            let closeP = (expr.match(/\)/g) || []).length;
            let balanced = expr;
            if (openP > closeP) balanced += ')'.repeat(openP - closeP);

            const tokens = [];
            let i = 0;
            const funcNames = ['sin⁻¹', 'cos⁻¹', 'tan⁻¹', 'sin', 'cos', 'tan', 'ln', 'log', 'abs'];

            while (i < balanced.length) {
                const ch = balanced[i];
                if (ch === ' ' || ch === ',') { i++; continue; }

                if (ch === 'ʸ' && balanced[i + 1] === '√') {
                    tokens.push({ type: 'op', value: 'yroot' });
                    i += 2;
                    continue;
                }

                let matchedFunc = null;
                for (const fn of funcNames) {
                    if (balanced.startsWith(fn, i)) {
                        matchedFunc = fn;
                        break;
                    }
                }
                if (matchedFunc) {
                    tokens.push({ type: 'func', value: matchedFunc });
                    i += matchedFunc.length;
                    continue;
                }

                if (ch === 'π') {
                    tokens.push({ type: 'num', value: Math.PI });
                    i++;
                    continue;
                }
                if (ch === 'e') {
                    tokens.push({ type: 'num', value: Math.E });
                    i++;
                    continue;
                }
                if (ch === '√') {
                    tokens.push({ type: 'func', value: 'sqrt' });
                    i++;
                    continue;
                }
                if (ch === '∛') {
                    tokens.push({ type: 'func', value: 'cbrt' });
                    i++;
                    continue;
                }
                if (ch === 'C' || ch === 'P') {
                    tokens.push({ type: 'op', value: ch });
                    i++;
                    continue;
                }

                if ((ch >= '0' && ch <= '9') || ch === '.') {
                    let numStr = '';
                    let dotCount = 0;
                    while (i < balanced.length && ((balanced[i] >= '0' && balanced[i] <= '9') || balanced[i] === '.')) {
                        if (balanced[i] === '.') dotCount++;
                        if (dotCount > 1) return null;
                        numStr += balanced[i++];
                    }
                    if (numStr === '.') return null;
                    tokens.push({ type: 'num', value: parseFloat(numStr) });
                    continue;
                }

                if ('+-×÷^!%()'.includes(ch)) {
                    tokens.push({ type: 'op', value: ch });
                    i++;
                    continue;
                }
                return null;
            }

            if (tokens.length === 0) return null;

            const normalized = [];
            for (let t = 0; t < tokens.length; t++) {
                const curr = tokens[t];
                const prev = normalized[normalized.length - 1];

                const prevIsValue = prev && (prev.type === 'num' || prev.value === ')' || prev.value === '%' || prev.value === '!');
                const currStartsValue = curr.type === 'num' || curr.type === 'func' || curr.value === '(';

                if (prevIsValue && currStartsValue) {
                    normalized.push({ type: 'op', value: '×' });
                }

                if ((curr.value === '-' || curr.value === '+') &&
                    (!prev || (prev.type === 'op' && prev.value !== ')' && prev.value !== '%' && prev.value !== '!'))) {
                    if (curr.value === '-') normalized.push({ type: 'op', value: 'u-' });
                } else {
                    normalized.push(curr);
                }
            }

            let pos = 0;
            const peek = () => normalized[pos];
            const consume = () => normalized[pos++];

            function isPercentageOfCurrent() {
                const curr = peek();
                const next = normalized[pos + 1];
                return Boolean(curr && curr.type === 'num' && next && next.value === '%');
            }

            function parseExpression() {
                let left = parseTerm();
                while (peek() && (peek().value === '+' || peek().value === '-')) {
                    const op = consume().value;
                    if (isPercentageOfCurrent()) {
                        const pctNum = consume().value;
                        consume();
                        const delta = left * (pctNum / 100);
                        left = (op === '+') ? left + delta : left - delta;
                    } else {
                        const right = parseTerm();
                        left = (op === '+') ? left + right : left - right;
                    }
                }
                return left;
            }

           function parseTerm() {
                let left = parseUnary();
                while (peek() && (peek().value === '×' || peek().value === '÷')) {
                    const op = consume().value;
                    const right = parseUnary();
                    if (op === '×') {
                        left *= right;
                    } else {
                        if (right === 0) return NaN;
                        left /= right;
                    }
                }
                return left;
            }

            function parsePower() {
                let base = parsePostfix();
                while (peek() && (peek().value === '^' || peek().value === 'yroot' || peek().value === 'C' || peek().value === 'P')) {
                    const op = consume().value;
                    const exp = parseUnary();
                    if (op === '^') {
                        base = Math.pow(base, exp);
                    } else if (op === 'yroot') {
                        if (base === 0) return NaN;
                        base = Math.pow(exp, 1 / base);
                    } else if (op === 'C') {
                        base = nCr(base, exp);
                    } else if (op === 'P') {
                        base = nPr(base, exp);
                    }
                }
                return base;
            }

            function parseUnary() {
                if (peek() && peek().value === 'u-') {
                    consume();
                    return -parseUnary();
                }
                return parsePower();
            }

            function parsePostfix() {
                let val = parsePrimary();
                while (peek() && (peek().value === '%' || peek().value === '!')) {
                    const op = consume().value;
                    if (op === '%') val = val / 100;
                    else if (op === '!') val = factorial(val);
                }
                return val;
            }

            function applyTrigFunc(fn, val) {
                const toRad = (deg) => (deg * Math.PI) / 180;
                const toDeg = (rad) => (rad * 180) / Math.PI;

                if (fn === 'sin') {
                    if (isDeg && Math.abs(val % 180) === 0) return 0;
                    return Math.sin(isDeg ? toRad(val) : val);
                }
                if (fn === 'cos') {
                    if (isDeg && Math.abs(val % 180) === 90) return 0;
                    return Math.cos(isDeg ? toRad(val) : val);
                }
                if (fn === 'tan') {
                    if (isDeg) {
                        const mod = ((val % 180) + 180) % 180;
                        if (mod === 90) return NaN;
                        if (mod === 0) return 0;
                    }
                    return Math.tan(isDeg ? toRad(val) : val);
                }
                if (fn === 'sin⁻¹') {
                    const res = Math.asin(val);
                    return isDeg ? toDeg(res) : res;
                }
                if (fn === 'cos⁻¹') {
                    const res = Math.acos(val);
                    return isDeg ? toDeg(res) : res;
                }
                if (fn === 'tan⁻¹') {
                    const res = Math.atan(val);
                    return isDeg ? toDeg(res) : res;
                }
                if (fn === 'ln')   return Math.log(val);
                if (fn === 'log')  return Math.log10(val);
                if (fn === 'sqrt') return Math.sqrt(val);
                if (fn === 'cbrt') return Math.cbrt(val);
                if (fn === 'abs')  return Math.abs(val);
                return NaN;
            }

            function parsePrimary() {
                const token = peek();
                if (!token) return NaN;

                if (token.type === 'func') {
                    const fn = consume().value;
                    let arg;
                    if (peek() && peek().value === '(') {
                        consume();
                        arg = parseExpression();
                        if (!peek() || peek().value !== ')') return NaN;
                        consume();
                    } else {
                        arg = parseUnary();
                    }
                    return applyTrigFunc(fn, arg);
                }

                if (token.type === 'num') {
                    consume();
                    return token.value;
                }

                if (token.value === '(') {
                    consume();
                    const val = parseExpression();
                    if (!peek() || peek().value !== ')') return NaN;
                    consume();
                    return val;
                }
                return NaN;
            }

            const result = parseExpression();
            if (pos !== normalized.length || !Number.isFinite(result)) return null;
            return Number(result.toPrecision(12));
        } catch (e) {
            return null;
        }
    }

    /* ============ INSERCIÓN Y EDICIÓN EN LA POSICIÓN DEL CURSOR ============ */
    function insertAtCursor(str) {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
        }
        const { start, end } = getRawSelectionRange();
        rawExpr = rawExpr.slice(0, start) + str + rawExpr.slice(end);
        updateDisplay(start + str.length);
    }

    function insertDigit(digit) {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
        }
        const { start, end } = getRawSelectionRange();
        const before = rawExpr.slice(0, start);
        const after  = rawExpr.slice(end);
        const needMult = before.length > 0 && /[)%!πe]$/.test(before);
        const insertStr = (needMult ? '×' : '') + digit;
        rawExpr = before + insertStr + after;
        updateDisplay(start + insertStr.length);
    }

    function insertDecimal() {
        if (justCalculated) {
            rawExpr = '0.';
            justCalculated = false;
            updateDisplay(2);
            return;
        }
        const { start, end } = getRawSelectionRange();
        const before = rawExpr.slice(0, start);
        const after  = rawExpr.slice(end);

        const matchBefore = before.match(/[0-9.]+$/);
        const matchAfter  = after.match(/^[0-9.]+/);
        const currentNumber = (matchBefore ? matchBefore[0] : '') + (matchAfter ? matchAfter[0] : '');

        if (currentNumber.includes('.')) return;

        let insertStr = '.';
        if (before.length > 0 && /[)%!πe]$/.test(before)) {
            insertStr = '×0.';
        } else if (!matchBefore) {
            insertStr = '0.';
        }

        rawExpr = before + insertStr + after;
        updateDisplay(start + insertStr.length);
    }

    function insertOperator(op) {
        if (justCalculated) justCalculated = false;
        const { start, end } = getRawSelectionRange();
        let before = rawExpr.slice(0, start);
        const after = rawExpr.slice(end);

        if (op === '%') {
            if (!before || !/[0-9)!πe]$/.test(before)) return;
            rawExpr = before + '%' + after;
            updateDisplay(start + 1);
            return;
        }

        if (before === '' && after === '') {
            if (op === '-') {
                rawExpr = '-';
                updateDisplay(1);
            }
            return;
        }

        if (before === '-') return;

        if (before.length > 0 && /[+\-×÷^]$/.test(before)) {
            if (op === '-' && /[×÷^]$/.test(before)) {
                rawExpr = before + '-' + after;
                updateDisplay(start + 1);
                return;
            }
            before = before.replace(/[+\-×÷^]+$/, '');
            if (before === '' && op !== '-') {
                rawExpr = after;
                updateDisplay(0);
                return;
            }
        }

        if (before.endsWith('(') && op !== '-') return;

        rawExpr = before + op + after;
        updateDisplay(before.length + 1);
    }

    function addParenthesis() {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
        }
        const { start, end } = getRawSelectionRange();
        const before = rawExpr.slice(0, start);
        const after  = rawExpr.slice(end);

        const openCount  = (before.match(/\(/g) || []).length;
        const closeCount = (before.match(/\)/g) || []).length;
        const lastChar   = before.slice(-1);

        let token = '(';
        if (openCount > closeCount && (/[0-9)%!πe]/.test(lastChar))) {
            token = ')';
        } else if (/[0-9)%!πe]/.test(lastChar)) {
            token = '×(';
        }

        rawExpr = before + token + after;
        updateDisplay(start + token.length);
    }

    function deleteAtCursor() {
        if (justCalculated) {
            justCalculated = false;
            updateDisplay(rawExpr.length);
            return;
        }

        const { start, end } = getRawSelectionRange();
        if (start !== end) {
            rawExpr = rawExpr.slice(0, start) + rawExpr.slice(end);
            updateDisplay(start);
            return;
        }

        if (start === 0) return;
        const before = rawExpr.slice(0, start);
        const multiTokens = ['sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', 'abs(', 'ʸ√(', '√(', '∛('];
        for (const tok of multiTokens) {
            if (before.endsWith(tok)) {
                rawExpr = before.slice(0, -tok.length) + rawExpr.slice(end);
                updateDisplay(start - tok.length);
                return;
            }
        }

        rawExpr = rawExpr.slice(0, start - 1) + rawExpr.slice(end);
        updateDisplay(start - 1);
    }

    function clearAll() {
        rawExpr = '';
        previewEl.textContent = '';
        justCalculated = false;
        updateDisplay(0);
    }

    function showStampToast(stamp) {
        const toastEl = document.getElementById('stampToast');
        const iconEl = document.getElementById('stampToastIcon');
        const titleEl = document.getElementById('stampToastTitle');
        const nameEl = document.getElementById('stampToastName');
        if (!toastEl || !iconEl || !titleEl || !nameEl) return;

        iconEl.innerHTML = stamp.iconSvg;
        titleEl.textContent = `¡ESTAMPITA #${stamp.num} DESBLOQUEADA!`;
        nameEl.textContent = stamp.name;

        playAchievementDing();

        toastEl.classList.add('visible');
        if (stampToastTimer) clearTimeout(stampToastTimer);
        stampToastTimer = setTimeout(() => {
            toastEl.classList.remove('visible');
        }, 4000);

    function checkAndUnlockStamp(stampId) {
        if (!stampId) return false;
        if (unlockedStamps.includes(stampId)) return false;

        const stamp = ALL_STAMP_ACHIEVEMENTS.find(s => s.id === stampId);
        if (!stamp) return false;

        unlockedStamps.push(stampId);
        try {
            localStorage.setItem('calc_unlocked_stamps', JSON.stringify(unlockedStamps));
        } catch (e) {}

        showStampToast(stamp);
        return true;
    }

    function evaluateAchievements(cleanExpr, numericResult) {
        const compact = cleanExpr.replace(/,/g, '').replace(/\s+/g, '');

        /* Álbum 1: Uso Cotidiano (Nivel Fácil) */
        if (/^1\+1$/.test(compact) && numericResult === 2) {
            checkAndUnlockStamp('el_origen');
        }
        if (/[0-9)%!πe]-[0-9(√∛πe]/.test(compact) || /^-?\d+(?:\.\d+)?-\d+/.test(compact)) {
            checkAndUnlockStamp('la_perdida');
        }
        if (compact.includes('×')) {
            checkAndUnlockStamp('la_expansion');
        }
        if (compact.includes('÷')) {
            checkAndUnlockStamp('el_reparto');
        }
        if (compact.includes('%')) {
            checkAndUnlockStamp('la_fraccion_todo');
        }
        if (compact.includes('√')) {
            checkAndUnlockStamp('desde_la_raiz');
        }
        if (compact.includes('(') && compact.includes(')')) {
            checkAndUnlockStamp('el_refugio');
        }
        if (compact.includes('^')) {
            checkAndUnlockStamp('el_impulso');
        }
        if (compact.includes('π') || /(?:^|[^0-9.])3\.14(?:[^0-9]|$)/.test(compact) || Math.abs(numericResult - Math.PI) < 1e-6) {
            checkAndUnlockStamp('el_circulo_infinito');
        }

        /* Álbum 2: Uso Avanzado (Nivel Medio) */
        if (isDeg && /^sin\(?30\)?$/.test(compact) && Math.abs(numericResult - 0.5) < 1e-9) {
            checkAndUnlockStamp('la_mitad_perfecta');
        }
        if (isDeg && /^tan\(?45\)?$/.test(compact) && Math.abs(numericResult - 1) < 1e-9) {
            checkAndUnlockStamp('el_equilibrio_total');
        }

        /* Álbum 3: Secretos Ocultos (Nivel Difícil) */
        if (compact === '(404040)' || compact === '404040') {
            checkAndUnlockStamp('espiritu_festivo');
        }
        if (compact === '0.7734') {
            checkAndUnlockStamp('mensaje_secreto');
        }
        if (compact === '111111111×111111111' || numericResult === 12345678987654321 || Math.abs(numericResult - 12345678987654320) <= 2) {
            checkAndUnlockStamp('la_gran_piramide');
        }
        if (
            Math.abs(numericResult - 1.618033988749895) < 1e-6 ||
            compact === '(1+√(5))÷2' ||
            compact === '(1+√5)÷2'
        ) {
            checkAndUnlockStamp('la_firma_divina');
        }
    }

    function calculateResult() {
        if (!rawExpr) return;
        const cleanExpr = rawExpr.replace(/[+\-×÷^(]+$/, '');
        if (!cleanExpr) return;

        const compactClean = cleanExpr.replace(/,/g, '').replace(/\s+/g, '');
        if (/÷0(?![.0-9])/.test(compactClean) || /÷\(?0+\)?$/.test(compactClean)) {
            checkAndUnlockStamp('el_abismo');
        }

        const result = evaluateMathExpression(cleanExpr);
        if (result === null) {
            previewEl.textContent = 'Error';
            return;
        }

        lastAns = result;
        const formattedExpr = formatExpressionDisplay(cleanExpr);
        const formattedRes  = formatDisplayValue(result);

        evaluateAchievements(cleanExpr, result);

        const now = new Date();
        const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        history.unshift({
            expression: formattedExpr,
            result: formattedRes,
            rawResult: result.toString(),
            dateKey: todayKey
        });
        if (history.length > 50) history.pop();
        saveHistory();

        rawExpr = result.toString();
        previewEl.textContent = '';
        justCalculated = true;
        updateDisplay(rawExpr.length);
    }

    /* ============ ESCUCHA DE SELECCIÓN Y PEGADO SEGURO EN EL CAMPO ============ */
    exprInput.addEventListener('beforeinput', (e) => {
        if (e.inputType === 'insertFromPaste') return;
        e.preventDefault();
    });

    exprInput.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text') || '';
        const sanitized = pasted
            .replace(/\*/g, '×')
            .replace(/\//g, '÷')
            .replace(/\s+/g, '')
            .replace(/[^0-9+\-×÷.%^!√∛πe()]/g, '')
            .slice(0, 60);
        if (sanitized) {
            insertAtCursor(sanitized);
        }
    });

    /* ============ HISTORIAL AGRUPADO POR FECHAS ============ */
    function formatDateGroupHeader(dateKey) {
        if (!dateKey) return 'Anteriores';
        const now = new Date();
        const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const yesterdayKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;

        if (dateKey === todayKey) return 'Hoy';
        if (dateKey === yesterdayKey) return 'Ayer';

        const parts = dateKey.split('-');
        if (parts.length !== 3) return dateKey;
        const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const day = parseInt(parts[2], 10);
        const monthIdx = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[0], 10);
        const monthName = months[monthIdx] || parts[1];
        return year === now.getFullYear()
            ? `${day} de ${monthName}`
            : `${day} de ${monthName} de ${year}`;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function toggleHistory() {
        historyPanel.classList.toggle('active');
        if (historyPanel.classList.contains('active')) renderHistory();
    }

    function deleteHistoryItem(index, event) {
        if (event) event.stopPropagation();
        if (index < 0 || index >= history.length) return;
        history.splice(index, 1);
        saveHistory();
        renderHistory();
    }

    function renderHistory() {
        if (history.length === 0) {
            historyList.innerHTML = '<div class="empty-history">No hay historial</div>';
            return;
        }

        let html = '';
        let lastGroupLabel = null;

        history.forEach((item, index) => {
            const groupLabel = formatDateGroupHeader(item.dateKey);
            if (groupLabel !== lastGroupLabel) {
                html += `<div class="history-date-group">${escapeHtml(groupLabel)}</div>`;
                lastGroupLabel = groupLabel;
            }
            html += `
                <div class="history-item" data-index="${index}">
                    <button type="button"
                            class="history-delete-btn"
                            onclick="deleteHistoryItem(${index}, event)"
                            aria-label="Eliminar cálculo"
                            title="Eliminar cálculo">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                    <div class="history-item-content">
                        <div class="history-expr">${escapeHtml(item.expression)}</div>
                        <div class="history-res">= ${escapeHtml(item.result)}</div>
                    </div>
                </div>
            `;
        });

        historyList.innerHTML = html;

        historyList.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = Number(el.dataset.index);
                const selected = history[idx];
                if (selected) {
                    rawExpr = selected.rawResult;
                    justCalculated = false;
                    updateDisplay(rawExpr.length);
                    toggleHistory();
                }
            });
        });
    }

    function saveHistory() {
        try {
            localStorage.setItem('calc_history', JSON.stringify(history));
        } catch (e) {}
    }

    function clearHistory() {
        history = [];
        try {
            localStorage.removeItem('calc_history');
        } catch (e) {}
        renderHistory();
    }

    /* ============ SOPORTE PARA TECLADO FÍSICO (PC) ============ */
    document.addEventListener('keydown', (e) => {
        if (modalOverlay.classList.contains('active')) {
            if (e.key === 'Escape') {
                if (modalTitle.textContent === 'Color del teclado') cancelColorSelection();
                else closeModal();
            }
            return;
        }
        if (historyPanel.classList.contains('active')) {
            if (e.key === 'Escape') toggleHistory();
            return;
        }
        if (overflowMenu.classList.contains('active')) {
            if (e.key === 'Escape') closeMenu();
            return;
        }
        if (typeof conv_overlayEl !== 'undefined' && conv_overlayEl && conv_overlayEl.style.display === 'flex') {
            if (e.key === 'Escape') {
                if (conv_openDropdownId) conv_closeAllDropdowns();
                else conv_close();
                return;
            }
            if (e.key >= '0' && e.key <= '9') { e.preventDefault(); conv_pressDigit(e.key); }
            else if (e.key >= 'a' && e.key <= 'f') { e.preventDefault(); conv_pressDigit(e.key.toUpperCase()); }
            else if (e.key >= 'A' && e.key <= 'F') { e.preventDefault(); conv_pressDigit(e.key); }
            else if (e.key === '.' || e.key === ',') { e.preventDefault(); conv_pressDecimal(); }
            else if (e.key === 'Backspace') { e.preventDefault(); conv_backspace(); }
            else if (e.key === 'Delete') { e.preventDefault(); conv_clear(); }
            return;
        }

        if (e.key >= '0' && e.key <= '9') { e.preventDefault(); insertDigit(e.key); }
        else if (e.key === '.' || e.key === ',') { e.preventDefault(); insertDecimal(); }
        else if (e.key === '+') { e.preventDefault(); insertOperator('+'); }
        else if (e.key === '-') { e.preventDefault(); insertOperator('-'); }
        else if (e.key === '*') { e.preventDefault(); insertOperator('×'); }
        else if (e.key === '/') { e.preventDefault(); insertOperator('÷'); }
        else if (e.key === '%') { e.preventDefault(); insertOperator('%'); }
        else if (e.key === '^') { e.preventDefault(); insertAtCursor('^'); }
        else if (e.key === '!') { e.preventDefault(); insertAtCursor('!'); }
        else if (e.key === '(' || e.key === ')') { e.preventDefault(); addParenthesis(); }
        else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculateResult(); }
        else if (e.key === 'Backspace') { e.preventDefault(); deleteAtCursor(); }
        else if (e.key === 'Escape') { e.preventDefault(); clearAll(); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            requestAnimationFrame(() => {
                const { start } = getRawSelectionRange();
                keepCursorVisible(start);
            });
        }
    });

    /* ============ INICIALIZACIÓN SEGURA ============ */
    window.addEventListener('DOMContentLoaded', () => {
        try {
            const savedTheme = localStorage.getItem('calc_theme');
            setTheme(savedTheme === 'light');
        } catch (e) {
            setTheme(false);
        }

        try {
            const savedStamps = JSON.parse(localStorage.getItem('calc_unlocked_stamps') || '[]');
            if (Array.isArray(savedStamps)) {
                const validIds = new Set(ALL_STAMP_ACHIEVEMENTS.map(s => s.id));
                unlockedStamps = savedStamps.filter(id => typeof id === 'string' && validIds.has(id));
            }
        } catch (e) {
            unlockedStamps = [];
        }

        try {
            const savedUnlock = localStorage.getItem('calc_pro_unlocked');
            const savedPro = localStorage.getItem('calc_pro_mode');
            const savedSound = localStorage.getItem('calc_pro_sound');
            const savedEggs = localStorage.getItem('calc_pro_eggs');
            const savedBold = localStorage.getItem('calc_pro_bold');

            isProUnlocked = (savedUnlock === '1');
            isProSoundEnabled = (savedSound !== '0');
            isProEasterEggsEnabled = (savedEggs !== '0');
            isProBoldEnabled = (savedBold !== '0');

            setProActive(isProUnlocked && savedPro === '1', false);
        } catch (e) {
            setProActive(false, false);
        }

        try {
            const savedAccent = localStorage.getItem('calc_accent_color');
            if (savedAccent) {
                applyAccentColor(savedAccent, false);
            }
        } catch (e) {}

        try {
            const savedMem = JSON.parse(localStorage.getItem('calc_memory') || 'null');
            if (savedMem && typeof savedMem.value === 'number' && Number.isFinite(savedMem.value)) {
                memoryValue = savedMem.value;
                hasMemory = Boolean(savedMem.active);
            }
        } catch (e) {}
        updateMemoryUI();

        try {
            const saved = JSON.parse(localStorage.getItem('calc_history') || '[]');
            if (Array.isArray(saved)) {
                history = saved
                    .filter(item => item && typeof item.expression === 'string' && typeof item.result === 'string')
                    .map(item => ({
                        expression: item.expression,
                        result: item.result,
                        rawResult: typeof item.rawResult === 'string' ? item.rawResult : item.result.replace(/,/g, ''),
                        dateKey: typeof item.dateKey === 'string' ? item.dateKey : ''
                    }));
            }
        } catch (e) {
            history = [];
        }
        updateDisplay(0);
    });
</script>

    const conv_fromMenuEl     = document.getElementById('conv_fromMenu');
    const conv_toTextEl       = document.getElementById('conv_toText');
    const conv_toMenuEl       = document.getElementById('conv_toMenu');
    const conv_inputEl        = document.getElementById('conv_inputValue');
    const conv_outputEl       = document.getElementById('conv_outputValue');
    const conv_fromSymbolEl   = document.getElementById('conv_fromSymbol');
    const conv_toSymbolEl     = document.getElementById('conv_toSymbol');
    const conv_copyBtnEl      = document.getElementById('conv_copyBtn');

    let conv_currentCat = 'length';
    let conv_fromUnitId = 'm';
    let conv_toUnitId   = 'cm';
    let conv_openDropdownId = null;

    function conv_toggleDropdown(dropdownId) {
        const target = document.getElementById(dropdownId);
        if (!target) return;
        const willOpen = !target.classList.contains('open');
        conv_closeAllDropdowns();
        if (willOpen) {
            target.classList.add('open');
            conv_openDropdownId = dropdownId;
        }
    }

    function conv_closeAllDropdowns() {
        document.querySelectorAll('.conv_dropdown.open').forEach(el => el.classList.remove('open'));
        conv_openDropdownId = null;
    }

    document.addEventListener('click', (e) => {
        if (conv_openDropdownId && !e.target.closest('.conv_dropdown')) {
            conv_closeAllDropdowns();
        }
    });

    function conv_renderCategoryDropdown() {
        const catObj = CONV_CATEGORIES[conv_currentCat];
        if (!catObj) return;
        if (conv_catIconEl) conv_catIconEl.innerHTML = catObj.iconSvg;
        if (conv_catTextEl) conv_catTextEl.textContent = catObj.label;

        if (conv_catMenuEl) {
            conv_catMenuEl.innerHTML = Object.entries(CONV_CATEGORIES).map(([key, item]) => `
                <button type="button"
                        class="conv_dropdown_option ${key === conv_currentCat ? 'selected' : ''}"
                        onclick="conv_selectCategory('${key}')"
                        role="option"
                        aria-selected="${key === conv_currentCat}">
                    <span class="conv_option_left">
                        <span class="conv_cat_icon">${item.iconSvg}</span>
                        <span>${item.label}</span>
                    </span>
                </button>
            `).join('');
        }
    }

    function conv_renderUnitDropdowns() {
        const catObj = CONV_CATEGORIES[conv_currentCat];
        if (!catObj) return;

        const fromObj = catObj.units.find(u => u.id === conv_fromUnitId) || catObj.units[0];
        const toObj   = catObj.units.find(u => u.id === conv_toUnitId) || catObj.units[1] || catObj.units[0];
        conv_fromUnitId = fromObj.id;
        conv_toUnitId   = toObj.id;

        if (conv_fromTextEl) conv_fromTextEl.textContent = fromObj.name;
        if (conv_toTextEl)   conv_toTextEl.textContent   = toObj.name;
        if (conv_fromSymbolEl) conv_fromSymbolEl.textContent = fromObj.symbol;
        if (conv_toSymbolEl)   conv_toSymbolEl.textContent   = toObj.symbol;

        if (conv_fromMenuEl) {
            conv_fromMenuEl.innerHTML = catObj.units.map(u => `
                <button type="button"
                        class="conv_dropdown_option ${u.id === conv_fromUnitId ? 'selected' : ''}"
                        onclick="conv_selectFromUnit('${u.id}')"
                        role="option"
                        aria-selected="${u.id === conv_fromUnitId}">
                    <span>${u.name}</span>
                    <span class="conv_option_sym">${u.symbol}</span>
                </button>
            `).join('');
        }

        if (conv_toMenuEl) {
            conv_toMenuEl.innerHTML = catObj.units.map(u => `
                <button type="button"
                        class="conv_dropdown_option ${u.id === conv_toUnitId ? 'selected' : ''}"
                        onclick="conv_selectToUnit('${u.id}')"
                        role="option"
                        aria-selected="${u.id === conv_toUnitId}">
                    <span>${u.name}</span>
                    <span class="conv_option_sym">${u.symbol}</span>
                </button>
            `).join('');
        }
    }

    function conv_selectCategory(catKey) {
        if (!CONV_CATEGORIES[catKey]) return;
        conv_currentCat = catKey;
        const units = CONV_CATEGORIES[catKey].units;
        conv_fromUnitId = units[0].id;
        conv_toUnitId   = (units[1] || units[0]).id;

        if (catKey === 'numsys') {
            conv_inputEl.value = '10';
        } else if (!conv_inputEl.value || /[A-F]/i.test(conv_inputEl.value)) {
            conv_inputEl.value = '1';
        }

        conv_closeAllDropdowns();
        conv_renderCategoryDropdown();
        conv_renderUnitDropdowns();
        conv_updateKeypadState();
        conv_calculate();
    }

    function conv_selectFromUnit(unitId) {
        conv_fromUnitId = unitId;
        conv_closeAllDropdowns();

        if (conv_currentCat === 'numsys') {
            const radix = conv_getActiveRadix();
            const allowedRegex = radix === 2 ? /[^01]/g
                               : radix === 8 ? /[^0-7]/g
                               : radix === 10 ? /[^0-9]/g
                               : /[^0-9A-Fa-f]/g;
            const cleaned = conv_inputEl.value.toUpperCase().replace(allowedRegex, '');
            conv_inputEl.value = cleaned || '0';
        }

        conv_renderUnitDropdowns();
        conv_updateKeypadState();
        conv_calculate();
    }

    function conv_selectToUnit(unitId) {
        conv_toUnitId = unitId;
        conv_closeAllDropdowns();
        conv_renderUnitDropdowns();
        conv_calculate();
    }

    function conv_getActiveRadix() {
        if (conv_currentCat !== 'numsys') return 10;
        const unit = CONV_CATEGORIES.numsys.units.find(u => u.id === conv_fromUnitId);
        return unit ? unit.radix : 10;
    }

    function conv_updateKeypadState() {
        const keypadEl = document.querySelector('.conv_keypad');
        if (!keypadEl) return;

        const isNumSys = (conv_currentCat === 'numsys');
        const radix = conv_getActiveRadix();
        let hexBar = keypadEl.querySelector('.conv_hex_bar');

        if (isNumSys && radix === 16) {
            keypadEl.classList.add('conv_hex_mode');
            if (!hexBar) {
                hexBar = document.createElement('div');
                hexBar.className = 'conv_hex_bar';
                ['A', 'B', 'C', 'D', 'E', 'F'].forEach(letter => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'conv_key conv_key_hex';
                    btn.textContent = letter;
                    btn.setAttribute('onmousedown', 'event.preventDefault()');
                    btn.onclick = () => conv_pressDigit(letter);
                    hexBar.appendChild(btn);
                });
                keypadEl.insertBefore(hexBar, keypadEl.firstChild);
            }
        } else {
            keypadEl.classList.remove('conv_hex_mode');
            if (hexBar) hexBar.remove();
        }

        keypadEl.querySelectorAll('.conv_key_num').forEach(btn => {
            const label = btn.textContent.trim();
            if (label === '.') {
                btn.disabled = isNumSys;
                return;
            }
            const digitVal = parseInt(label, 10);
            if (!Number.isNaN(digitVal)) {
                btn.disabled = isNumSys && digitVal >= radix;
            }
        });

        const signBtn = keypadEl.querySelector('[onclick="conv_toggleSign()"]');
        if (signBtn) {
            signBtn.disabled = isNumSys;
        }
    }

    function conv_open() {
        if (typeof closeMenu === 'function') closeMenu();
        conv_renderCategoryDropdown();
        conv_renderUnitDropdowns();
        conv_updateKeypadState();
        conv_calculate();
        conv_overlayEl.style.display = 'flex';
        conv_overlayEl.setAttribute('aria-hidden', 'false');
    }

    function conv_close() {
        conv_closeAllDropdowns();
        conv_overlayEl.style.display = 'none';
        conv_overlayEl.setAttribute('aria-hidden', 'true');
    }

    /* ============ TECLADO NUMÉRICO INTERACTIVO DEL CONVERSOR ============ */
    function conv_handleManualInput() {
        if (conv_currentCat === 'numsys') {
            const radix = conv_getActiveRadix();
            const allowedRegex = radix === 2 ? /[^01]/g
                               : radix === 8 ? /[^0-7]/g
                               : radix === 10 ? /[^0-9]/g
                               : /[^0-9A-Fa-f]/g;
            conv_inputEl.value = conv_inputEl.value.toUpperCase().replace(allowedRegex, '');
        } else {
            let cleaned = conv_inputEl.value.replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
            if (cleaned.indexOf('-') > 0) {
                cleaned = cleaned.replace(/-/g, '');
            }
            const firstDot = cleaned.indexOf('.');
            if (firstDot !== -1) {
                cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
            }
            conv_inputEl.value = cleaned;
        }
        conv_calculate();
    }

    function conv_pressDigit(digit) {
        const upperDigit = String(digit).toUpperCase();
        if (conv_currentCat === 'numsys') {
            const radix = conv_getActiveRadix();
            const parsedDigit = parseInt(upperDigit, 16);
            if (Number.isNaN(parsedDigit) || parsedDigit >= radix) return;

            const current = conv_inputEl.value.toUpperCase();
            if (current === '' || current === '0') {
                conv_inputEl.value = upperDigit;
            } else if (current.length < 24) {
                conv_inputEl.value = current + upperDigit;
            }
            conv_calculate();
            return;
        }

        if (!/^[0-9]$/.test(upperDigit)) return;
        const current = conv_inputEl.value;
        if (current === '' || current === '0') {
            conv_inputEl.value = upperDigit;
        } else if (current === '-0') {
            conv_inputEl.value = '-' + upperDigit;
        } else if (current.length < 18) {
            conv_inputEl.value = current + upperDigit;
        }
        conv_calculate();
    }

    function conv_pressDecimal() {
        if (conv_currentCat === 'numsys') return;
        const current = conv_inputEl.value;
        if (current.includes('.')) return;
        if (current === '' || current === '-') {
            conv_inputEl.value = current + '0.';
        } else if (current.length < 18) {
            conv_inputEl.value = current + '.';
        }
        conv_calculate();
    }

    function conv_backspace() {
        const current = conv_inputEl.value;
        if (!current || current === '0') {
            conv_inputEl.value = '0';
            conv_calculate();
            return;
        }
        const next = current.slice(0, -1);
        conv_inputEl.value = (next === '' || next === '-') ? '0' : next;
        conv_calculate();
    }

    function conv_toggleSign() {
        if (conv_currentCat === 'numsys') return;
        const current = conv_inputEl.value;
        if (!current || current === '0' || current === '0.') return;
        if (current.startsWith('-')) {
            conv_inputEl.value = current.slice(1);
        } else {
            conv_inputEl.value = '-' + current;
        }
        conv_calculate();
    }

    function conv_convertTemperature(val, fromId, toId) {
        if (fromId === toId) return val;
        let celsius = val;
        if (fromId === 'f') celsius = (val - 32) * (5 / 9);
        else if (fromId === 'k') celsius = val - 273.15;

        if (toId === 'c') return celsius;
        if (toId === 'f') return (celsius * (9 / 5)) + 32;
        if (toId === 'k') return celsius + 273.15;
        return val;
    }

    function conv_formatNumber(num) {
        if (!Number.isFinite(num)) return 'Error';
        if (Object.is(num, -0) || Math.abs(num) === 0) return '0';
        const abs = Math.abs(num);
        if (abs >= 1e12 || abs < 1e-8) {
            return num.toExponential(8).replace(/\.?0+e/, 'e');
        }
        return Number(num.toPrecision(10)).toString();
    }

    function conv_calculate() {
        const catObj = CONV_CATEGORIES[conv_currentCat];
        if (!catObj) return;

        const fromUnit = catObj.units.find(u => u.id === conv_fromUnitId);
        const toUnit   = catObj.units.find(u => u.id === conv_toUnitId);
        if (!fromUnit || !toUnit) return;

        if (conv_currentCat === 'numsys') {
            const rawBaseStr = conv_inputEl.value.trim().toUpperCase();
            if (rawBaseStr === '') {
                conv_outputEl.textContent = '0';
                return;
            }
            const parsedInt = parseInt(rawBaseStr, fromUnit.radix);
            if (Number.isNaN(parsedInt) || parsedInt < 0) {
                conv_outputEl.textContent = '0';
                return;
            }
            conv_outputEl.textContent = parsedInt.toString(toUnit.radix).toUpperCase();
            return;
        }

        const rawStr = conv_inputEl.value.trim().replace(/,/g, '.');
        if (rawStr === '' || rawStr === '-' || rawStr === '.' || rawStr === '-.') {
            conv_outputEl.textContent = '0';
            return;
        }

        const numVal = Number(rawStr);
        if (!Number.isFinite(numVal)) {
            conv_outputEl.textContent = '0';
            return;
        }

        let converted = 0;
        if (conv_currentCat === 'temperature') {
            converted = conv_convertTemperature(numVal, fromUnit.id, toUnit.id);
        } else {
            const inBaseUnit = numVal * fromUnit.factor;
            converted = inBaseUnit / toUnit.factor;
        }

        conv_outputEl.textContent = conv_formatNumber(converted);
    }

    let conv_hasSwappedUnits = false;

    function conv_swapUnits() {
        conv_hasSwappedUnits = true;
        const prevFrom = conv_fromUnitId;
        conv_fromUnitId = conv_toUnitId;
        conv_toUnitId   = prevFrom;

        if (conv_currentCat === 'numsys') {
            const radix = conv_getActiveRadix();
            const allowedRegex = radix === 2 ? /[^01]/g
                               : radix === 8 ? /[^0-7]/g
                               : radix === 10 ? /[^0-9]/g
                               : /[^0-9A-Fa-f]/g;
            const cleaned = conv_inputEl.value.toUpperCase().replace(allowedRegex, '');
            conv_inputEl.value = cleaned || '0';
        }

        conv_renderUnitDropdowns();
        conv_updateKeypadState();
        conv_calculate();
    }

    function conv_clear() {
        conv_inputEl.value = '0';
        conv_outputEl.textContent = '0';
    }

    function conv_copyResult() {
        const resultText = (conv_outputEl.textContent || '').trim();
        if (!resultText) return;

        const showCopiedFeedback = () => {
            if (conv_hasSwappedUnits && typeof checkAndUnlockStamp === 'function') {
            checkAndUnlockStamp('traductor_del_mundo');
        }
        const originalLabel = conv_copyBtnEl.textContent;
        conv_copyBtnEl.textContent = '¡Copiado!';
        setTimeout(() => {
            conv_copyBtnEl.textContent = originalLabel;
        }, 1300);
    };

        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(resultText).then(showCopiedFeedback).catch(() => {
                conv_fallbackCopy(resultText, showCopiedFeedback);
            });
        } else {
            conv_fallbackCopy(resultText, showCopiedFeedback);
        }
    }

    function conv_fallbackCopy(text, onSuccess) {
        try {
            const tempArea = document.createElement('textarea');
            tempArea.value = text;
            tempArea.setAttribute('readonly', '');
            tempArea.style.position = 'fixed';
            tempArea.style.opacity = '0';
            document.body.appendChild(tempArea);
            tempArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempArea);
            if (typeof onSuccess === 'function') onSuccess();
        } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
        conv_renderCategoryDropdown();
        conv_renderUnitDropdowns();
        conv_updateKeypadState();
        conv_calculate();
    });
</script>
</body>
