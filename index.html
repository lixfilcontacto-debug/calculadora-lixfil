    /* ============ SANITIZACIÓN ESTRICTA DE ENTRADA DE PANTALLA ============ */
    function sanitizeExpressionInput(str) {
        if (typeof str !== 'string') return '';
        return str
            .replace(/,/g, '')
            .replace(/\s+/g, '')
            .replace(/\*/g, '×')
            .replace(/[^0-9.+\-×÷/()%!πe^√∛CPAnsihcotalgb⁻¹]/g, '')
            .slice(0, 220);
    }

    /* ============ INICIALIZACIÓN ============ */
    (function init() {
        try {
            const savedTheme = localStorage.getItem('calcTheme');
            if (savedTheme === 'light') {
                calcRoot.classList.add('light-theme');
                if (themeColorMeta) themeColorMeta.setAttribute('content', '#f8f9fa');
            }
            if (localStorage.getItem('calcProUnlocked') === 'true') {
                isProUnlocked = true;
            }
            const savedSound = localStorage.getItem('calcProSound');
            if (savedSound !== null) {
                isProSoundEnabled = savedSound === 'true';
            }
            /* Easter eggs permanecen desactivados para evitar disparos accidentales */
            isProEasterEggsEnabled = false;
            const savedBold = localStorage.getItem('calcProBold');
            if (savedBold !== null) {
                isProBoldEnabled = savedBold === 'true';
            }

            if (isProUnlocked && localStorage.getItem('calcProMode') === 'true') {
                isPro = true;
                calculatorEl.classList.add('pro-open');
            }
            syncProFeaturesUI();
            updateProStatusPill();

            const savedAccent = localStorage.getItem('calcKeyAccent');
            if (isPro && savedAccent && ACCENT_PALETTE.some(c => c.id === savedAccent)) {
                applyKeyAccent(savedAccent, false);
            }
            const saved = localStorage.getItem('calcHistory');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                    history = parsed
                        .filter(x => x && typeof x.expr === 'string' && typeof x.result === 'string')
                        .slice(0, 50)
                        .map(x => ({
                            expr: x.expr.slice(0, 200),
                            result: x.result.slice(0, 80),
                            timestamp: typeof x.timestamp === 'number' && isFinite(x.timestamp) ? x.timestamp : Date.now()
                        }));
                    if (history.length > 0) {
                        const firstClean = Number(history[0].result.replace(/,/g, ''));
                        if (!isNaN(firstClean) && isFinite(firstClean)) {
                            lastAns = firstClean;
                        }
                    }
                }
            }
            const savedMem = localStorage.getItem('calcMemory');
            if (savedMem !== null && savedMem !== '') {
                const numMem = Number(savedMem);
                if (!isNaN(numMem) && isFinite(numMem)) {
                    memoryValue = numMem;
                    hasMemory = true;
                }
            }
            const savedAngle = localStorage.getItem('calcAngleMode');
            if (savedAngle === 'rad') {
                isDeg = false;
            }
        } catch (e) {
            console.warn('localStorage no disponible:', e);
        }

        syncAngleUI();
        syncAnsSdButtons();
        updateMemoryUI();
        renderLandscapeLabels();

        document.querySelectorAll('.sci-btn, .mem-btn, .pro-sci-icon-btn, .sci-toggle-btn, .land-btn').forEach(btn => {
            btn.addEventListener('mousedown', e => e.preventDefault());
        });

        renderHistory();
        syncDisplay(0);
    })();

    /* ============ APARTADO DE VOLUMEN: SONIDO UNIFORME ESTÁNDAR ============ */
    function playDefaultMobileKeyTap(now) {
        const bodyOsc = audioCtx.createOscillator();
        const bodyGain = audioCtx.createGain();
        bodyOsc.type = 'triangle';
        bodyOsc.frequency.setValueAtTime(175, now);
        bodyOsc.frequency.exponentialRampToValueAtTime(58, now + 0.032);

        bodyGain.gain.setValueAtTime(0.0001, now);
        bodyGain.gain.linearRampToValueAtTime(0.085, now + 0.003);
        bodyGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.036);

        bodyOsc.connect(bodyGain);
        bodyGain.connect(audioCtx.destination);

        bodyOsc.start(now);
        bodyOsc.stop(now + 0.038);

        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = 'sine';
        clickOsc.frequency.setValueAtTime(1150, now);
        clickOsc.frequency.exponentialRampToValueAtTime(420, now + 0.020);

        clickGain.gain.setValueAtTime(0.0001, now);
        clickGain.gain.linearRampToValueAtTime(0.045, now + 0.002);
        clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.024);

        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);

        clickOsc.start(now);
        clickOsc.stop(now + 0.026);
    }

    function playKeySound(keyId = null) {
        if (!isPro || !isProSoundEnabled) return;
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            if (!audioCtx) {
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            playDefaultMobileKeyTap(now);
        } catch {}
    }

        if (proBoldPill) {

    function validateProLicenseCode(rawCode) {
        if (typeof rawCode !== 'string') return false;
        const code = rawCode.trim().toUpperCase();
        if (code.length !== 13) return false;
        const validMasterCodes = [
            'PRO-2026-2026',
            'PRO-2026-5SOL',
            'PRO-2026-PERU',
            'PRO-2026-FULL'
        ];
        if (validMasterCodes.includes(code)) return true;
        return /^PRO-2026-[A-Z0-9]{4}$/.test(code);
    }

    async function pasteLicenseCode() {
        const input = document.getElementById('proLicenseInput');
        const feedback = document.getElementById('licenseFeedback');
        if (!input) return;
        try {
            if (navigator.clipboard && navigator.clipboard.readText) {
                const clipText = await navigator.clipboard.readText();
                if (clipText) {
                    input.value = clipText.replace(/[^a-zA-Z0-9-]/g, '').slice(0, 16).toUpperCase();
                    if (feedback) {
                        feedback.className = 'license-feedback';
                        feedback.textContent = '';
                    }
                    haptic();
                    return;
                }
            }
        } catch {}
        input.focus();
        if (feedback) {
            feedback.className = 'license-feedback error';
            feedback.textContent = 'Pega el código manualmente en el recuadro.';
        }
    }

    function openHelpBook(bookId, pageIndex = 0) {
        const book = HELP_BOOKS_DATA[bookId];
        if (!book) return;
        if (book.isProBook && !isPro) return;

        activeHelpBookId = bookId;
        modalCard.classList.add('help-reader-mode');

        activeHelpPageIndex = Math.max(0, Math.min(book.pages.length - 1, pageIndex));
        renderHelpBookPage();
        haptic();
    }

    function renderHelpBookPage() {
        const book = HELP_BOOKS_DATA[activeHelpBookId];
        if (!book) return;

        const totalPages = book.pages.length;
        const page = book.pages[activeHelpPageIndex];
        const isFirst = activeHelpPageIndex === 0;
        const isLast = activeHelpPageIndex === totalPages - 1;

        modalTitle.innerHTML = `
            <button type="button" class="help-book-back" onclick="renderHelpBookShelf()" aria-label="Volver a libros">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${book.headerTitle}</span>
        `;

        const emblemClasses = ['book-page-emblem'];
        if (page.emblemClass) {
            emblemClasses.push(page.emblemClass);
        } else if (book.isProBook) {
            emblemClasses.push('pro-emblem');
        }

        const emblemContent = page.emblemSvg ? page.emblemSvg : (page.emblem || '');

        const dotsHTML = book.pages.map((_, idx) => {
            const activeClass = idx === activeHelpPageIndex ? 'active' : '';
            const proDotClass = book.isProBook ? 'pro-dot' : '';
            return `<button type="button" class="book-dot ${proDotClass} ${activeClass}" onclick="goToHelpBookPage(${idx})" aria-label="Página ${idx + 1}"></button>`;
        }).join('');

        modalBody.innerHTML = `
            <div class="book-reader-wrapper" id="bookReaderWrapper">
                <div class="book-page-card ${book.isProBook ? 'pro-page-card' : ''}">
                    <div class="${emblemClasses.join(' ')}">${emblemContent}</div>
                    <h4 class="book-page-title">${page.title}</h4>
                    <p class="book-page-desc">${page.desc}</p>
                    <div class="book-page-example-box">
                        ${page.diagram}
                        <div class="book-page-steps">${page.steps}</div>
                    </div>
                </div>
                <div class="book-dots-row" role="tablist" aria-label="Páginas del libro">
                    ${dotsHTML}
                </div>
            </div>
        `;

        const nextLabel = isLast ? 'Libros' : 'Siguiente';
        const nextAction = isLast ? 'renderHelpBookShelf()' : 'nextHelpBookPage()';
        const proPillClass = book.isProBook ? 'pro-pill' : '';

        modalActions.innerHTML = `
            <div class="book-nav-actions">
                <button type="button" class="book-nav-btn" onclick="prevHelpBookPage()" ${isFirst ? 'disabled' : ''}>Anterior</button>
                <button type="button" class="book-nav-btn next-pill ${proPillClass}" onclick="${nextAction}">${nextLabel}</button>
            </div>
        `;

        const readerEl = document.getElementById('bookReaderWrapper');
        if (readerEl) {
            readerEl.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches.length === 1) {
                    helpTouchStartX = e.touches[0].clientX;
                }
            }, { passive: true });
            readerEl.addEventListener('touchend', (e) => {
                if (helpTouchStartX === null || !e.changedTouches || e.changedTouches.length === 0) return;
                const deltaX = e.changedTouches[0].clientX - helpTouchStartX;
                helpTouchStartX = null;
                if (Math.abs(deltaX) > 42) {
                    if (deltaX < 0) nextHelpBookPage();
                    else prevHelpBookPage();
                }
            }, { passive: true });
        }
    }

    function goToHelpBookPage(index) {
        const book = HELP_BOOKS_DATA[activeHelpBookId];
        if (!book) return;
        if (index >= 0 && index < book.pages.length && index !== activeHelpPageIndex) {
            activeHelpPageIndex = index;
            renderHelpBookPage();
            haptic();
        }
    }

    function prevHelpBookPage() {
        if (activeHelpPageIndex > 0) {
            activeHelpPageIndex--;
            renderHelpBookPage();
            haptic();
        }
    }

    function nextHelpBookPage() {
        const book = HELP_BOOKS_DATA[activeHelpBookId];
        if (!book) return;
        if (activeHelpPageIndex < book.pages.length - 1) {
            activeHelpPageIndex++;
            renderHelpBookPage();
            haptic();
        }
    }

    function gcdIntegers(x, y) {
        let a = Math.abs(x);
        let b = Math.abs(y);
        while (b !== 0) {
            const t = b;
            b = a % b;
            a = t;
        }
        return a || 1;
    }

    function reduceExactFraction(num, den) {
        if (den === 0) return null;
        if (num === 0) return { n: 0, d: 1 };
        if (Number.isInteger(num) && Number.isInteger(den) && Math.abs(num) <= 1e14 && Math.abs(den) <= 1e14) {
            const g = gcdIntegers(num, den);
            let sn = num / g;
            let sd = den / g;
            if (sd < 0) {
                sn = -sn;
                sd = -sd;
            }
            return { n: sn, d: sd };
        }
        return null;
    }

    function decimalToExactFractionPair(val) {
        if (!isFinite(val)) return null;
        if (Number.isInteger(val)) return { n: val, d: 1 };
        const str = val.toString();
        if (!str.includes('e') && !str.includes('E') && str.includes('.')) {
            const parts = str.split('.');
            const decLen = parts[1].length;
            if (decLen <= 8) {
                const scale = Math.pow(10, decLen);
                const rawN = Math.round(val * scale);
                return reduceExactFraction(rawN, scale);
            }
        }
        const fracStr = decimalToFractionString(val);
        if (fracStr && fracStr.includes('/')) {
            const [fn, fd] = fracStr.split('/').map(Number);
            if (isFinite(fn) && isFinite(fd) && fd !== 0) {
                return reduceExactFraction(fn, fd);
            }
        }
        return null;
    }

    function computeFractionOperation() {
        const count = fractionItems.length;
        if (count === 0) return { status: 'empty' };

        const firstNumStr = fractionItems[0].num.trim().replace(',', '.');
        const firstDenStr = fractionItems[0].den.trim().replace(',', '.');

        if (!firstNumStr || !firstDenStr) {
            return { status: 'empty', message: 'Ingresa numerador y denominador de la fracción 1' };
        }

        const activeFractions = [];
        const activeOps = [];

        for (let i = 0; i < count; i++) {
            const nStr = fractionItems[i].num.trim().replace(',', '.');
            const dStr = fractionItems[i].den.trim().replace(',', '.');
            const isEmptySlot = (nStr === '' && dStr === '');

            /* En modo inicial de 2 fracciones se permite calcular solo la 1ª si la 2ª está vacía */
            if (count === 2 && i === 1 && isEmptySlot) {
                break;
            }

            if (nStr === '' || dStr === '') {
                return { status: 'incomplete', message: `Completa numerador y denominador de la fracción ${i + 1}` };
            }

            const nVal = Number(nStr);
            const dVal = Number(dStr);
            if (!isFinite(nVal) || !isFinite(dVal)) {
                return { status: 'error', message: `Valores no válidos en la fracción ${i + 1}` };
            }
            if (dVal === 0) {
                return { status: 'error', message: `El denominador de la fracción ${i + 1} no puede ser 0` };
            }

            const numPair = decimalToExactFractionPair(nVal);
            const denPair = decimalToExactFractionPair(dVal);
            let exactPair = null;
            if (numPair && denPair && denPair.n !== 0) {
                exactPair = reduceExactFraction(numPair.n * denPair.d, numPair.d * denPair.n);
            }

            activeFractions.push({
                rawN: nStr,
                rawD: dStr,
                num: nVal,
                den: dVal,
                val: nVal / dVal,
                exact: exactPair
            });

            if (i > 0) {
                activeOps.push(fractionOps[i - 1] || '+');
            }
        }

        if (activeFractions.length === 1) {
            const f0 = activeFractions[0];
            const decVal = f0.val;
            let simpText = '';
            if (f0.exact) {
                simpText = f0.exact.d === 1 ? `${f0.exact.n}` : `${f0.exact.n}/${f0.exact.d}`;
            } else {
                const fracApprox = decimalToFractionString(decVal);
                simpText = fracApprox || `${f0.rawN}/${f0.rawD}`;
            }
            const fA = f0.num < 0 ? `(${f0.rawN})` : f0.rawN;
            const fB = f0.den < 0 ? `(${f0.rawD})` : f0.rawD;
            return {
                status: 'ok',
                isSingle: true,
                simplified: simpText,
                decimal: decVal,
                exprToInsert: `${fA}÷${fB}`
            };
        }

        /* Evaluación respetando precedencia estándar: × y ÷ antes que + y - */
        const terms = [
            {
                val: activeFractions[0].val,
                exact: activeFractions[0].exact
            }
        ];
        const addSubOps = [];

        for (let i = 0; i < activeOps.length; i++) {
            const op = activeOps[i];
            const nextF = activeFractions[i + 1];

            if (op === '×' || op === '÷') {
                if (op === '÷' && nextF.val === 0) {
                    return { status: 'error', message: `No se puede dividir entre 0 (fracción ${i + 2})` };
                }
                const prevTerm = terms[terms.length - 1];
                const newVal = op === '×' ? (prevTerm.val * nextF.val) : (prevTerm.val / nextF.val);
                let newExact = null;
                if (prevTerm.exact && nextF.exact) {
                    if (op === '×') {
                        newExact = reduceExactFraction(
                            prevTerm.exact.n * nextF.exact.n,
                            prevTerm.exact.d * nextF.exact.d
                        );
                    } else if (nextF.exact.n !== 0) {
                        newExact = reduceExactFraction(
                            prevTerm.exact.n * nextF.exact.d,
                            prevTerm.exact.d * nextF.exact.n
                        );
                    }
                }
                terms[terms.length - 1] = { val: newVal, exact: newExact };
            } else {
                addSubOps.push(op);
                terms.push({ val: nextF.val, exact: nextF.exact });
            }
        }

        let totalVal = terms[0].val;
        let totalExact = terms[0].exact;

        for (let i = 0; i < addSubOps.length; i++) {
            const op = addSubOps[i];
            const rightTerm = terms[i + 1];
            totalVal = op === '+' ? (totalVal + rightTerm.val) : (totalVal - rightTerm.val);

            if (totalExact && rightTerm.exact) {
                const resN = op === '+'
                    ? (totalExact.n * rightTerm.exact.d + rightTerm.exact.n * totalExact.d)
                    : (totalExact.n * rightTerm.exact.d - rightTerm.exact.n * totalExact.d);
                const resD = totalExact.d * rightTerm.exact.d;
                totalExact = reduceExactFraction(resN, resD);
            } else {
                totalExact = null;
            }
        }

        if (!isFinite(totalVal) || isNaN(totalVal)) {
            return { status: 'error', message: 'Operación matemática no definida' };
        }

        let simpText = '';
        let exprInsert = '';

        if (totalExact) {
            if (totalExact.d === 1) {
                simpText = `${totalExact.n}`;
                exprInsert = `${totalExact.n}`;
            } else {
                simpText = `${totalExact.n}/${totalExact.d}`;
                exprInsert = `${totalExact.n < 0 ? `(${totalExact.n})` : totalExact.n}÷${totalExact.d}`;
            }
        } else {
            const fracApprox = decimalToFractionString(totalVal);
            simpText = fracApprox || formatNumber(totalVal);
            if (fracApprox && fracApprox.includes('/')) {
                const [fn, fd] = fracApprox.split('/');
                exprInsert = `${Number(fn) < 0 ? `(${fn})` : fn}÷${fd}`;
            } else {
                exprInsert = formatNumber(totalVal).replace(/,/g, '');
            }
        }

        return {
            status: 'ok',
            isSingle: false,
            simplified: simpText,
            decimal: totalVal,
            exprToInsert: exprInsert
        };
    }

    function updateFractionPreview() {

            return;

    function decimalToFractionString(val) {
        if (!isFinite(val)) return null;
        if (Number.isInteger(val)) return null;

        const sign = val < 0 ? '-' : '';
        const absVal = Math.abs(val);
        const maxDen = 10000;
        let h1 = 1, h2 = 0;
        let k1 = 0, k2 = 1;
        let b = absVal;

        do {
            const a = Math.floor(b);
            let aux = h1;
            h1 = a * h1 + h2;
            h2 = aux;
            aux = k1;
            k1 = a * k1 + k2;
            k2 = aux;
            const diff = b - a;
            if (diff < 1e-12) break;
            b = 1 / diff;
        } while (Math.abs(absVal - h1 / k1) > absVal * 1e-9 && k1 <= maxDen);

        if (k1 > 1 && k1 <= maxDen && Math.abs(absVal - h1 / k1) <= 1e-7) {
            return `${sign}${h1}/${k1}`;
        }
        return null;
    }

    function toggleFractionDecimal() {
        const clean = rawExpr.trim();
        if (!clean) {
            haptic();
            return;
        }

        const fracMatch = clean.match(/^(-?\d+(?:\.\d+)?)\s*[÷/]\s*(-?\d+(?:\.\d+)?)$/);
        if (fracMatch) {
            const num = Number(fracMatch[1]);
            const den = Number(fracMatch[2]);
            if (isFinite(num) && isFinite(den) && den !== 0) {
                const dec = formatNumber(num / den).replace(/,/g, '');
                rawExpr = dec;
                justCalculated = false;
                syncDisplay(rawExpr.length);
                haptic();
                return;
            }
        }

        const evalVal = evaluateExpression(clean);
        if (evalVal !== null && isFinite(evalVal) && !Number.isInteger(evalVal)) {
            const fracStr = decimalToFractionString(evalVal);
            if (fracStr) {
                rawExpr = fracStr.replace('/', '÷');
                justCalculated = false;
                syncDisplay(rawExpr.length);
                haptic();
                return;
            }
        }
        haptic();
    }

    /* ============ FORMATEO CON COMAS Y MAPEO DE CURSOR ============ */
    function formatWithCommas(raw) {
        if (!raw) return '';
        let out = '';
        let i = 0;
        while (i < raw.length) {
            const ch = raw[i];
            if ((ch >= '0' && ch <= '9') || ch === '.') {
                let start = i;
                while (i < raw.length && ((raw[i] >= '0' && raw[i] <= '9') || raw[i] === '.')) {
                    i++;
                }
                const numToken = raw.slice(start, i);
                const dotIdx = numToken.indexOf('.');
                if (dotIdx === -1) {
                    out += numToken.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                } else {
                    const intPart = numToken.slice(0, dotIdx);
                    const decPart = numToken.slice(dotIdx);
                    out += intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + decPart;
                }
            } else {
                out += ch;
                i++;
            }
        }
        return out;
    }

    function formattedToRawIndex(formattedStr, formattedPos) {
        let rawCount = 0;
        for (let i = 0; i < formattedPos && i < formattedStr.length; i++) {
            if (formattedStr[i] !== ',') {
                rawCount++;
            }
        }
        return rawCount;
    }

    function rawToFormattedIndex(formattedStr, rawPos) {
        if (rawPos <= 0) return 0;
        let rawCount = 0;
        for (let i = 0; i < formattedStr.length; i++) {
            if (formattedStr[i] !== ',') {
                rawCount++;
                if (rawCount === rawPos) {
                    return i + 1;
                }
            }
        }
        return formattedStr.length;
    }

    function getRawSelection() {
        const val = exprInput.value;
        const startF = exprInput.selectionStart ?? val.length;
        const endF   = exprInput.selectionEnd ?? val.length;
        return {
            start: formattedToRawIndex(val, startF),
            end:   formattedToRawIndex(val, endF)
        };
    }

    function syncDisplay(newRawCursorPos) {
        const formatted = formatWithCommas(rawExpr);
        exprInput.value = formatted;
        adjustFontSize();

        const targetPos = (typeof newRawCursorPos === 'number') ? newRawCursorPos : rawExpr.length;
        const formattedPos = rawToFormattedIndex(formatted, targetPos);
        try {
            exprInput.setSelectionRange(formattedPos, formattedPos);
        } catch {}

        if (targetPos === rawExpr.length) {
            exprInput.scrollLeft = exprInput.scrollWidth;
        }
        calculatePreview();
    }

            (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'Home' || key === 'End')) {
            return;
        }
        if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x', 'a'].includes(key.toLowerCase())) {
            return;
        }

        if (key >= '0' && key <= '9') { e.preventDefault(); insertDigit(key); }
        else if (key === '.') { e.preventDefault(); insertDecimal(); }
        else if (key === '+') { e.preventDefault(); insertOperator('+'); }
        else if (key === '-') { e.preventDefault(); insertOperator('-'); }
        else if (key === '*') { e.preventDefault(); insertOperator('×'); }
        else if (key === '/') { e.preventDefault(); insertOperator('÷'); }
        else if (key === '%') { e.preventDefault(); insertOperator('%'); }
        else if (key === '^') { e.preventDefault(); insertAtCursor('^'); }
        else if (key === '!') { e.preventDefault(); insertAtCursor('!'); }
        else if (key === '(') { e.preventDefault(); insertRawSymbol('('); }
        else if (key === ')') { e.preventDefault(); insertRawSymbol(')'); }
        else if (key === 'Enter' || key === '=') { e.preventDefault(); calculateResult(); }
        else if (key === 'Backspace') { e.preventDefault(); deleteAtCursor(); }
        else if (key === 'Delete') { e.preventDefault(); deleteForwardAtCursor(); }

    function adjustFontSize() {

    function insertTrig(fn) {

    function insertAns() {

    function insertPower(exp) {

                syncDisplay(rawExpr.length);
                haptic();

            return;

    function insertNthRoot() {

    function insertExpNotation() {

    function insertRandom() {

    function insertCombPerm(letter) {

    /* ============ INSERCIÓN Y BORRADO RESPETANDO CURSOR / SELECCIÓN ============ */
    function insertAtCursor(text) {
        if (rawExpr === 'Error') {
            rawExpr = '';
        }
        const { start, end } = getRawSelection();
        rawExpr = rawExpr.slice(0, start) + text + rawExpr.slice(end);
        justCalculated = false;
        syncDisplay(start + text.length);
        haptic(text);
    }

    function insertRawSymbol(sym) {
        if (justCalculated) {
            justCalculated = false;
        }
        insertAtCursor(sym);
    }

    function insertDigit(digit) {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
            syncDisplay(0);
        }
        insertAtCursor(digit);
    }

    function insertSpecial(token) {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
            syncDisplay(0);
        }
        insertAtCursor(token);
    }

    function insertDecimal() {
        if (justCalculated || rawExpr === 'Error') {
            rawExpr = '0.';
            justCalculated = false;
            syncDisplay(rawExpr.length);
            haptic('.');
            return;
        }
        const { start } = getRawSelection();
        let left = start - 1;
        while (left >= 0 && ((rawExpr[left] >= '0' && rawExpr[left] <= '9') || rawExpr[left] === '.')) {
            left--;
        }
        let right = start;
        while (right < rawExpr.length && ((rawExpr[right] >= '0' && rawExpr[right] <= '9') || rawExpr[right] === '.')) {
            right++;
        }
        const currentNum = rawExpr.slice(left + 1, right);
        if (currentNum.includes('.')) return;

        const prevChar = start > 0 ? rawExpr[start - 1] : '';
        const prefix = (prevChar >= '0' && prevChar <= '9') ? '.' : '0.';
        insertAtCursor(prefix);
    }

    function insertOperator(op) {
        if (rawExpr === 'Error') rawExpr = '';
        if (justCalculated) justCalculated = false;

        const { start, end } = getRawSelection();
        if (start === 0 && end === 0 && rawExpr === '' && op !== '-') return;

        const basicOps = ['+', '-', '×', '÷'];
        if (start === end && start > 0 && basicOps.includes(op) && basicOps.includes(rawExpr[start - 1])) {
            rawExpr = rawExpr.slice(0, start - 1) + op + rawExpr.slice(start);
            syncDisplay(start);
            haptic(op);
            return;
        }

        insertAtCursor(op);
    }

    function addParenthesis() {
        if (justCalculated || rawExpr === 'Error') {
            rawExpr = '';
            justCalculated = false;
            syncDisplay(0);
        }
        const { start } = getRawSelection();
        const before = rawExpr.slice(0, start);
        const openCount  = (before.match(/\(/g) || []).length;
        const closeCount = (before.match(/\)/g) || []).length;
        const lastChar   = before.slice(-1);

        const canClose = openCount > closeCount &&
            ((lastChar >= '0' && lastChar <= '9') || lastChar === ')' || lastChar === '%' || lastChar === 'π' || lastChar === 'e' || lastChar === '!');
        insertAtCursor(canClose ? ')' : '(');
    }

    function deleteAtCursor() {
        if (rawExpr === 'Error') {
            clearAll();
            return;
        }
        justCalculated = false;
        const { start, end } = getRawSelection();

        if (start !== end) {
            rawExpr = rawExpr.slice(0, start) + rawExpr.slice(end);
            syncDisplay(start);
            haptic();
            return;
        }
        if (start === 0) return;

        const multiTokens = ['sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(', 'sin(', 'cos(', 'tan(', 'log(', 'abs(', 'ln(', '√(', '∛('];
        const before = rawExpr.slice(0, start);
        for (const tok of multiTokens) {
            if (before.endsWith(tok)) {
                const newPos = start - tok.length;
                rawExpr = rawExpr.slice(0, newPos) + rawExpr.slice(start);
                syncDisplay(newPos);
                haptic();
                return;
            }
        }

        rawExpr = rawExpr.slice(0, start - 1) + rawExpr.slice(start);
        syncDisplay(start - 1);
        haptic();
    }

    function deleteForwardAtCursor() {
        if (rawExpr === 'Error') {
            clearAll();
            return;
        }
        justCalculated = false;
        const { start, end } = getRawSelection();
        if (start !== end) {
            rawExpr = rawExpr.slice(0, start) + rawExpr.slice(end);
            syncDisplay(start);
        } else if (start < rawExpr.length) {
            rawExpr = rawExpr.slice(0, start) + rawExpr.slice(start + 1);
            syncDisplay(start);
        }
    }

    function clearAll() {
        rawExpr = '';
        justCalculated = false;
        previewDisplay.textContent = '';
        syncDisplay(0);
        haptic('AC');
    }

    /* ============ EVALUADOR MATEMÁTICO SEGURO (SIN EVAL NI FUNCTION) ============ */
    function factorial(n) {
        if (n < 0 || !Number.isInteger(n)) return NaN;
        if (n > 170) return Infinity;
        let r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        return r;
    }

    function combinations(n, r) {
        if (!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return NaN;
        if (n > 170) return Infinity;
        return Math.round(factorial(n) / (factorial(r) * factorial(n - r)));
    }

    function permutations(n, r) {
        if (!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return NaN;
        if (n > 170) return Infinity;
        return Math.round(factorial(n) / factorial(n - r));
    }

    function sinFn(x)  { return isDeg ? Math.sin(x * Math.PI / 180) : Math.sin(x); }
    function cosFn(x)  {
        if (isDeg && Math.abs(x % 180) === 90) return 0;
        return isDeg ? Math.cos(x * Math.PI / 180) : Math.cos(x);
    }
    function tanFn(x)  {
        if (isDeg && Math.abs(x % 180) === 90) return NaN;
        return isDeg ? Math.tan(x * Math.PI / 180) : Math.tan(x);
    }
    function asinFn(x) { const r = Math.asin(x); return isDeg ? r * 180 / Math.PI : r; }
    function acosFn(x) { const r = Math.acos(x); return isDeg ? r * 180 / Math.PI : r; }
    function atanFn(x) { const r = Math.atan(x); return isDeg ? r * 180 / Math.PI : r; }

    function preprocessRawExpression(expr) {
        let s = expr.replace(/,/g, '').replace(/\s+/g, '');

        s = s.replace(/sin⁻¹\(/g, 'asin(')
             .replace(/cos⁻¹\(/g, 'acos(')
             .replace(/tan⁻¹\(/g, 'atan(')
             .replace(/√\(/g, 'sqrt(')
             .replace(/∛\(/g, 'cbrt(');

        /* Multiplicación implícita segura */
        s = s.replace(/(\d|\)|π|e|!|%)\(/g, '$1×(');
        s = s.replace(/(\d|\)|π|e|!|%)(sin|cos|tan|asin|acos|atan|ln|log|sqrt|cbrt|abs)\(/g, '$1×$2(');
        s = s.replace(/(\d|\)|π|e|!|%)(π|e)/g, '$1×$2');
        s = s.replace(/(π|e|!|\))(\d)/g, '$1×$2');

        /* Autocierre de paréntesis abiertos */
        const openP  = (s.match(/\(/g) || []).length;
        const closeP = (s.match(/\)/g) || []).length;
        if (openP > closeP) {
            s += ')'.repeat(openP - closeP);
        }

        return s;
    }

    function tokenizeMath(s) {
        const tokens = [];
        let i = 0;
        const funcs = ['asin', 'acos', 'atan', 'sqrt', 'cbrt', 'sin', 'cos', 'tan', 'log', 'abs', 'ln'];

        while (i < s.length) {
            const ch = s[i];

            if ((ch >= '0' && ch <= '9') || ch === '.') {
                let start = i;
                let dotCount = 0;
                while (i < s.length && ((s[i] >= '0' && s[i] <= '9') || s[i] === '.')) {
                    if (s[i] === '.') dotCount++;
                    i++;
                }
                if (dotCount > 1) return null;
                const numStr = s.slice(start, i);
                if (numStr === '.') return null;
                tokens.push({ type: 'num', value: Number(numStr) });
                continue;
            }

            if (ch === 'π') {
                tokens.push({ type: 'num', value: Math.PI });
                i++;
                continue;
            }
            if (ch === 'e') {
                tokens.push({ type: 'num', value: Math.E });
                i++;
                continue;
            }

            let matchedFunc = null;
            for (const fn of funcs) {
                if (s.startsWith(fn, i)) {
                    matchedFunc = fn;
                    break;
                }
            }
            if (matchedFunc) {
                tokens.push({ type: 'func', value: matchedFunc });
                i += matchedFunc.length;
                continue;
            }

            if ('+-×÷*/^%!CP()'.includes(ch)) {
                const norm = ch === '*' ? '×' : (ch === '/' ? '÷' : ch);
                tokens.push({ type: 'sym', value: norm });
                i++;
                continue;
            }

            return null;
        }
        return tokens;
    }

    function evaluateExpression(expr) {
        if (!expr) return null;
        if (/[+\-×÷^CP(]$/.test(expr)) return null;

        const prepared = preprocessRawExpression(expr);
        const tokens = tokenizeMath(prepared);
        if (!tokens || tokens.length === 0) return null;

        let pos = 0;

        function peek() {
            return tokens[pos] || null;
        }
        function consume() {
            return tokens[pos++];
        }

        function parseExpression() {
            let left = parseTerm();
            if (left === null) return null;

            while (peek() && peek().type === 'sym' && (peek().value === '+' || peek().value === '-')) {
                const op = consume().value;
                const isPercentTerm = checkTrailingPercentWithoutMulDiv();
                const right = parseTerm();
                if (right === null) return null;

                if (isPercentTerm) {
                    left = op === '+' ? left * (1 + right / 100) : left * (1 - right / 100);
                } else {
                    left = op === '+' ? left + right : left - right;
                }
            }
            return left;
        }

        function checkTrailingPercentWithoutMulDiv() {
            let idx = pos;
            let depth = 0;
            while (idx < tokens.length) {
                const t = tokens[idx];
                if (t.type === 'sym') {
                    if (t.value === '(') depth++;
                    else if (t.value === ')') {
                        if (depth === 0) break;
                        depth--;
                    } else if (depth === 0) {
                        if (t.value === '+' || t.value === '-') break;
                        if (t.value === '×' || t.value === '÷') return false;
                        if (t.value === '%') {
                            const nextT = tokens[idx + 1];
                            if (!nextT || (nextT.type === 'sym' && (nextT.value === '+' || nextT.value === '-' || nextT.value === ')'))) {
                                return true;
                            }
                            return false;
                        }
                    }
                }
                idx++;
            }
            return false;
        }

        function parseTerm() {
            let left = parsePower();
            if (left === null) return null;

            while (peek() && peek().type === 'sym' && (peek().value === '×' || peek().value === '÷' || peek().value === 'C' || peek().value === 'P')) {
                const op = consume().value;
                const right = parsePower();
                if (right === null) return null;

                if (op === '×') left = left * right;
                else if (op === '÷') {
                    if (right === 0) return Infinity;
                    left = left / right;
                } else if (op === 'C') {
                    left = combinations(left, right);
                } else if (op === 'P') {
                    left = permutations(left, right);
                }
            }
            return left;
        }

        function parsePower() {
            const base = parseUnary();
            if (base === null) return null;

            if (peek() && peek().type === 'sym' && peek().value === '^') {
                consume();
                const exp = parsePower();
                if (exp === null) return null;
                return Math.pow(base, exp);
            }
            return base;
        }

        function parseUnary() {
            if (peek() && peek().type === 'sym' && (peek().value === '+' || peek().value === '-')) {
                const sign = consume().value;
                const operand = parseUnary();
                if (operand === null) return null;
                return sign === '-' ? -operand : operand;
            }
            return parsePostfix();
        }

        function parsePostfix() {
            let val = parsePrimary();
            if (val === null) return null;

            while (peek() && peek().type === 'sym' && (peek().value === '!' || peek().value === '%')) {
                const op = consume().value;
                if (op === '!') {
                    val = factorial(val);
                } else if (op === '%') {
                    val = val / 100;
                }
            }
            return val;
        }

        function parsePrimary() {
            const tok = peek();
            if (!tok) return null;

            if (tok.type === 'num') {
                consume();
                return tok.value;
            }

            if (tok.type === 'func') {
                const fnName = consume().value;
                if (!peek() || peek().type !== 'sym' || peek().value !== '(') return null;
                consume();
                const arg = parseExpression();
                if (arg === null) return null;
                if (!peek() || peek().type !== 'sym' || peek().value !== ')') return null;
                consume();
                return applyMathFunc(fnName, arg);
            }

            if (tok.type === 'sym' && tok.value === '(') {
                consume();
                const inner = parseExpression();
                if (inner === null) return null;
                if (!peek() || peek().type !== 'sym' || peek().value !== ')') return null;
                consume();
                return inner;
            }

            return null;
        }

        function applyMathFunc(fn, x) {
            switch (fn) {
                case 'sin':  return sinFn(x);
                case 'cos':  return cosFn(x);
                case 'tan':  return tanFn(x);
                case 'asin': return asinFn(x);
                case 'acos': return acosFn(x);
                case 'atan': return atanFn(x);
                case 'sqrt': return Math.sqrt(x);
                case 'cbrt': return Math.cbrt(x);
                case 'ln':   return Math.log(x);
                case 'log':  return Math.log10(x);
                case 'abs':  return Math.abs(x);
                default:     return NaN;
            }
        }

        try {
            const res = parseExpression();
            if (res === null || pos !== tokens.length) return null;
            if (typeof res !== 'number' || isNaN(res)) return null;
            return res;
        } catch {
            return null;
        }
    }

    function formatNumber(num) {
        if (!isFinite(num)) return 'Error';
        if (Math.abs(num) < 1e-12) num = 0;

        const rounded = Math.round(num * 1e10) / 1e10;
        const parts = rounded.toString().split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.join('.');
    }

    function calculatePreview() {
        if (!rawExpr || rawExpr === 'Error') {
            previewDisplay.textContent = '';
            return;
        }
        const res = evaluateExpression(rawExpr);
        if (res !== null && isFinite(res)) {
            const formatted = formatNumber(res);
            previewDisplay.textContent = (formatted !== formatWithCommas(rawExpr)) ? formatted : '';
        } else {
            previewDisplay.textContent = '';
        }
    }

    function calculateResult() {
        if (!rawExpr || rawExpr === 'Error') return;

        const res = evaluateExpression(rawExpr);
        if (res === null) return;

        const formattedResult = formatNumber(res);
        const formattedExpr   = formatWithCommas(rawExpr);

        if (formattedResult !== 'Error') {
            lastAns = res;
            if (formattedExpr !== formattedResult) {
                history.unshift({
                    expr: formattedExpr,
                    result: formattedResult,
                    timestamp: Date.now()
                });
                if (history.length > 50) history.pop();
                try { localStorage.setItem('calcHistory', JSON.stringify(history)); } catch {}
                renderHistory();
            }
            rawExpr = formattedResult.replace(/,/g, '');
        } else {
            rawExpr = 'Error';
        }

        previewDisplay.textContent = '';
        justCalculated = true;
        syncDisplay(rawExpr.length);
        haptic('=');
    }

    /* ============ GESTIÓN DEL HISTORIAL AGRUPADO POR FECHA ============ */
    function formatHistoryDateLabel(timestamp) {
        if (!timestamp) return 'Anteriores';
        const d = new Date(timestamp);
        if (isNaN(d.getTime())) return 'Anteriores';

        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const itemStart  = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        const diffDays   = Math.round((todayStart - itemStart) / 86400000);

        if (diffDays === 0) return 'Hoy';
        if (diffDays === 1) return 'Ayer';

        const opts = { day: 'numeric', month: 'short' };
        if (d.getFullYear() !== now.getFullYear()) {
            opts.year = 'numeric';
        }
        return d.toLocaleDateString('es-ES', opts);
    }

    function toggleHistory() {
        historyPanel.classList.toggle('active');
        haptic();
    }

    function renderHistory() {
        historyList.innerHTML = '';
        if (history.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty-history';
            empty.textContent = 'No hay operaciones recientes';
            historyList.appendChild(empty);
            return;
        }

        let lastDateLabel = '';

        history.forEach((item, index) => {
            const dateLabel = formatHistoryDateLabel(item.timestamp);
            if (dateLabel !== lastDateLabel) {
                lastDateLabel = dateLabel;
                const groupHeader = document.createElement('div');
                groupHeader.className = 'history-date-group';
                groupHeader.textContent = dateLabel;
                historyList.appendChild(groupHeader);
            }

            const div = document.createElement('div');
            div.className = 'history-item';

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'history-delete-btn';
            delBtn.setAttribute('aria-label', 'Eliminar operación del historial');
            delBtn.title = 'Eliminar';
            delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteHistoryItem(index);
            };

            const contentWrap = document.createElement('div');
            contentWrap.className = 'history-item-content';

            const exprDiv = document.createElement('div');
            exprDiv.className = 'history-expr';
            exprDiv.textContent = item.expr;

            const resDiv = document.createElement('div');
            resDiv.className = 'history-res';
            resDiv.textContent = '= ' + item.result;

            contentWrap.appendChild(exprDiv);
            contentWrap.appendChild(resDiv);

            div.appendChild(delBtn);
            div.appendChild(contentWrap);

            div.onclick = () => {
                rawExpr = sanitizeExpressionInput(item.result);
                justCalculated = false;
                syncDisplay(rawExpr.length);
                toggleHistory();
            };

            historyList.appendChild(div);
        });
    }

    function deleteHistoryItem(index) {
        if (index < 0 || index >= history.length) return;
        history.splice(index, 1);
        try {
            localStorage.setItem('calcHistory', JSON.stringify(history));
        } catch {}
        renderHistory();
        haptic();
    }

    function clearHistory() {
        history = [];
        try { localStorage.removeItem('calcHistory'); } catch {}
        renderHistory();
        haptic();
    }
</script>

                icon: '<svg viewBox="0 0 24 24"><path d="M4 6h16v4H4V6zm0 8h16v4H4v-4zm2-6v2h2V8H6zm0 8v2h2v-2H6z"/></svg>',
                defaultFrom: 'gb',
                defaultTo: 'mb',
                        units: [
            { id: 'bit', name: 'Bits',      symbol: 'bit', factor: 0.125 },
            { id: 'b',   name: 'Bytes',     symbol: 'B',   factor: 1 },
            { id: 'kb',  name: 'Kilobytes', symbol: 'KB',  factor: 1000 },
            { id: 'mb',  name: 'Megabytes', symbol: 'MB',  factor: 1000000 },
            { id: 'gb',  name: 'Gigabytes', symbol: 'GB',  factor: 1000000000 },
            { id: 'tb',  name: 'Terabytes', symbol: 'TB',  factor: 1000000000000 },
            { id: 'pb',  name: 'Petabytes', symbol: 'PB',  factor: 1000000000000000 }
        ]

            },
            sistemas_numericos: {
                name: 'Sistemas Numéricos',
                icon: '<svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>',
                defaultFrom: 'dec',
                defaultTo: 'bin',
                isRadix: true,
                units: [
                    { id: 'dec', name: 'Decimal (Base 10)',     symbol: 'DEC', radix: 10 },
                    { id: 'bin', name: 'Binario (Base 2)',      symbol: 'BIN', radix: 2  },
                    { id: 'oct', name: 'Octal (Base 8)',        symbol: 'OCT', radix: 8  },
                    { id: 'hex', name: 'Hexadecimal (Base 16)', symbol: 'HEX', radix: 16 }
                ]
            }
        };

        let conv_currentCat = 'longitud';
        let conv_fromUnitId = 'm';
        let conv_toUnitId   = 'cm';
        let conv_rawInput   = '1';

        function conv_feedback() {
            if (typeof haptic === 'function') {
                haptic();
            }
        }

        function conv_closeAllDropdowns() {
            document.querySelectorAll('.conv_dropdown.conv_open').forEach(el => {
                el.classList.remove('conv_open');
            });
        }

        window.conv_toggleDropdown = function (dropdownId) {
            const target = document.getElementById(dropdownId);
            if (!target) return;
            const wasOpen = target.classList.contains('conv_open');
            conv_closeAllDropdowns();
            if (!wasOpen) {
                target.classList.add('conv_open');
            }
            conv_feedback();
        };

        function conv_renderCategoryMenu() {
            const catMenu = document.getElementById('conv_catMenu');
            const catText = document.getElementById('conv_catText');
            const catIcon = document.getElementById('conv_catIcon');
            if (!catMenu || !catText || !catIcon) return;

            const activeCatObj = CONV_CATEGORIES[conv_currentCat];
            catText.textContent = activeCatObj.name;
            catIcon.innerHTML = activeCatObj.icon;

            catMenu.innerHTML = Object.keys(CONV_CATEGORIES).map(catKey => {
                const cat = CONV_CATEGORIES[catKey];
                const selectedClass = catKey === conv_currentCat ? 'conv_selected' : '';
                return `
                    <button type="button" class="conv_dropdown_option ${selectedClass}" onclick="conv_selectCategory('${catKey}')">
                        <span class="conv_opt_left">
                            <span class="conv_cat_icon">${cat.icon}</span>
                            <span>${cat.name}</span>
                        </span>
                    </button>
                `;
            }).join('');
        }

        function conv_renderUnitMenus() {
            const catObj = CONV_CATEGORIES[conv_currentCat];
            if (!catObj) return;

            const fromUnit = catObj.units.find(u => u.id === conv_fromUnitId) || catObj.units[0];
            const toUnit   = catObj.units.find(u => u.id === conv_toUnitId)   || catObj.units[1] || catObj.units[0];
            conv_fromUnitId = fromUnit.id;
            conv_toUnitId   = toUnit.id;

            const fromText   = document.getElementById('conv_fromText');
            const fromSymbol = document.getElementById('conv_fromSymbol');
            const fromMenu   = document.getElementById('conv_fromMenu');

            const toText     = document.getElementById('conv_toText');
            const toSymbol   = document.getElementById('conv_toSymbol');
            const toMenu     = document.getElementById('conv_toMenu');

            if (fromText) fromText.textContent = fromUnit.name;
            if (fromSymbol) fromSymbol.textContent = fromUnit.symbol;
            if (toText) toText.textContent = toUnit.name;
            if (toSymbol) toSymbol.textContent = toUnit.symbol;

            if (fromMenu) {
                fromMenu.innerHTML = catObj.units.map(u => `
                    <button type="button" class="conv_dropdown_option ${u.id === conv_fromUnitId ? 'conv_selected' : ''}" onclick="conv_selectFromUnit('${u.id}')">
                        <span>${u.name}</span>
                        <span class="conv_opt_symbol">${u.symbol}</span>
                    </button>
                `).join('');
            }

            if (toMenu) {
                toMenu.innerHTML = catObj.units.map(u => `
                    <button type="button" class="conv_dropdown_option ${u.id === conv_toUnitId ? 'conv_selected' : ''}" onclick="conv_selectToUnit('${u.id}')">
                        <span>${u.name}</span>
                        <span class="conv_opt_symbol">${u.symbol}</span>
                    </button>
                `).join('');
            }
        }

        function conv_syncInputControl() {
            const inp = document.getElementById('conv_inputValue');
            if (!inp) return;
            inp.type = 'text';
            inp.setAttribute('inputmode', 'none');
            inp.value = conv_rawInput;
        }

        window.conv_selectCategory = function (catKey) {
            if (!CONV_CATEGORIES[catKey]) return;
            conv_currentCat = catKey;
            conv_fromUnitId = CONV_CATEGORIES[catKey].defaultFrom;
            conv_toUnitId   = CONV_CATEGORIES[catKey].defaultTo;
            conv_rawInput   = '1';
            conv_closeAllDropdowns();
            conv_renderCategoryMenu();
            conv_renderUnitMenus();
            conv_syncInputControl();
            conv_convert();
            conv_feedback();
        };

        window.conv_selectFromUnit = function (unitId) {
            conv_fromUnitId = unitId;
            conv_closeAllDropdowns();
            conv_renderUnitMenus();
            conv_convert();
            conv_feedback();
        };

        window.conv_selectToUnit = function (unitId) {
            conv_toUnitId = unitId;
            conv_closeAllDropdowns();
            conv_renderUnitMenus();
            conv_convert();
            conv_feedback();
        };

        window.conv_swapUnits = function () {
            const temp = conv_fromUnitId;
            conv_fromUnitId = conv_toUnitId;
            conv_toUnitId   = temp;
            conv_closeAllDropdowns();
            conv_renderUnitMenus();
            conv_convert();
            conv_feedback();
        };

        function conv_formatNumber(num) {
            if (!isFinite(num) || isNaN(num)) return 'Error';
            if (Math.abs(num) < 1e-12) num = 0;
            const abs = Math.abs(num);
            if (abs !== 0 && (abs >= 1e12 || abs < 1e-7)) {
                return num.toExponential(6).replace(/\.?0+e/, 'e');
            }
            const rounded = Math.round(num * 1e10) / 1e10;
            const parts = rounded.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        function conv_convertTemperature(val, fromId, toId) {
            if (fromId === toId) return val;
            let celsius = val;
            if (fromId === 'f') celsius = (val - 32) * 5 / 9;
            else if (fromId === 'k') celsius = val - 273.15;

            if (toId === 'c') return celsius;
            if (toId === 'f') return (celsius * 9 / 5) + 32;
            if (toId === 'k') return celsius + 273.15;
            return val;
        }

        function conv_convertRadix(rawStr, fromUnit, toUnit) {
            const clean = rawStr.trim().toUpperCase();
            if (!clean || clean === '-' || clean === '.' || clean === '-.') return '0';

            const isNeg = clean.startsWith('-');
            const body = isNeg ? clean.slice(1) : clean;
            if (!body) return '0';

            const validators = {
                2:  /^[01]+$/,
                8:  /^[0-7]+$/,
                10: /^[0-9]+$/,
                16: /^[0-9A-F]+$/
            };
            const rx = validators[fromUnit.radix];
            if (!rx || !rx.test(body)) {
                return 'Entrada inválida';
            }

            const parsedInt = parseInt(body, fromUnit.radix);
            if (!isFinite(parsedInt) || isNaN(parsedInt)) {
                return 'Error';
            }
            const converted = parsedInt.toString(toUnit.radix).toUpperCase();
            return (isNeg && parsedInt !== 0 ? '-' : '') + converted;
        }

        window.conv_convert = function () {
            const outEl = document.getElementById('conv_outputValue');
            if (!outEl) return;

            const catObj   = CONV_CATEGORIES[conv_currentCat];
            const fromUnit = catObj.units.find(u => u.id === conv_fromUnitId);
            const toUnit   = catObj.units.find(u => u.id === conv_toUnitId);
            if (!fromUnit || !toUnit) return;

            const strVal = conv_rawInput.trim();
            if (strVal === '' || strVal === '-' || strVal === '.' || strVal === '-.') {
                outEl.textContent = '0';
                return;
            }

            if (catObj.isRadix) {
                outEl.textContent = conv_convertRadix(strVal, fromUnit, toUnit);
                return;
            }

            const numVal = Number(strVal.replace(',', '.'));
            if (!isFinite(numVal) || isNaN(numVal)) {
                outEl.textContent = 'Error';
                return;
            }

            let resultNum = numVal;
            if (catObj.isTemperature) {
                resultNum = conv_convertTemperature(numVal, fromUnit.id, toUnit.id);
            } else {
                const inBase = numVal * fromUnit.factor;
                resultNum = inBase / toUnit.factor;
            }

            outEl.textContent = conv_formatNumber(resultNum);
        };

        /* ============ TECLADO NUMÉRICO PROPIO DEL CONVERSOR (conv_) ============ */
        function conv_applyRawToInput() {
            const inp = document.getElementById('conv_inputValue');
            if (inp) {
                inp.value = conv_rawInput;
            }
            conv_convert();
        }

        window.conv_handleManualInput = function () {
            const inp = document.getElementById('conv_inputValue');
            if (!inp) return;
            const catObj = CONV_CATEGORIES[conv_currentCat];
            let val = inp.value;

            if (catObj && catObj.isRadix) {
                const fromUnit = catObj.units.find(u => u.id === conv_fromUnitId);
                const radix = fromUnit ? fromUnit.radix : 10;
                val = val.toUpperCase();
                if (radix === 2) val = val.replace(/[^01-]/g, '');
                else if (radix === 8) val = val.replace(/[^0-7-]/g, '');
                else if (radix === 16) val = val.replace(/[^0-9A-F-]/g, '');
                else val = val.replace(/[^0-9-]/g, '');
            } else {
                val = val.replace(/,/g, '.').replace(/[^0-9.-]/g, '');
            }

            conv_rawInput = val.slice(0, 24);
            inp.value = conv_rawInput;
            conv_convert();
        };

        window.conv_pressDigit = function (digit) {
            if (typeof digit !== 'string' || !/^[0-9]$/.test(digit)) return;
            const catObj = CONV_CATEGORIES[conv_currentCat];

            if (catObj && catObj.isRadix) {
                const fromUnit = catObj.units.find(u => u.id === conv_fromUnitId);
                const radix = fromUnit ? fromUnit.radix : 10;
                if (parseInt(digit, 10) >= radix) {
                    conv_feedback();
                    return;
                }
            }

            if (conv_rawInput === '0') {
                conv_rawInput = digit;
            } else if (conv_rawInput === '-0') {
                conv_rawInput = '-' + digit;
            } else if (conv_rawInput.length < 22) {
                conv_rawInput += digit;
            }

            conv_applyRawToInput();
            conv_feedback();
        };

        window.conv_pressDecimal = function () {
            const catObj = CONV_CATEGORIES[conv_currentCat];
            if (catObj && catObj.isRadix) {
                conv_feedback();
                return;
            }

            if (conv_rawInput.includes('.')) {
                conv_feedback();
                return;
            }

            if (conv_rawInput === '' || conv_rawInput === '-') {
                conv_rawInput += '0.';
            } else if (conv_rawInput.length < 22) {
                conv_rawInput += '.';
            }

            conv_applyRawToInput();
            conv_feedback();
        };

        window.conv_toggleSign = function () {
            if (conv_rawInput === '' || conv_rawInput === '0') {
                conv_rawInput = '-';
            } else if (conv_rawInput === '-') {
                conv_rawInput = '';
            } else if (conv_rawInput.startsWith('-')) {
                conv_rawInput = conv_rawInput.slice(1);
            } else {
                conv_rawInput = '-' + conv_rawInput;
            }

            conv_applyRawToInput();
            conv_feedback();
        };

        window.conv_backspace = function () {
            if (conv_rawInput.length > 0) {
                conv_rawInput = conv_rawInput.slice(0, -1);
            }
            conv_applyRawToInput();
            conv_feedback();
        };

        window.conv_clear = function () {
            conv_rawInput = '';
            const outEl = document.getElementById('conv_outputValue');
            conv_applyRawToInput();
            if (outEl) outEl.textContent = '0';
            conv_feedback();
        };

        window.conv_copyResult = function () {
            const outEl = document.getElementById('conv_outputValue');
            const btnEl = document.getElementById('conv_copyBtn');
            if (!outEl) return;
            const textToCopy = outEl.textContent.trim();
            if (!textToCopy || textToCopy === 'Error' || textToCopy === 'Entrada inválida') return;

            const showCopied = () => {
                if (!btnEl) return;
                const orig = btnEl.textContent;
                btnEl.textContent = '¡Copiado!';
                setTimeout(() => { btnEl.textContent = orig; }, 1300);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(showCopied).catch(() => {
                    conv_fallbackCopy(textToCopy);
                    showCopied();
                });
            } else {
                conv_fallbackCopy(textToCopy);
                showCopied();
            }
            conv_feedback();
        };

        function conv_fallbackCopy(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.select();
            try { document.execCommand('copy'); } catch {}
            document.body.removeChild(temp);
        }

        window.conv_open = function () {
            const overlay = document.getElementById('conv_overlay');
            if (!overlay) return;
            if (typeof closeMenu === 'function') closeMenu();
            conv_renderCategoryMenu();
            conv_renderUnitMenus();
            conv_syncInputControl();
            conv_convert();
            overlay.style.display = '';
            overlay.classList.add('conv_visible');
            overlay.setAttribute('aria-hidden', 'false');
            conv_feedback();
        };

        window.conv_close = function () {
            const overlay = document.getElementById('conv_overlay');
            if (!overlay) return;
            conv_closeAllDropdowns();
            overlay.classList.remove('conv_visible');
            overlay.style.display = 'none';
            overlay.setAttribute('aria-hidden', 'true');
            conv_feedback();
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.conv_dropdown')) {
                conv_closeAllDropdowns();
            }
        });

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('conv_overlay');
            if (!overlay || !overlay.classList.contains('conv_visible')) return;
            if (e.key === 'Escape') {
                const openDrop = document.querySelector('.conv_dropdown.conv_open');
                if (openDrop) {
                    conv_closeAllDropdowns();
                } else {
                    conv_close();
                }
            }
        });

        /* Inicialización segura del estado interno sin abrir el modal */
        conv_renderCategoryMenu();
        conv_renderUnitMenus();
        conv_syncInputControl();
        conv_convert();
    })();
</script>
