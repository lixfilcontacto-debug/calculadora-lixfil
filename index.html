        `).join('');

        modalBody.innerHTML = `
            <div class="book-reader-wrapper"
                 ontouchstart="handleHelpTouchStart(event)"
                 ontouchend="handleHelpTouchEnd(event)">
                <div class="book-page-card ${isProBook ? 'pro-page-card' : ''}">
                    <div class="book-page-emblem${emblemClass}">${emblemContent}</div>
                    <h4 class="book-page-title">${page.title}</h4>
                    <p class="book-page-desc">${page.desc}</p>
                    <div class="book-page-example-box">
                        ${page.diagram}
                        <div class="book-page-steps">${page.steps}</div>
                    </div>
                </div>
                <div class="book-dots-row" role="tablist" aria-label="Páginas del libro">
                    ${dotsHtml}
                </div>
            </div>
        `;

        const prevDisabled = activeHelpPageIndex === 0 ? 'disabled' : '';
        const isLastPage = activeHelpPageIndex === totalPages - 1;
        const nextLabel = isLastPage ? 'Listo' : 'Siguiente';
        const nextAction = isLastPage ? 'renderHelpBooksMenu()' : 'nextHelpBookPage()';

        modalActions.innerHTML = `
            <div class="book-nav-actions">
                <button type="button" class="book-nav-btn" onclick="prevHelpBookPage()" ${prevDisabled}>Anterior</button>
                <button type="button" class="book-nav-btn next-pill ${isProBook ? 'pro-pill' : ''}" onclick="${nextAction}">${nextLabel}</button>
            </div>
        `;
    }

    function prevHelpBookPage() {
        if (!activeHelpBookId) return;
        if (activeHelpPageIndex > 0) {
            activeHelpPageIndex--;
            renderHelpBookPage();
            haptic();
        }
    }

    function nextHelpBookPage() {
        const book = HELP_BOOKS_DATA[activeHelpBookId];
        if (!book) return;
        if (activeHelpPageIndex < book.pages.length - 1) {
            activeHelpPageIndex++;
            renderHelpBookPage();
            haptic();
        }
    }

    function goToHelpBookPage(index) {
        const book = HELP_BOOKS_DATA[activeHelpBookId];
        if (!book || index < 0 || index >= book.pages.length) return;
        activeHelpPageIndex = index;
        renderHelpBookPage();
        haptic();
    }

    function handleHelpTouchStart(e) {
        if (e.touches && e.touches.length === 1) {
            helpTouchStartX = e.touches[0].clientX;
        }
    }

    function handleHelpTouchEnd(e) {
        if (helpTouchStartX === null || !e.changedTouches || !e.changedTouches.length) return;
        const deltaX = e.changedTouches[0].clientX - helpTouchStartX;
        helpTouchStartX = null;
        if (Math.abs(deltaX) < 38) return;
        if (deltaX < 0) {
            nextHelpBookPage();
        } else {
            prevHelpBookPage();
        }
    }

    function cancelColorSelection() {
        applyKeyAccent('default', false);
        try {
            const savedAccent = localStorage.getItem('calcKeyAccent') || 'default';
            if (isAccentCurrentlyAvailable(savedAccent)) {
                applyKeyAccent(savedAccent, false);
            }
        } catch {}
        closeModal();
    }

    function confirmColorSelection() {
        applyKeyAccent(tempSelectedAccent, true);
        closeModal();
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
        modalCard.classList.remove('fraction-wide-3', 'fraction-wide-4', 'help-compact', 'help-reader-mode');
        modalHeaderRow.style.display = 'flex';
        activeHelpBookId = null;
        activeHelpPageIndex = 0;
        isCollectionMenuOpen = false;
        isSubAlbumReaderOpen = false;
    }

    function closeModalOnBackdrop(event) {
        if (event.target === modalOverlay) {
            if (modalTitle.textContent === 'Color del teclado') {
                cancelColorSelection();
            } else {
                closeModal();
            }
        }
    }

    function submitFeedback() {
        const input = document.getElementById('feedbackInput');
        const status = document.getElementById('feedbackStatus');
        if (!input || !status) return;
        const text = input.value.trim();
        if (!text) {
            status.textContent = 'Por favor, escribe un comentario antes de enviar.';
            return;
        }
        status.textContent = '¡Gracias! Tu comentario ha sido registrado.';
        input.value = '';
        setTimeout(() => closeModal(), 1100);
    }

    /* ============ VIBRACIÓN TÁCTIL Y AUDIO ============ */
    function haptic(keyId = null) {
        playKeySound(keyId);
        if (navigator.vibrate) {
            navigator.vibrate(8);
        }
    }

    /* ============ FORMATEO CON SEPARADORES DE MILES ============ */
    function formatNumberString(numStr) {
        if (!numStr) return '';
        let sign = '';
        if (numStr.startsWith('-')) {
            sign = '-';
            numStr = numStr.slice(1);
        }
        const parts = numStr.split('.');
        const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.length > 1 ? `${sign}${intPart}.${parts[1]}` : `${sign}${intPart}`;
    }

    function formatExpression(expr) {
        if (!expr) return '';
        return expr.replace(/\d+(\.\d*)?/g, match => formatNumberString(match));
    }

    function formatResultNumber(num) {
        if (typeof num !== 'number' || !isFinite(num) || isNaN(num)) return String(num);
        if (Math.abs(num) >= 1e12 || (Math.abs(num) > 0 && Math.abs(num) < 1e-7)) {
            return num.toExponential(6).replace(/\.?0+e/, 'e');
        }
        const rounded = Math.round(num * 1e10) / 1e10;
        return formatNumberString(String(rounded));
    }

    /* ============ SINCRONIZACIÓN DE CURSOR Y PANTALLA ============ */
    function mapFormattedToRawIndex(formatted, fmtPos) {
        let rawCount = 0;
        for (let i = 0; i < fmtPos && i < formatted.length; i++) {
            if (formatted[i] !== ',') rawCount++;
        }
        return rawCount;
    }

    function mapRawToFormattedIndex(formatted, rawPos) {
        if (rawPos <= 0) return 0;
        let rawCount = 0;
        for (let i = 0; i < formatted.length; i++) {
            if (formatted[i] !== ',') {
                rawCount++;
                if (rawCount === rawPos) return i + 1;
            }
        }
        return formatted.length;
    }

    function getRawSelection() {
        const formatted = exprInput.value;
        const startFmt  = exprInput.selectionStart ?? formatted.length;
        const endFmt    = exprInput.selectionEnd   ?? formatted.length;
        return {
            start: mapFormattedToRawIndex(formatted, startFmt),
            end:   mapFormattedToRawIndex(formatted, endFmt)
        };
    }

    function syncDisplay(targetRawCursor = null) {
        const formatted = formatExpression(rawExpr);
        exprInput.value = formatted;

        if (targetRawCursor !== null) {
            const clampedRaw = Math.max(0, Math.min(rawExpr.length, targetRawCursor));
            const fmtCursor  = mapRawToFormattedIndex(formatted, clampedRaw);
            if (document.activeElement === exprInput) {
                exprInput.setSelectionRange(fmtCursor, fmtCursor);
            }
        }

        if (rawExpr.length > 14)      exprInput.style.fontSize = 'clamp(1.75rem, 6.5vw, 2.5rem)';
        else if (rawExpr.length > 9)  exprInput.style.fontSize = 'clamp(2.1rem, 8vw, 3.1rem)';
        else                          exprInput.style.fontSize = '';

        if (targetRawCursor === rawExpr.length) {
            exprInput.scrollLeft = exprInput.scrollWidth;
        }
        checkInlineExpressionStamps(rawExpr);
        calculatePreview();
    }

    function replaceRawRange(start, end, text) {
        rawExpr = rawExpr.slice(0, start) + text + rawExpr.slice(end);
        const newCursor = start + text.length;
        exprInput.focus({ preventScroll: true });
        syncDisplay(newCursor);
    }

    exprInput.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const navKeys = ['ArrowLeft', 'ArrowRight', 'Home', 'End', 'Tab'];
        if (navKeys.includes(e.key)) return;

        e.preventDefault();
        if (e.key >= '0' && e.key <= '9') insertDigit(e.key);
        else if (e.key === '.') insertDecimal();
        else if (e.key === '+') insertOperator('+');
        else if (e.key === '-') insertOperator('-');
        else if (e.key === '*') insertOperator('×');
        else if (e.key === '/') insertOperator('÷');
        else if (e.key === '%') insertOperator('%');
        else if (e.key === '^') insertAtCursor('^');
        else if (e.key === '!') insertAtCursor('!');
        else if (e.key === '(') insertRawSymbol('(');
        else if (e.key === ')') insertRawSymbol(')');
        else if (e.key === 'Backspace' || e.key === 'Delete') deleteAtCursor();
        else if (e.key === 'Enter' || e.key === '=') calculateResult();
        else if (e.key === 'Escape') clearAll();
    });

    exprInput.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text');
        const cleaned = sanitizeExpressionInput(pasted);
        if (!cleaned) return;
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        replaceRawRange(start, end, cleaned);
    });

    exprInput.addEventListener('input', () => {
        const sanitized = sanitizeExpressionInput(exprInput.value);
        if (sanitized !== rawExpr) {
            rawExpr = sanitized;
            syncDisplay(rawExpr.length);
        }
    });

    /* ============ CONTROLES CIENTÍFICOS ============ */
    function syncAngleUI() {
        const label = isDeg ? 'Deg' : 'Rad';
        if (topAngleBtn) {
            topAngleBtn.textContent = label;
            topAngleBtn.classList.toggle('active-mode', !isDeg);
        }
        if (degBtn) {
            degBtn.textContent = 'Ans';
        }
        if (landDegBtn) {
            landDegBtn.textContent = isLandAltPage ? 'S⇔D' : 'Ans';
        }
    }

    function toggleAngleMode() {
        isDeg = !isDeg;
        syncAngleUI();
        try {
            localStorage.setItem('calcAngleMode', isDeg ? 'deg' : 'rad');
        } catch {}
        calculatePreview();
        haptic();
    }

    function insertAns() {
        const ansStr = String(lastAns);
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
            replaceRawRange(0, 0, ansStr);
            haptic();
            return;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        const needsMult = /[0-9)πe!%]/.test(prevChar);
        replaceRawRange(start, end, (needsMult ? '×' : '') + ansStr);
        haptic();
    }

    function toggleFractionDecimal() {
        let targetVal = null;
        const currentClean = rawExpr.replace(/,/g, '').trim();

        if (!currentClean) {
            if (isFinite(lastAns) && !isNaN(lastAns) && lastAns !== 0) {
                targetVal = lastAns;
            } else {
                haptic();
                return;
            }
        } else {
            const evalCurrent = evaluateMath(currentClean);
            if (typeof evalCurrent === 'number' && isFinite(evalCurrent) && !isNaN(evalCurrent)) {
                targetVal = evalCurrent;
            } else {
                haptic();
                return;
            }
        }

        const isFractionForm = /^[+-]?\d+[÷/]\d+$/.test(currentClean);

        if (isFractionForm) {
            const formattedDec = formatResultNumber(targetVal).replace(/,/g, '');
            rawExpr = formattedDec;
            justCalculated = true;
            syncDisplay(rawExpr.length);
            unlockAchievementById('doble_identidad');
            haptic();
            return;
        }

        const frac = decimalToFractionPair(targetVal);
        if (frac && frac.den !== 1) {
            rawExpr = `${frac.num}÷${frac.den}`;
            justCalculated = false;
            syncDisplay(rawExpr.length);
            unlockAchievementById('doble_identidad');
        } else {
            const formattedDec = formatResultNumber(targetVal).replace(/,/g, '');
            if (formattedDec !== currentClean) {
                rawExpr = formattedDec;
                justCalculated = true;
                syncDisplay(rawExpr.length);
            }
        }
        haptic();
    }

    function syncAnsSdButtons() {
        if (degBtn) {
            degBtn.textContent = 'Ans';
        }
        if (landDegBtn) {
            landDegBtn.textContent = isLandAltPage ? 'S⇔D' : 'Ans';
        }
    }

    function handleLandscapeAnsOrSd() {
        if (isLandAltPage) {
            toggleFractionDecimal();
        } else {
            insertAns();
        }
    }

    function toggleInverse() {
        isInv = !isInv;
        invBtn.classList.toggle('active-mode', isInv);
        if (isInv) {
            sinBtn.textContent = 'sin⁻¹';
            cosBtn.textContent = 'cos⁻¹';
            tanBtn.textContent = 'tan⁻¹';
            lnBtn.textContent  = 'eˣ';
            logBtn.textContent = '10ˣ';
        } else {
            sinBtn.textContent = 'sin';
            cosBtn.textContent = 'cos';
            tanBtn.textContent = 'tan';
            lnBtn.textContent  = 'ln';
            logBtn.textContent = 'log';
        }
        haptic();
    }

    function insertTrig(fn) {
        const prefix = isInv ? `${fn}⁻¹(` : `${fn}(`;
        insertSpecial(prefix);
    }

    function insertLog(fn) {
        if (isInv) {
            insertSpecial(fn === 'ln' ? 'e^(' : '10^(');
        } else {
            insertSpecial(`${fn}(`);
        }
    }

    function insertSpecial(token) {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        const needsMult = /[0-9)πe!%]/.test(prevChar);
        replaceRawRange(start, end, (needsMult ? '×' : '') + token);
        haptic();
    }

    function insertAtCursor(symbol) {
        if (justCalculated) {
            if (symbol === '^' || symbol === '!') {
                justCalculated = false;
            } else {
                rawExpr = '';
                justCalculated = false;
            }
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        const needsMult = (symbol === 'π' || symbol === 'e') && /[0-9)πe!%]/.test(prevChar);
        replaceRawRange(start, end, (needsMult ? '×' : '') + symbol);
        haptic();
    }

    /* ============ FUNCIONES EXCLUSIVAS CIENTÍFICA HORIZONTAL PRO ============ */
    function insertPower(expDigit) {
        if (justCalculated) {
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        const prefix = (start === 0 || /[+\-×÷(^]/.test(prevChar)) ? '0^' : '^';
        replaceRawRange(start, end, prefix + expDigit);
        haptic();
    }

    function insertNthRoot() {
        if (justCalculated) {
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        if (start > 0 && /[0-9)πe!]/.test(prevChar)) {
            replaceRawRange(start, end, '^(1÷');
        } else {
            replaceRawRange(start, end, '√(');
        }
        haptic();
    }

    function insertExpNotation() {
        if (justCalculated) {
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        const token = (start === 0 || /[+\-×÷(^]/.test(prevChar)) ? '1×10^' : '×10^';
        replaceRawRange(start, end, token);
        haptic();
    }

    function insertRandom() {
        const rnd = (Math.floor(Math.random() * 900) + 100) / 1000;
        const rndStr = String(rnd);
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
            replaceRawRange(0, 0, rndStr);
            haptic();
            return;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        const needsMult = /[0-9)πe!%]/.test(prevChar);
        replaceRawRange(start, end, (needsMult ? '×' : '') + rndStr);
        haptic();
    }

    function insertCombPerm(letter) {
        if (justCalculated) {
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        if (start === 0 || /[+\-×÷(^]/.test(prevChar)) return;
        replaceRawRange(start, end, letter);
        haptic();
    }

    /* ============ MEMORIA CONTABLE (MC, MR, M-, M+) ============ */
    function getCurrentNumericValue() {
        const res = evaluateMath(rawExpr);
        if (typeof res === 'number' && isFinite(res) && !isNaN(res)) {
            return res;
        }
        return null;
    }

    function updateMemoryUI() {
        memIndicator.classList.toggle('visible', hasMemory);
        if (memIndicatorValue) {
            memIndicatorValue.textContent = hasMemory ? ` ${formatResultNumber(memoryValue)}` : '';
        }
        mcBtn.disabled = !hasMemory;
        mrBtn.disabled = !hasMemory;
        try {
            if (hasMemory) {
                localStorage.setItem('calcMemory', String(memoryValue));
            } else {
                localStorage.removeItem('calcMemory');
            }
        } catch {}
    }

    function memoryClear() {
        memoryValue = 0;
        hasMemory = false;
        hasStoredWithMPlus = false;
        updateMemoryUI();
        haptic();
    }

    function memoryRecall() {
        if (!hasMemory) return;
        const memStr = String(memoryValue);
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
            replaceRawRange(0, 0, memStr);
            if (hasStoredWithMPlus) {
                unlockAchievementById('eco_del_pasado');
            }
            haptic();
            return;
        }
        const { start, end } = getRawSelection();
        const prevChar = rawExpr[start - 1] || '';
        const needsMult = /[0-9)πe!%]/.test(prevChar);
        replaceRawRange(start, end, (needsMult ? '×' : '') + memStr);
        if (hasStoredWithMPlus) {
            unlockAchievementById('eco_del_pasado');
        }
        haptic();
    }

    function memoryAdd() {
        const val = getCurrentNumericValue();
        if (val === null) return;

        hasMemory = true;

    function memorySubtract() {
        const val = getCurrentNumericValue();
        if (val === null) return;

        hasMemory = true;

    /* ============ TEMA CLARO / OSCURO ============ */
     function toggleTheme() {
        const isLight = calcRoot.classList.toggle('light-theme');
        if (themeColorMeta) {

    /* ============ INSERCIÓN Y EDICIÓN DESDE BOTONES ============ */
    function insertDigit(digit) {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
            replaceRawRange(0, 0, digit);
            haptic(digit);
            return;
        }
        const { start, end } = getRawSelection();
        const before = rawExpr.slice(0, start);
        const after  = rawExpr.slice(end);
        const numBeforeMatch = before.match(/(\d+(?:\.\d*)?)$/);
        const numAfterMatch  = after.match(/^(\d*(?:\.\d+)?)/);
        const currentNum = (numBeforeMatch ? numBeforeMatch[1] : '') +
                           (numAfterMatch  ? numAfterMatch[1]  : '');

        if (!currentNum.includes('.') && currentNum.length >= 15) return;

        if (numBeforeMatch && numBeforeMatch[1] === '0' && !after.startsWith('.')) {
            if (digit === '0') return;
            replaceRawRange(start - 1, end, digit);
            haptic(digit);
            return;
        }

        const prevChar = rawExpr[start - 1] || '';
        const needsMult = /[)πe!%]/.test(prevChar);
        replaceRawRange(start, end, (needsMult ? '×' : '') + digit);
        haptic(digit);
    }

    function insertDecimal() {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
            replaceRawRange(0, 0, '0.');
            haptic('.');
            return;
        }
        const { start, end } = getRawSelection();
        const before = rawExpr.slice(0, start);
        const after  = rawExpr.slice(end);
        const numBeforeMatch = before.match(/(\d+(?:\.\d*)?)$/);
        const numAfterMatch  = after.match(/^(\d*(?:\.\d+)?)/);
        const currentNum = (numBeforeMatch ? numBeforeMatch[1] : '') +
                           (numAfterMatch  ? numAfterMatch[1]  : '');

        if (currentNum.includes('.')) return;

        const prevChar = rawExpr[start - 1] || '';
        const needsPrefixZero = start === 0 || /[+\-×÷(^CP]/.test(prevChar);
        const needsMult = /[)πe!%]/.test(prevChar);
        const toInsert = needsMult ? '×0.' : (needsPrefixZero ? '0.' : '.');
        replaceRawRange(start, end, toInsert);
        haptic('.');
    }

    function insertOperator(op) {
        justCalculated = false;
        const { start, end } = getRawSelection();

        if (op === '%') {
            if (start === 0) return;
            const prevChar = rawExpr[start - 1];
            if (/[+\-×÷(^%CP]/.test(prevChar)) return;
            replaceRawRange(start, end, '%');
            haptic('%');
            return;
        }

        if (start === 0) {
            if (op === '-') replaceRawRange(0, end, '-');
            haptic(op);
            return;
        }

        const prevChar = rawExpr[start - 1];

        if (prevChar === '(' || prevChar === '^' || prevChar === 'C' || prevChar === 'P') {
            if (op === '-') replaceRawRange(start, end, '-');
            haptic(op);
            return;
        }

        if (/[+\-×÷]/.test(prevChar)) {
            if (start === 1 && prevChar === '-') return;
            const prevPrev = rawExpr[start - 2] || '';
            if (prevPrev === '(' && op !== '-') return;
            replaceRawRange(start - 1, end, op);
            haptic(op);
            return;
        }

        replaceRawRange(start, end, op);
        haptic(op);
    }

    function insertRawSymbol(sym) {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        replaceRawRange(start, end, sym);
        haptic(sym);
    }

    function addParenthesis() {
        if (justCalculated) {
            rawExpr = '';
            justCalculated = false;
        }
        const { start, end } = getRawSelection();
        const before = rawExpr.slice(0, start);
        const openCount  = (before.match(/\(/g) || []).length;
        const closeCount = (before.match(/\)/g) || []).length;
        const lastChar   = before.slice(-1);

        if (openCount > closeCount && /[0-9)πe!%]/.test(lastChar)) {
            replaceRawRange(start, end, ')');
        } else {
            const needsMult = /[0-9)πe!%]/.test(lastChar);
            replaceRawRange(start, end, (needsMult ? '×(' : '('));
        }
        haptic('()');
    }

    function deleteAtCursor() {
        if (!rawExpr) {
            previewDisplay.textContent = '';
            return;
        }
        justCalculated = false;
        const { start, end } = getRawSelection();

        if (start !== end) {
            replaceRawRange(start, end, '');
        } else if (start > 0) {
            const before = rawExpr.slice(0, start);
            const tokenMatch = before.match(/(sin⁻¹\(|cos⁻¹\(|tan⁻¹\(|sin\(|cos\(|tan\(|log\(|ln\(|abs\(|√\(|∛\()$/);
            if (tokenMatch) {
                replaceRawRange(start - tokenMatch[1].length, start, '');
            } else {
                replaceRawRange(start - 1, start, '');
            }
        }
        haptic('DEL');
    }

    function clearAll() {
        rawExpr = '';
        justCalculated = false;
        previewDisplay.textContent = '';
        syncDisplay(0);
        haptic('AC');
    }

    /* ============ EVALUADOR MATEMÁTICO SEGURO (SIN EVAL / NEW FUNCTION) ============ */
    function factorial(n) {
        if (!Number.isInteger(n) || n < 0) return NaN;
        if (n > 170) return Infinity;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function combination(n, r) {
        if (!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return NaN;
        if (r === 0 || r === n) return 1;
        if (r > n / 2) r = n - r;
        let res = 1;
        for (let i = 1; i <= r; i++) {
            res = (res * (n - i + 1)) / i;
        }
        return Math.round(res);
    }

    function permutation(n, r) {
        if (!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return NaN;
        let res = 1;
        for (let i = 0; i < r; i++) {
            res *= (n - i);
        }
        return res;
    }

    function tokenizeExpression(expr) {
        const tokens = [];
        let i = 0;
        while (i < expr.length) {
            const ch = expr[i];

            if (/\s/.test(ch)) {
                i++;
                continue;
            }

            if (/[0-9.]/.test(ch)) {
                let numStr = '';
                let dotCount = 0;
                while (i < expr.length && /[0-9.]/.test(expr[i])) {
                    if (expr[i] === '.') dotCount++;
                    if (dotCount > 1) return null;
                    numStr += expr[i++];
                }
                if (numStr === '.') return null;
                tokens.push({ type: 'num', value: parseFloat(numStr) });
                continue;
            }

            const rest = expr.slice(i);
            const funcMatch = rest.match(/^(sin⁻¹|cos⁻¹|tan⁻¹|sin|cos|tan|log|ln|abs|√|∛)/);
            if (funcMatch) {
                tokens.push({ type: 'func', value: funcMatch[1] });
                i += funcMatch[1].length;
                continue;
            }

            if (ch === 'π') {
                tokens.push({ type: 'num', value: Math.PI });
                i++;
                continue;
            }
            if (ch === 'e') {
                tokens.push({ type: 'num', value: Math.E });
                i++;
                continue;
            }

            if (ch === '(' || ch === ')') {
                tokens.push({ type: 'paren', value: ch });
                i++;
                continue;
            }

            if (ch === '!' || ch === '%') {
                tokens.push({ type: 'postfix', value: ch });
                i++;
                continue;
            }

            if (ch === 'C' || ch === 'P') {
                tokens.push({ type: 'op', value: ch });
                i++;
                continue;
            }

            if (/[+\-×÷^]/.test(ch)) {
                tokens.push({ type: 'op', value: ch });
                i++;
                continue;
            }

            return null;
        }
        return tokens;
    }

    function applyMathFunc(fn, x) {
        switch (fn) {
            case 'sin': {
                const rad = isDeg ? (x * Math.PI) / 180 : x;
                const val = Math.sin(rad);
                return Math.abs(val) < 1e-15 ? 0 : val;
            }
            case 'cos': {
                const rad = isDeg ? (x * Math.PI) / 180 : x;
                const val = Math.cos(rad);
                return Math.abs(val) < 1e-15 ? 0 : val;
            }
            case 'tan': {
                if (isDeg && Math.abs(x % 180) === 90) return NaN;
                const rad = isDeg ? (x * Math.PI) / 180 : x;
                const val = Math.tan(rad);
                return Math.abs(val) < 1e-15 ? 0 : val;
            }
            case 'sin⁻¹': {
                if (x < -1 || x > 1) return NaN;
                const res = Math.asin(x);
                return isDeg ? (res * 180) / Math.PI : res;
            }
            case 'cos⁻¹': {
                if (x < -1 || x > 1) return NaN;
                const res = Math.acos(x);
                return isDeg ? (res * 180) / Math.PI : res;
            }
            case 'tan⁻¹': {
                const res = Math.atan(x);
                return isDeg ? (res * 180) / Math.PI : res;
            }
            case 'log':
                return x <= 0 ? NaN : Math.log10(x);
            case 'ln':
                return x <= 0 ? NaN : Math.log(x);
            case 'abs':
                return Math.abs(x);
            case '√':
                return x < 0 ? NaN : Math.sqrt(x);
            case '∛':
                return Math.cbrt(x);
            default:
                return NaN;
        }
    }

    function evaluateTokens(tokens) {
        let pos = 0;

        function peek() {
            return tokens[pos] || null;
        }
        function consume() {
            return tokens[pos++] || null;
        }

        function parseExpression() {
            let left = parseTerm();
            if (left === null) return null;

            while (peek() && peek().type === 'op' && (peek().value === '+' || peek().value === '-')) {
                const op = consume().value;
                const rightTok = peek();
                if (!rightTok) return null;

                if (rightTok.type === 'num' && tokens[pos + 1] && tokens[pos + 1].type === 'postfix' && tokens[pos + 1].value === '%') {
                    consume();
                    consume();
                    const pctValue = left * (rightTok.value / 100);
                    left = op === '+' ? left + pctValue : left - pctValue;
                    continue;
                }

                const right = parseTerm();
                if (right === null) return null;
                left = op === '+' ? left + right : left - right;
            }
            return left;
        }

        function parseTerm() {
            let left = parsePower();
            if (left === null) return null;

            while (peek() && peek().type === 'op' && (peek().value === '×' || peek().value === '÷' || peek().value === 'C' || peek().value === 'P')) {
                const op = consume().value;
                const right = parsePower();
                if (right === null) return null;
                if (op === '×') {
                    left = left * right;
                } else if (op === '÷') {
                    if (right === 0) return 'DIV_ZERO';
                    left = left / right;
                } else if (op === 'C') {
                    left = combination(left, right);
                } else if (op === 'P') {
                    left = permutation(left, right);
                }
            }
            return left;
        }

        function parsePower() {
            const base = parseUnary();
            if (base === null) return null;

            if (peek() && peek().type === 'op' && peek().value === '^') {
                consume();
                const exponent = parsePower();
                if (exponent === null) return null;
                return Math.pow(base, exponent);
            }
            return base;
        }

        function parseUnary() {
            const tok = peek();
            if (!tok) return null;

            if (tok.type === 'op' && (tok.value === '+' || tok.value === '-')) {
                consume();
                const val = parseUnary();
                if (val === null || val === 'DIV_ZERO') return val;
                return tok.value === '-' ? -val : val;
            }
            return parsePostfix();
        }

        function parsePostfix() {
            let val = parsePrimary();
            if (val === null || val === 'DIV_ZERO') return val;

            while (peek() && peek().type === 'postfix') {
                const p = consume().value;
                if (p === '!') {
                    val = factorial(val);
                } else if (p === '%') {
                    val = val / 100;
                }
            }
            return val;
        }

        function parsePrimary() {
            const tok = peek();
            if (!tok) return null;

            if (tok.type === 'num') {
                consume();
                return tok.value;
            }

            if (tok.type === 'func') {
                const fn = consume().value;
                let arg = null;
                if (peek() && peek().type === 'paren' && peek().value === '(') {
                    consume();
                    arg = parseExpression();
                    if (arg === null || arg === 'DIV_ZERO') return arg;
                    if (!peek() || peek().type !== 'paren' || peek().value !== ')') return null;
                    consume();
                } else {
                    arg = parseUnary();
                    if (arg === null || arg === 'DIV_ZERO') return arg;
                }
                return applyMathFunc(fn, arg);
            }

            if (tok.type === 'paren' && tok.value === '(') {
                consume();
                const inner = parseExpression();
                if (inner === null || inner === 'DIV_ZERO') return inner;
                if (!peek() || peek().type !== 'paren' || peek().value !== ')') return null;
                consume();
                return inner;
            }

            return null;
        }

        const result = parseExpression();
        if (pos !== tokens.length) return null;
        return result;
    }

    function evaluateMath(expression) {
        if (!expression) return null;
        try {
            let clean = expression.replace(/,/g, '').replace(/\//g, '÷');

            clean = clean.replace(/([0-9)πe!%])(\(|sin⁻¹|cos⁻¹|tan⁻¹|sin|cos|tan|log|ln|abs|√|∛|π|e)/g, '$1×$2');

            const openCount  = (clean.match(/\(/g) || []).length;
            const closeCount = (clean.match(/\)/g) || []).length;
            if (openCount > closeCount) {
                clean += ')'.repeat(openCount - closeCount);
            } else if (closeCount > openCount) {
                return null;
            }

            const tokens = tokenizeExpression(clean);
            if (!tokens || tokens.length === 0) return null;

            const result = evaluateTokens(tokens);
            if (result === 'DIV_ZERO') return 'No se puede dividir entre 0';
            if (result === null || typeof result !== 'number' || !isFinite(result) || isNaN(result)) {
                return null;
            }
            return result;
        } catch {
            return null;
        }
    }

    function calculatePreview() {
        if (!rawExpr || /^[+\-×÷^CP]$/.test(rawExpr)) {
            previewDisplay.textContent = '';
            return;
        }
        const trimmed = rawExpr.replace(/[+\-×÷(^CP]+$/, '');
        if (!trimmed || /^[0-9.,]+$/.test(trimmed)) {
            previewDisplay.textContent = '';
            return;
        }
        const res = evaluateMath(trimmed);
        previewDisplay.textContent = (typeof res === 'number') ? formatResultNumber(res) : '';
    }

    function calculateResult() {
        if (!rawExpr) return;
        const res = evaluateMath(rawExpr);

        // Evaluar todos los logros antes de modificar rawExpr
        evaluateAchievementsOnEquals(rawExpr, res);

        if (res === null) {
            previewDisplay.textContent = "";
            return;
        }
        if (res === 'No se puede dividir entre 0') {
            previewDisplay.textContent = res;
            return;
        }

        const formattedExpr = formatExpression(rawExpr);
        const formattedRes  = formatResultNumber(res);

        addToHistory(formattedExpr, formattedRes);
        lastAns = res;
        rawExpr = formattedRes.replace(/,/g, '');
        justCalculated = true;
        previewDisplay.textContent = '';
        syncDisplay(rawExpr.length);
        haptic('=');
    }

    /* ============ HISTORIAL AGRUPADO POR FECHA CON ELIMINACIÓN INDIVIDUAL ============ */
    function getHistoryDateLabel(timestamp) {
        const date = new Date(timestamp || Date.now());
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const itemDayStart = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
        const diffDays = Math.round((todayStart - itemDayStart) / 86400000);

        if (diffDays === 0) return 'Hoy';
        if (diffDays === 1) return 'Ayer';

        const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const day = date.getDate();
        const month = months[date.getMonth()];
        const year = date.getFullYear();

        return year === now.getFullYear()
            ? `${day} de ${month}`
            : `${day} de ${month} de ${year}`;
    }

    function addToHistory(expr, result) {
        if (expr === result) return;
        history.unshift({ expr, result, timestamp: Date.now() });
        if (history.length > 50) history.pop();
        try {
            localStorage.setItem('calcHistory', JSON.stringify(history));
        } catch {}
        renderHistory();
    }

    function deleteHistoryItem(event, index) {
        if (event) event.stopPropagation();
        if (index < 0 || index >= history.length) return;
        history.splice(index, 1);
        try {
            localStorage.setItem('calcHistory', JSON.stringify(history));
        } catch {}
        renderHistory();
        haptic();
    }

    function renderHistory() {
        historyList.innerHTML = '';
        if (history.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty-history';
            empty.textContent = 'No hay historial reciente';
            historyList.appendChild(empty);
            return;
        }

        let lastGroupLabel = '';

        history.forEach((item, index) => {
            const groupLabel = getHistoryDateLabel(item.timestamp);
            if (groupLabel !== lastGroupLabel) {
                const groupHeader = document.createElement('div');
                groupHeader.className = 'history-date-group';
                groupHeader.textContent = groupLabel;
                historyList.appendChild(groupHeader);
                lastGroupLabel = groupLabel;
            }

            const div = document.createElement('div');
            div.className = 'history-item';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'history-item-content';

            const exprDiv = document.createElement('div');
            exprDiv.className = 'history-expr';
            exprDiv.textContent = item.expr;

            const resDiv = document.createElement('div');
            resDiv.className = 'history-res';
            resDiv.textContent = `= ${item.result}`;

            contentDiv.appendChild(exprDiv);
            contentDiv.appendChild(resDiv);

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'history-delete-btn';
            deleteBtn.setAttribute('aria-label', 'Eliminar operación del historial');
            deleteBtn.setAttribute('title', 'Eliminar');
            deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
            deleteBtn.onclick = (e) => deleteHistoryItem(e, index);

            div.appendChild(deleteBtn);
            div.appendChild(contentDiv);

            div.onclick = () => {
                rawExpr = item.result.replace(/,/g, '');
                justCalculated = true;
                syncDisplay(rawExpr.length);
                toggleHistory();
                haptic();
            };
            historyList.appendChild(div);
        });
    }

    function toggleHistory() {
        closeMenu();
        historyPanel.classList.toggle('active');
        haptic();
    }

    function clearHistory() {
        history = [];
        try {
            localStorage.removeItem('calcHistory');
        } catch {}
        renderHistory();
        haptic();
    }
</script>

        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--op-color);
        flex-shrink: 0;
    }
    .conv_cat_icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
    }

    .conv_dropdown_text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .conv_dropdown_arrow {
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--op-color);
        flex-shrink: 0;
        transition: transform 0.2s ease;
    }
    .conv_dropdown_arrow svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
    }
    .conv_dropdown.open .conv_dropdown_arrow {
        transform: rotate(180deg);
    }

    .conv_dropdown_menu {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        right: 0;
        max-height: 215px;
        overflow-y: auto;
        background-color: var(--menu-bg);
        border: 1.5px solid color-mix(in srgb, var(--op-color) 35%, transparent);
        border-radius: 15px;
        padding: 5px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        z-index: 40;
        display: none;
        flex-direction: column;
        gap: 2px;
        overscroll-behavior: contain;
    }
    .conv_dropdown.open .conv_dropdown_menu {
        display: flex;
    }

    .conv_dropdown_option {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text-color);
        padding: 9px 11px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
    }
    .conv_dropdown_option:hover,
    .conv_dropdown_option:active {
        background-color: var(--hover-bg);
    }
    .conv_dropdown_option.selected {
        background-color: var(--op-bg);
        color: var(--op-color);
        font-weight: 700;
    }

    .conv_option_left {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
    }
    .conv_option_sym {
        font-size: 0.76rem;
        font-weight: 700;
        color: var(--preview-color);
        flex-shrink: 0;
    }
    .conv_dropdown_option.selected .conv_option_sym {
        color: var(--op-color);
    }

    .conv_card {
        background-color: var(--num-bg);
        border: 1.5px solid rgba(142, 142, 147, 0.22);
        border-radius: 18px;
        padding: 9px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
    }

    .conv_card_top {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .conv_tag {
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.7px;
        color: var(--op-color);
    }

    .conv_unit_symbol_badge {
        font-size: 0.73rem;
        font-weight: 700;
        color: var(--op-color);
        background-color: var(--op-bg);
        padding: 2px 8px;
        border-radius: 8px;
    }

    .conv_input {
        width: 100%;
        background-color: transparent;
        border: none;
        border-bottom: 1.5px solid color-mix(in srgb, var(--op-color) 45%, transparent);
        color: var(--text-color);
        font-size: clamp(1.3rem, 5.2vw, 1.7rem);
        font-weight: 700;
        padding: 2px 2px 4px;
        outline: none;
        text-align: right;
        caret-color: var(--cursor-color);
        -webkit-user-select: text;
        user-select: text;
    }
    .conv_input:focus {
        border-bottom-color: var(--op-color);
    }

    .conv_output_box {
        width: 100%;
        min-height: 30px;
        color: var(--op-color);
        font-size: clamp(1.3rem, 5.2vw, 1.7rem);
        font-weight: 700;
        text-align: right;
        padding: 2px 2px 1px;
        word-break: break-all;
        -webkit-user-select: text;
        user-select: text;
    }

    .conv_swap_row {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: -3px 0;
        flex-shrink: 0;
    }

    .conv_swap_btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1.5px solid color-mix(in srgb, var(--op-color) 45%, transparent);
        background-color: var(--op-bg);
        color: var(--op-color);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.16s ease, background-color 0.2s ease;
    }
    .conv_swap_btn:hover  { filter: brightness(1.12); }
    .conv_swap_btn:active { transform: rotate(180deg) scale(0.92); }
    .conv_swap_btn svg    { width: 20px; height: 20px; fill: currentColor; }

    .conv_footer_actions {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
    }

    .conv_action_btn {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 8px 10px;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        background-color: var(--equals-bg);
        color: var(--equals-color);
        touch-action: manipulation;
        transition: filter 0.15s ease, transform 0.1s ease;
    }
    .conv_action_btn.conv_clear_btn {
        background-color: var(--ac-bg);
        color: var(--ac-color);
    }
    .conv_action_btn:hover  { filter: brightness(1.1); }
    .conv_action_btn:active { transform: scale(0.96); }

    /* ============ TECLADO NUMÉRICO PROPIO DEL CONVERSOR (4x4 AISLADO) ============ */
    .conv_keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 6px;
        flex: 1;
        min-height: 152px;
        max-height: 220px;
        margin-top: 2px;
    }

    .conv_key {
        width: 100%;
        height: 100%;
        min-height: 34px;
        border-radius: 16px;
        border: none;
        font-size: clamp(1.2rem, 4.8vw, 1.5rem);
        font-weight: var(--btn-weight);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
        transition: filter 0.12s ease, transform 0.08s ease;
    }
    .conv_key:hover  { filter: brightness(1.14); }
    .conv_key:active { transform: scale(0.94); filter: brightness(0.9); }

    .conv_key_num {
        background-color: var(--num-bg);
        color: var(--num-color);
    }

    .conv_key_fn {
        background-color: var(--op-bg);
        color: var(--op-color);
        font-size: clamp(1.15rem, 4.5vw, 1.4rem);
        font-weight: 600;
    }

    .conv_key_span2 {
        grid-row: span 2;
    }

    .conv_key_zero {
        grid-column: span 2;
    }

    .conv_key_disabled {
        opacity: 0.35;
        pointer-events: none;
    }

    /* En modo Pro horizontal, mantener el conversor legible sin rotar doblemente */
    .calculator.pro-landscape-sci .conv_overlay {
        padding: 8px 16px 10px;
    }
    .calculator.pro-landscape-sci .conv_body {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        grid-template-rows: auto 1fr auto;
        gap: 8px 12px;
        align-items: stretch;
    }
    .calculator.pro-landscape-sci .conv_dropdown#conv_catDropdown {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
    }
    .calculator.pro-landscape-sci .conv_card:nth-of-type(1) {
        grid-column: 1 / 2;
        grid-row: 2 / 3;
    }
    .calculator.pro-landscape-sci .conv_swap_row {
        display: none;
    }
    .calculator.pro-landscape-sci .conv_card:nth-of-type(2) {
        grid-column: 2 / 3;
        grid-row: 1 / 3;
        justify-content: space-between;
    }
    .calculator.pro-landscape-sci .conv_footer_actions {
        grid-column: 1 / 2;
        grid-row: 3 / 4;
    }
    .calculator.pro-landscape-sci .conv_keypad {
        grid-column: 2 / 3;
        grid-row: 3 / 4;
        min-height: 110px;
        max-height: 135px;
    }
</style>

<script>
    'use strict';

    /* ============ LÓGICA AISLADA DEL CONVERSOR DE UNIDADES (PREFIJO conv_) ============ */
    const conv_CATEGORIES = {
        length: {
            label: 'Longitud',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h2v4h2V8h2v3h2V8h2v4h2V8h2v3h2V8h2v8z"/></svg>',
            defaultFrom: 'm',
            defaultTo: 'cm',

                mm: { name: 'Milímetros', symbol: 'mm', factor: 0.001 },

                in: { name: 'Pulgadas', symbol: 'in', factor: 0.0254 },
                ft: { name: 'Pies', symbol: 'ft', factor: 0.3048 },
                yd: { name: 'Yardas', symbol: 'yd', factor: 0.9144 },
                mi: { name: 'Millas', symbol: 'mi', factor: 1609.344 }
            }
        },
        mass: {
            label: 'Masa / Peso',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M12 3c-2.21 0-4 1.79-4 4 0 .74.21 1.43.56 2.02L5 19c-.55 1.1.25 2 1.5 2h11c1.25 0 2.05-.9 1.5-2l-3.56-9.98c.35-.59.56-1.28.56-2.02 0-2.21-1.79-4-4-4zm0 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>',
            defaultFrom: 'kg',
            defaultTo: 'g',
            units: {
                mg: { name: 'Miligramos', symbol: 'mg', factor: 0.000001 },
                g:  { name: 'Gramos', symbol: 'g', factor: 0.001 },
                kg: { name: 'Kilogramos', symbol: 'kg', factor: 1 },
                t:  { name: 'Toneladas métricas', symbol: 't', factor: 1000 },
                oz: { name: 'Onzas', symbol: 'oz', factor: 0.028349523125 },
                lb: { name: 'Libras', symbol: 'lb', factor: 0.45359237 }
            }
        },
        temperature: {
            label: 'Temperatura',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M15 13V5c0-1.66-1.34-3-3-3S9 3.34 9 5v8c-1.21.91-2 2.37-2 4 0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.63-.79-3.09-2-4zm-4-8c0-.55.45-1 1-1s1 .45 1 1v3h-2V5z"/></svg>',
            defaultFrom: 'C',
            defaultTo: 'F',
            units: {
                C: { name: 'Celsius', symbol: '°C' },
                F: { name: 'Fahrenheit', symbol: '°F' },
                K: { name: 'Kelvin', symbol: 'K' }
            }
        },
        area: {
            label: 'Área',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h4v4H7V7zm6 0h4v4h-4V7zm-6 6h4v4H7v-4zm6 0h4v4h-4v-4z"/></svg>',
            defaultFrom: 'm2',
            defaultTo: 'cm2',
            units: {
                mm2: { name: 'Milímetros cuadrados', symbol: 'mm²', factor: 0.000001 },
                cm2: { name: 'Centímetros cuadrados', symbol: 'cm²', factor: 0.0001 },
                m2:  { name: 'Metros cuadrados', symbol: 'm²', factor: 1 },
                ha:  { name: 'Hectáreas', symbol: 'ha', factor: 10000 },
                km2: { name: 'Kilómetros cuadrados', symbol: 'km²', factor: 1000000 },
                ft2: { name: 'Pies cuadrados', symbol: 'ft²', factor: 0.09290304 },
                ac:  { name: 'Acres', symbol: 'ac', factor: 4046.8564224 }
            }
        },
        volume: {
            label: 'Volumen',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18-.21 0-.41-.06-.57-.18l-7.9-4.44A.991.991 0 0 1 3 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18.21 0 .41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9zM12 4.15L6.04 7.5 12 10.85l5.96-3.35L12 4.15zM5 15.91l6 3.38v-6.71L5 9.21v6.7zm14 0v-6.7l-6 3.37v6.71l6-3.38z"/></svg>',
            defaultFrom: 'L',
            defaultTo: 'mL',
            units: {
                mL:  { name: 'Mililitros', symbol: 'mL', factor: 0.001 },
                L:   { name: 'Litros', symbol: 'L', factor: 1 },
                m3:  { name: 'Metros cúbicos', symbol: 'm³', factor: 1000 },
                gal: { name: 'Galones (EE. UU.)', symbol: 'gal', factor: 3.785411784 },
                floz:{ name: 'Onzas líquidas (EE. UU.)', symbol: 'fl oz', factor: 0.0295735295625 }
            }
        },
        speed: {
            label: 'Velocidad',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>',
            defaultFrom: 'kmh',
            defaultTo: 'ms',
            units: {
                ms:  { name: 'Metros por segundo', symbol: 'm/s', factor: 1 },
                kmh: { name: 'Kilómetros por hora', symbol: 'km/h', factor: 1 / 3.6 },
                mph: { name: 'Millas por hora', symbol: 'mph', factor: 0.44704 },
                kn:  { name: 'Nudos', symbol: 'kn', factor: 0.5144444444 }
            }
        },
        time: {
            label: 'Tiempo',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>',
            defaultFrom: 'h',
            defaultTo: 'min',
            units: {
                ms:  { name: 'Milisegundos', symbol: 'ms', factor: 0.001 },
                s:   { name: 'Segundos', symbol: 's', factor: 1 },
                min: { name: 'Minutos', symbol: 'min', factor: 60 },
                h:   { name: 'Horas', symbol: 'h', factor: 3600 },
                d:   { name: 'Días', symbol: 'd', factor: 86400 },
                wk:  { name: 'Semanas', symbol: 'sem', factor: 604800 }
            }
        },
        data: {
            label: 'Datos digitales',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M4 6h16v4H4V6zm0 8h16v4H4v-4zm2-6v2h2V8H6zm0 8v2h2v-2H6z"/></svg>',
            defaultFrom: 'MB',
            defaultTo: 'GB',
            units: {
                bit: { name: 'Bits', symbol: 'b', factor: 0.125 },
                B:   { name: 'Bytes', symbol: 'B', factor: 1 },
                KB:  { name: 'Kilobytes', symbol: 'KB', factor: 1000 },
                MB:  { name: 'Megabytes', symbol: 'MB', factor: 1000000 },
                GB:  { name: 'Gigabytes', symbol: 'GB', factor: 1000000000 },
                TB:  { name: 'Terabytes', symbol: 'TB', factor: 1000000000000 },
                PB:  { name: 'Petabytes', symbol: 'PB', factor: 1000000000000000 }
            }
        },
        numsys: {
            label: 'Sistemas numéricos',
            iconSvg: '<svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>',
            defaultFrom: 'DEC',
            defaultTo: 'BIN',
            units: {
                DEC: { name: 'Decimal (Base 10)', symbol: 'DEC', radix: 10 },
                BIN: { name: 'Binario (Base 2)', symbol: 'BIN', radix: 2 },
                OCT: { name: 'Octal (Base 8)', symbol: 'OCT', radix: 8 },
                HEX: { name: 'Hexadecimal (Base 16)', symbol: 'HEX', radix: 16 }
            }
        }
    };

    let conv_currentCat = 'length';
    let conv_fromUnit = 'm';
    let conv_toUnit = 'cm';
    let conv_hasOpenedBefore = false;

    function conv_open() {
        const overlay = document.getElementById('conv_overlay');
        if (!overlay) return;
        if (!conv_hasOpenedBefore) {
            conv_buildCategoryMenu();
            conv_applyCategory('length', false);
            conv_hasOpenedBefore = true;
        } else {
            conv_convert();
        }
        overlay.style.display = 'flex';
        overlay.setAttribute('aria-hidden', 'false');
        if (typeof haptic === 'function') haptic();
    }

    function conv_close() {
        const overlay = document.getElementById('conv_overlay');
        if (!overlay) return;
        conv_closeAllDropdowns();
        overlay.style.display = 'none';
        overlay.setAttribute('aria-hidden', 'true');
        if (typeof haptic === 'function') haptic();
    }

    function conv_closeAllDropdowns() {
        document.querySelectorAll('.conv_dropdown.open').forEach(el => {
            el.classList.remove('open');
        });
    }

    function conv_toggleDropdown(dropdownId) {
        const target = document.getElementById(dropdownId);
        if (!target) return;
        const wasOpen = target.classList.contains('open');
        conv_closeAllDropdowns();
        if (!wasOpen) {
            target.classList.add('open');
        }
        if (typeof haptic === 'function') haptic();
    }

    document.addEventListener('click', (e) => {
        const overlay = document.getElementById('conv_overlay');
        if (!overlay || overlay.style.display === 'none') return;
        if (!e.target.closest('.conv_dropdown')) {
            conv_closeAllDropdowns();
        }
    });

    function conv_buildCategoryMenu() {
        const menu = document.getElementById('conv_catMenu');
        if (!menu) return;
        menu.innerHTML = Object.keys(conv_CATEGORIES).map(catKey => {
            const cat = conv_CATEGORIES[catKey];
            const selectedClass = catKey === conv_currentCat ? 'selected' : '';
            return `
                <button type="button"
                        class="conv_dropdown_option ${selectedClass}"
                        data-cat-key="${catKey}"
                        onclick="conv_selectCategory('${catKey}')">
                    <span class="conv_option_left">
                        <span class="conv_cat_icon">${cat.iconSvg}</span>
                        <span>${cat.label}</span>
                    </span>
                </button>
            `;
        }).join('');
    }

    function conv_selectCategory(catKey) {
        conv_closeAllDropdowns();
        conv_applyCategory(catKey, true);
        if (typeof haptic === 'function') haptic();
    }

    function conv_applyCategory(catKey, resetInputToDefault) {
        const cat = conv_CATEGORIES[catKey];
        if (!cat) return;
        conv_currentCat = catKey;
        conv_fromUnit = cat.defaultFrom;
        conv_toUnit = cat.defaultTo;

        const catIconEl = document.getElementById('conv_catIcon');
        const catTextEl = document.getElementById('conv_catText');
        if (catIconEl) catIconEl.innerHTML = cat.iconSvg;
        if (catTextEl) catTextEl.textContent = cat.label;

        document.querySelectorAll('#conv_catMenu .conv_dropdown_option').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.catKey === catKey);
        });

        conv_buildUnitMenus();
        conv_syncUnitLabels();
        conv_syncKeypadAvailability();

        if (resetInputToDefault) {
            const inputEl = document.getElementById('conv_inputValue');
            if (inputEl) {
                inputEl.value = catKey === 'numsys' ? '10' : '1';
            }
        }
        conv_convert();
    }

    function conv_buildUnitMenus() {
        const cat = conv_CATEGORIES[conv_currentCat];
        const fromMenu = document.getElementById('conv_fromMenu');
        const toMenu = document.getElementById('conv_toMenu');
        if (!cat || !fromMenu || !toMenu) return;

        const keys = Object.keys(cat.units);

        fromMenu.innerHTML = keys.map(uKey => {
            const u = cat.units[uKey];
            return `
                <button type="button"
                        class="conv_dropdown_option ${uKey === conv_fromUnit ? 'selected' : ''}"
                        data-unit-key="${uKey}"
                        onclick="conv_selectFromUnit('${uKey}')">
                    <span>${u.name}</span>
                    <span class="conv_option_sym">${u.symbol}</span>
                </button>
            `;
        }).join('');

        toMenu.innerHTML = keys.map(uKey => {
            const u = cat.units[uKey];
            return `
                <button type="button"
                        class="conv_dropdown_option ${uKey === conv_toUnit ? 'selected' : ''}"
                        data-unit-key="${uKey}"
                        onclick="conv_selectToUnit('${uKey}')">
                    <span>${u.name}</span>
                    <span class="conv_option_sym">${u.symbol}</span>
                </button>
            `;
        }).join('');
    }

    function conv_syncUnitLabels() {
        const cat = conv_CATEGORIES[conv_currentCat];
        if (!cat) return;
        const uFrom = cat.units[conv_fromUnit];
        const uTo = cat.units[conv_toUnit];
        if (!uFrom || !uTo) return;

        const fromText = document.getElementById('conv_fromText');
        const toText = document.getElementById('conv_toText');
        const fromSym = document.getElementById('conv_fromSymbol');
        const toSym = document.getElementById('conv_toSymbol');

        if (fromText) fromText.textContent = uFrom.name;
        if (toText) toText.textContent = uTo.name;
        if (fromSym) fromSym.textContent = uFrom.symbol;
        if (toSym) toSym.textContent = uTo.symbol;

        document.querySelectorAll('#conv_fromMenu .conv_dropdown_option').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.unitKey === conv_fromUnit);
        });
        document.querySelectorAll('#conv_toMenu .conv_dropdown_option').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.unitKey === conv_toUnit);
        });
    }

    function conv_selectFromUnit(uKey) {
        conv_fromUnit = uKey;
        conv_closeAllDropdowns();
        conv_syncUnitLabels();
        conv_syncKeypadAvailability();
        conv_convert();
        if (typeof haptic === 'function') haptic();
    }

    function conv_selectToUnit(uKey) {
        conv_toUnit = uKey;
        conv_closeAllDropdowns();
        conv_syncUnitLabels();
        conv_convert();
        if (typeof haptic === 'function') haptic();
    }

    /* ============ CONTROL DEL TECLADO NUMÉRICO PROPIO DEL CONVERSOR ============ */
    function conv_syncKeypadAvailability() {
        const isNumSys = conv_currentCat === 'numsys';
        const isBin = isNumSys && conv_fromUnit === 'BIN';
        const isOct = isNumSys && conv_fromUnit === 'OCT';

        document.querySelectorAll('#conv_overlay .conv_key').forEach(btn => {
            const label = btn.textContent.trim();
            let disabled = false;

            if (label === '.') {
                disabled = isNumSys;
            } else if (label === '±') {
                disabled = isNumSys;
            } else if (/^[2-9]$/.test(label)) {
                if (isBin) disabled = true;
                if (isOct && (label === '8' || label === '9')) disabled = true;
            }

            btn.classList.toggle('conv_key_disabled', disabled);
        });
    }

    function conv_pressDigit(digit) {
        const inputEl = document.getElementById('conv_inputValue');
        if (!inputEl) return;

        if (conv_currentCat === 'numsys') {
            if (conv_fromUnit === 'BIN' && !/[01]/.test(digit)) return;
            if (conv_fromUnit === 'OCT' && !/[0-7]/.test(digit)) return;
        }

        let current = inputEl.value || '';
        if (current === '0') {
            current = digit;
        } else if (current === '-0') {
            current = '-' + digit;
        } else if (current.length < 22) {
            current += digit;
        }

        inputEl.value = current;
        conv_convert();
        if (typeof haptic === 'function') haptic(digit);
    }

    function conv_pressDecimal() {
        if (conv_currentCat === 'numsys') return;
        const inputEl = document.getElementById('conv_inputValue');
        if (!inputEl) return;

        let current = inputEl.value || '';
        if (current.includes('.')) return;

        if (current === '' || current === '-') {
            current += '0.';
        } else {
            current += '.';
        }
        inputEl.value = current;
        conv_convert();
        if (typeof haptic === 'function') haptic('.');
    }

    function conv_backspace() {
        const inputEl = document.getElementById('conv_inputValue');
        if (!inputEl) return;

        let current = inputEl.value || '';
        if (current.length > 0) {
            current = current.slice(0, -1);
            if (current === '-') current = '';
        }
        inputEl.value = current;
        conv_convert();
        if (typeof haptic === 'function') haptic('DEL');
    }

    function conv_toggleSign() {
        if (conv_currentCat === 'numsys') return;
        const inputEl = document.getElementById('conv_inputValue');
        if (!inputEl) return;

        let current = inputEl.value || '';
        if (!current || current === '0') return;

        if (current.startsWith('-')) {
            current = current.slice(1);
        } else {
            current = '-' + current;
        }
        inputEl.value = current;
        conv_convert();
        if (typeof haptic === 'function') haptic();
    }

    function conv_handleManualInput() {
        const inputEl = document.getElementById('conv_inputValue');
        if (!inputEl) return;
        let val = inputEl.value || '';

        if (conv_currentCat === 'numsys') {
            if (conv_fromUnit === 'BIN') val = val.replace(/[^01]/g, '');
            else if (conv_fromUnit === 'OCT') val = val.replace(/[^0-7]/g, '');
            else if (conv_fromUnit === 'DEC') val = val.replace(/[^0-9]/g, '');
            else val = val.toUpperCase().replace(/[^0-9A-F]/g, '');
        } else {
            val = val.replace(/[^0-9.-]/g, '');
            const isNeg = val.startsWith('-');
            val = val.replace(/-/g, '');
            const parts = val.split('.');
            if (parts.length > 2) {
                val = parts[0] + '.' + parts.slice(1).join('');
            }
            if (isNeg) val = '-' + val;
        }

        inputEl.value = val.slice(0, 22);
        conv_convert();
    }

    function conv_swapUnits() {
        const temp = conv_fromUnit;
        conv_fromUnit = conv_toUnit;
        conv_toUnit = temp;

        conv_syncUnitLabels();
        conv_syncKeypadAvailability();

        if (conv_currentCat === 'numsys') {
            const inputEl = document.getElementById('conv_inputValue');
            if (inputEl && inputEl.value) {
                if (conv_fromUnit === 'BIN') inputEl.value = inputEl.value.replace(/[^01]/g, '') || '0';
                else if (conv_fromUnit === 'OCT') inputEl.value = inputEl.value.replace(/[^0-7]/g, '') || '0';
                else if (conv_fromUnit === 'DEC') inputEl.value = inputEl.value.replace(/[^0-9]/g, '') || '0';
            }
        }

        conv_convert();
        if (typeof haptic === 'function') haptic();
    }

    function conv_formatNumber(num) {
        if (typeof num !== 'number' || !isFinite(num) || isNaN(num)) return '—';
        if (num === 0) return '0';
        const absVal = Math.abs(num);
        if (absVal >= 1e12 || (absVal > 0 && absVal < 1e-7)) {
            return num.toExponential(6).replace(/\.?0+e/, 'e');
        }
        const rounded = Math.round(num * 1e10) / 1e10;
        const str = String(rounded);
        const parts = str.split('.');
        const intFormatted = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.length > 1 ? `${intFormatted}.${parts[1]}` : intFormatted;
    }

    function conv_convertTemperature(val, fromU, toU) {
        if (fromU === toU) return val;
        let celsius = val;
        if (fromU === 'F') celsius = (val - 32) * (5 / 9);
        else if (fromU === 'K') celsius = val - 273.15;

        if (toU === 'C') return celsius;
        if (toU === 'F') return (celsius * 9) / 5 + 32;
        if (toU === 'K') return celsius + 273.15;
        return val;
    }

    function conv_convert() {
        const inputEl = document.getElementById('conv_inputValue');
        const outputEl = document.getElementById('conv_outputValue');
        const cat = conv_CATEGORIES[conv_currentCat];
        if (!inputEl || !outputEl || !cat) return;

        const rawStr = (inputEl.value || '').trim();
        if (!rawStr || rawStr === '-' || rawStr === '.' || rawStr === '-.') {
            outputEl.textContent = '0';
            return;
        }

        if (conv_currentCat === 'numsys') {
            const fromRadix = cat.units[conv_fromUnit].radix;
            const toRadix = cat.units[conv_toUnit].radix;
            const parsedInt = parseInt(rawStr, fromRadix);
            if (isNaN(parsedInt) || !isFinite(parsedInt)) {
                outputEl.textContent = 'Entrada no válida';
                return;
            }
            outputEl.textContent = parsedInt.toString(toRadix).toUpperCase();
            if (conv_hasOpenedBefore) {
                unlockAchievementById('traductor_del_mundo');
            }
            return;
        }

        const numVal = parseFloat(rawStr);
        if (isNaN(numVal) || !isFinite(numVal)) {
            outputEl.textContent = '—';
            return;
        }

        let converted = 0;
        if (conv_currentCat === 'temperature') {
            converted = conv_convertTemperature(numVal, conv_fromUnit, conv_toUnit);
        } else {
            const fromFactor = cat.units[conv_fromUnit].factor;
            const toFactor = cat.units[conv_toUnit].factor;
            converted = (numVal * fromFactor) / toFactor;
        }

        outputEl.textContent = conv_formatNumber(converted);
        if (conv_hasOpenedBefore) {
            unlockAchievementById('traductor_del_mundo');
        }
    }

    function conv_clear() {
        const inputEl = document.getElementById('conv_inputValue');
        const outputEl = document.getElementById('conv_outputValue');
        if (inputEl) inputEl.value = '';
        if (outputEl) outputEl.textContent = '0';
        if (typeof haptic === 'function') haptic('AC');
    }

    function conv_copyResult() {
        const outputEl = document.getElementById('conv_outputValue');
        const copyBtn = document.getElementById('conv_copyBtn');
        if (!outputEl || !copyBtn) return;

        const textToCopy = (outputEl.textContent || '').trim();
        if (!textToCopy || textToCopy === '—' || textToCopy === 'Entrada no válida') return;

        const showCopiedState = () => {
            const prevText = copyBtn.textContent;
            copyBtn.textContent = '¡Copiado!';
            setTimeout(() => {
                copyBtn.textContent = prevText;
            }, 1100);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(showCopiedState).catch(() => {
                conv_fallbackCopy(textToCopy);
                showCopiedState();
            });
        } else {
            conv_fallbackCopy(textToCopy);
            showCopiedState();
        }
        if (typeof haptic === 'function') haptic();
    }

    function conv_fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch {}
        document.body.removeChild(ta);
    }

    // Vibración háptica suave al tocar teclas
let hapticEnabled = localStorage.getItem('calc_haptic') !== 'false'; // Activado por defecto

function triggerHaptic(ms = 10) {
    if (hapticEnabled && navigator.vibrate) {
        navigator.vibrate(ms);
    }
}

document.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;

    // Vibración ligeramente más marcada para '=' o 'AC', suave para el resto
    if (btn.classList.contains('equals') || btn.classList.contains('l-eq') || btn.classList.contains('ac') || btn.classList.contains('l-ac')) {
        triggerHaptic(18);
    } else {
        triggerHaptic(10);
    }
});
function updateHapticUI() {
    const pill = document.getElementById('proHapticPill');
    if (pill) {
        pill.textContent = hapticEnabled ? 'ON' : 'OFF';
        pill.classList.toggle('on', hapticEnabled);
    }
}

function toggleHaptic() {
    hapticEnabled = !hapticEnabled;
    localStorage.setItem('calc_haptic', hapticEnabled);
    updateHapticUI();
    if (hapticEnabled) triggerHaptic(15);
}

updateHapticUI();

</script>
