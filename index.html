<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">

    <title>Calculadora Moderna</title>
    <style>
        /* ============ TEMAS BASE (OSCURO Y CLARO ESTÁNDAR) ============ */
        :root {
            color-scheme: dark;
            --bg-color: #000000;
            --text-color: #ffffff;
            --preview-color: #8e8e93;
            --num-bg: #1c1c1e;
            --num-color: #ffffff;
            --op-bg: #2c3545;
            --op-color: #a8c7fa;

            /* Colores fijos independientes del acento del teclado */
            --sci-bg: #232833;
            --sci-color: #d2e3fc;
            --sci-active-bg: #3b485e;
            --sci-active-color: #a8c7fa;
            --pro-mode-color: #d0bcff;
            --pro-mode-badge-bg: rgba(208, 188, 255, 0.18);
            --mem-bg: #252b38;
            --mem-color: #a8c7fa;
            --toggle-icon-color: #ffffff;

            --ac-bg: #3b4252;
            --ac-color: #a8c7fa;
            --equals-bg: #f1c40f;
            --equals-color: #000000;
            --cursor-color: #a8c7fa;
            --top-icon-color: #ffffff;
            --history-bg: #121216;
            --menu-bg: #232328;
            --modal-bg: #1a1a1f;
            --hover-bg: rgba(255, 255, 255, 0.10);
            --selection-bg: rgba(168, 199, 250, 0.35);
            --swatch-border: #ffffff;
            --body-weight: 400;
            --btn-weight: 400;
            --equals-weight: 500;
        }
        :root.light-theme {
            color-scheme: light;
            --bg-color: #f8f9fa;
            --text-color: #202124;
            --preview-color: #5f6368;
            --num-bg: #f1f3f4;
            --num-color: #202124;
            --op-bg: #e8eaed;
            --op-color: #1a73e8;

            /* Colores fijos independientes del acento en tema claro */
            --sci-bg: #e8eaed;
            --sci-color: #1a73e8;
            --sci-active-bg: #d2e3fc;
            --sci-active-color: #174ea6;
            --pro-mode-color: #5e35b1;
            --pro-mode-badge-bg: rgba(94, 53, 177, 0.14);
            --mem-bg: #e8eaed;
            --mem-color: #1a73e8;
            --toggle-icon-color: #202124;

            --ac-bg: #fce8e6;
            --ac-color: #d93025;
            --equals-bg: #1a73e8;
            --equals-color: #ffffff;
            --cursor-color: #1a73e8;
            --top-icon-color: #202124;
            --history-bg: #ffffff;
            --menu-bg: #ffffff;
            --modal-bg: #ffffff;
            --hover-bg: rgba(0, 0, 0, 0.05);
            --selection-bg: rgba(26, 115, 232, 0.25);
            --swatch-border: #202124;
            --body-weight: 400;
            --btn-weight: 400;
            --equals-weight: 500;
        }

        /* Cuando Texto en negrita (PRO) está activo */
        :root.pro-active {
            --body-weight: 500;
            --btn-weight: 600;
            --equals-weight: 700;
        }

        /* ============ COLORES PERSONALIZADOS DEL TECLADO (MODO PRO) ============ */

            --op-bg: #182947; --op-color: #4d94ff; --ac-color: #4d94ff;
            --equals-bg: #2979ff; --equals-color: #ffffff;

        }

            --op-bg: #e3edff; --op-color: #1d6ce0; --ac-color: #1d6ce0;

        :root[data-accent="purple"] {

        :root.light-theme[data-accent="emerald"] {

        :root[data-accent="sky"] {

        }

            --cursor-color: #c62828; --selection-bg: rgba(229, 57, 53, 0.22);
        }

        :root[data-accent="neon"] {
            --op-bg: #14361a; --op-color: #69ff47; --ac-color: #69ff47;
            --equals-bg: #39e519; --equals-color: #091d06;
            --cursor-color: #69ff47; --selection-bg: rgba(57, 229, 25, 0.28);

        :root.light-theme[data-accent="neon"] {

        :root[data-accent="lime"] {
            --op-bg: #2e3612; --op-color: #d4e157; --ac-color: #d4e157;
            --equals-bg: #c0ca33; --equals-color: #181c06;
            --cursor-color: #d4e157; --selection-bg: rgba(192, 202, 51, 0.30);
        }
        :root.light-theme[data-accent="lime"] {

        }

        :root[data-accent="copper"] {
            --op-bg: linear-gradient(135deg, #8c4a27 0%, #e09165 50%, #7a3b1a 100%);
            --op-color: #ffffff; --ac-color: #e69d73;
            --equals-bg: linear-gradient(135deg, #8c4a27 0%, #e09165 50%, #7a3b1a 100%);
            --equals-dot: #c87544; --equals-color: #ffffff;
            --grad-bg: linear-gradient(135deg, #8c4a27 0%, #e09165 50%, #7a3b1a 100%);
            --grad-text: #ffffff;
            --grad-border: #e69d73;
            --cursor-color: #e69d73; --selection-bg: rgba(200, 117, 68, 0.32);
        }
        :root.light-theme[data-accent="copper"] {

            --equals-dot: #b86638; --equals-color: #ffffff;
            --grad-bg: linear-gradient(135deg, #9c522b 0%, #d48255 50%, #7d3d1b 100%);
            --grad-text: #ffffff;

            --equals-dot: #b0b7c2; --equals-color: #141619;
            --grad-bg: linear-gradient(135deg, #757c85 0%, #e2e6ec 50%, #636973 100%);
            --grad-text: #141619;
            --grad-border: #d8dee9;
            --cursor-color: #d8dee9; --selection-bg: rgba(176, 183, 194, 0.32);
        }
        :root.light-theme[data-accent="silver"] {
            --op-bg: linear-gradient(135deg, #68707a 0%, #c4cbd4 50%, #525861 100%);
            --op-color: #ffffff; --ac-color: #3f4652;
            --equals-bg: linear-gradient(135deg, #68707a 0%, #c4cbd4 50%, #525861 100%);
            --equals-dot: #8c94a0; --equals-color: #ffffff;
            --grad-bg: linear-gradient(135deg, #68707a 0%, #c4cbd4 50%, #525861 100%);

            --grad-border: #525861;
            --cursor-color: #3f4652; --selection-bg: rgba(104, 112, 122, 0.24);
        }

            --op-bg: linear-gradient(135deg, #9e7414 0%, #f5cf56 50%, #8a6209 100%);
            --op-color: #1a1300; --ac-color: #ffd54f;
            --equals-bg: linear-gradient(135deg, #9e7414 0%, #f5cf56 50%, #8a6209 100%);
            --equals-dot: #d4af37; --equals-color: #1a1300;
            --grad-bg: linear-gradient(135deg, #9e7414 0%, #f5cf56 50%, #8a6209 100%);
            --grad-text: #1a1300;
            --grad-border: #ffd54f;
            --cursor-color: #ffd54f; --selection-bg: rgba(212, 175, 55, 0.32);
        }
        :root.light-theme[data-accent="gold"] {
            --op-bg: linear-gradient(135deg, #9c7212 0%, #dfb63b 50%, #7d5806 100%);

            --op-color: #ffffff; --ac-color: #ff66b2;
            --equals-bg: linear-gradient(135deg, #6200ea, #d500f9, #ff007f);
            --equals-dot: #d500f9; --equals-color: #ffffff;
            --grad-bg: linear-gradient(135deg, #6200ea, #d500f9, #ff007f);
            --grad-text: #ffffff;

            --cursor-color: #ff4da6; --selection-bg: rgba(213, 0, 249, 0.32);
        }

            --op-bg: linear-gradient(135deg, #6200ea, #d500f9, #ff007f);
            --op-color: #ffffff; --ac-color: #aa00ff;
            --equals-bg: linear-gradient(135deg, #6200ea, #d500f9, #ff007f);
            --equals-dot: #d500f9; --equals-color: #ffffff;
            --grad-bg: linear-gradient(135deg, #6200ea, #d500f9, #ff007f);
            --grad-text: #ffffff;
            --grad-border: #aa00ff;
            --cursor-color: #aa00ff; --selection-bg: rgba(213, 0, 249, 0.24);
        }

        /* ============ EXTENSIÓN DE LOS 4 DEGRADADOS A TODA LA APP ============ */
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .op,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) button.land-btn.l-op {
            background: var(--grad-bg);
            color: var(--grad-text);
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
        }
        :is(:root[data-accent="silver"], :root[data-accent="gold"]):not(.light-theme) .op,
        :is(:root[data-accent="silver"], :root[data-accent="gold"]):not(.light-theme) button.land-btn.l-op {
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.35);
        }

        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) button.mem-btn,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) button.sci-btn,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) button.land-btn.l-sci {
            background: var(--grad-bg);
            color: var(--grad-text);
            font-weight: 600;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
        }
        :is(:root[data-accent="silver"], :root[data-accent="gold"]):not(.light-theme) button.mem-btn,
        :is(:root[data-accent="silver"], :root[data-accent="gold"]):not(.light-theme) button.sci-btn,
        :is(:root[data-accent="silver"], :root[data-accent="gold"]):not(.light-theme) button.land-btn.l-sci {
            border-color: rgba(0, 0, 0, 0.18);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.35);
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) button.sci-btn.active-mode,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) button.land-btn.l-sci.active-mode {
            border-color: var(--swatch-border);
            box-shadow: 0 0 12px var(--selection-bg);
            filter: brightness(1.12);
            font-weight: 800;
        }

        /* Botones de barra desplegable (Memoria, Tubo de ensayo, Conversor) y retroceso horizontal */
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .sci-toggle-btn.active-mem-bar,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .pro-sci-icon-btn.active-sci-panel {
            background: var(--grad-bg);
            color: var(--grad-text);
            box-shadow: 0 3px 10px var(--selection-bg);
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .pro-horiz-backspace {
            background: var(--grad-bg);
            color: var(--grad-text);
            border-color: var(--grad-border);
            font-weight: 700;
        }

        /* Etiquetas PRO, Rad, Deg, S⇔D e indicador M */
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .pro-badge-indicator,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .accent-active-tag,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .pro-sub-pill.on,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .calculator.pro-open .pro-status-pill {
            background: var(--grad-bg);
            color: var(--grad-text);
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .top-angle-btn {
            background: var(--grad-bg);
            color: var(--grad-text);
            border-color: var(--grad-border);
            font-weight: 700;
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .top-angle-btn.active-mode {
            background: var(--grad-bg);
            color: var(--grad-text);
            border-color: var(--swatch-border);
            box-shadow: 0 0 10px var(--selection-bg);
            font-weight: 800;
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .mem-indicator,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .mem-indicator-value,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .history-date-group {
            color: var(--grad-border);
        }

        /* Botón Borrar historial y botones de acción en modales */
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .btn-clear-history,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .calculator.pro-open .btn-clear-history,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .modal-btn.primary,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .book-nav-btn.next-pill,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .book-nav-btn.next-pill.pro-pill,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .frac-count-btn:not(.remove-btn),
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .frac-op-btn.active {
            background: var(--grad-bg);
            color: var(--grad-text);
            border-color: var(--grad-border);
            font-weight: 700;
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .book-nav-btn:not(.next-pill),
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-book-back {
            background: var(--grad-bg);
            color: var(--grad-text);
            font-weight: 700;
        }

        /* Libros de Ayuda (tarjetas, portadas, insignias y páginas internas) */

        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-book-card.pro-book-card .help-book-cover,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-book-num,

        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .subalbum-progress-pill,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .stamp-counter-pill,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) :root.light-theme .stamp-counter-pill {

        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-book-tag,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-book-card.pro-book-card .help-book-tag,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-book-arrow,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-book-card.pro-book-card .help-book-arrow,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .help-title-icon {

        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .book-page-card,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .book-page-card.pro-page-card,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .stamp-showcase-card:not(.locked) {
            border-color: var(--grad-border);
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .book-dot.active,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .book-dot.pro-dot.active {
            background: var(--grad-bg);
        }

        /* Conversor de Unidades (selector, badges, botones de acción, invertir, teclado y bordes activos) */
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_dropdown:not(.conv_unit_dropdown) .conv_dropdown_trigger,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_unit_symbol_badge,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_swap_btn,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_action_btn:not(.conv_clear_btn),
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_key_fn,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_dropdown_option.selected {
            background: var(--grad-bg);
            color: var(--grad-text);
            border-color: var(--grad-border);
            font-weight: 700;
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_dropdown:not(.conv_unit_dropdown) .conv_cat_icon,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_dropdown:not(.conv_unit_dropdown) .conv_dropdown_arrow,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_dropdown_option.selected .conv_cat_icon,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_dropdown_option.selected .conv_option_sym {
            color: var(--grad-text);
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_card,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_dropdown_menu {
            border-color: var(--grad-border);
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_unit_dropdown .conv_dropdown_trigger:hover,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_unit_dropdown.open .conv_dropdown_trigger,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_input:focus {
            border-color: var(--grad-border);
        }
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_tag,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_output_box,
        :is(:root[data-accent="copper"], :root[data-accent="silver"], :root[data-accent="gold"], :root[data-accent="aurora"]) .conv_unit_dropdown .conv_dropdown_arrow {
            color: var(--grad-border);
        }

        /* ============ BASE ============ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: var(--body-weight);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .calculator {
            background-color: var(--bg-color);
            color: var(--text-color);
            width: 100%;
            max-width: 480px;
            height: 100%;
            padding: calc(10px + env(safe-area-inset-top, 0))
                     calc(10px + env(safe-area-inset-right, 0))
                     calc(10px + env(safe-area-inset-bottom, 0))
                     calc(10px + env(safe-area-inset-left, 0));
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: max-width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
        }

        @media (min-width: 500px) and (min-height: 680px) {
            body { align-items: center; }
            .calculator {
                height: min(95dvh, 820px);
                max-width: 420px;
                border-radius: 32px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            }
        }

        /* ============ BARRA SUPERIOR ============ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            flex-shrink: 0;
            position: relative;
            z-index: 15;
            background-color: transparent;
        }
        .top-left-group,
        .top-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--top-icon-color);
            font-weight: var(--btn-weight);
            touch-action: manipulation;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .top-btn:hover   { background-color: var(--hover-bg); }
        .top-btn:active  { transform: scale(0.9); }
        .top-btn svg     { width: 24px; height: 24px; fill: currentColor; }

        /* Botón DEG/RAD compacto y transparente con contorno de acento */
        .top-angle-btn {
            display: none;
            height: 30px;
            min-width: 42px;
            padding: 0 8px;
            border-radius: 9px;
            border: 1.8px solid var(--op-color);
            background: transparent;
            color: var(--op-color);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .calculator.sci-open .top-angle-btn {
            display: inline-flex;
        }
        /* S⇔D en barra superior únicamente cuando funciones avanzadas están activas en modo estándar (sin Pro activo) */
        .calculator.sci-open.pro-open .top-sd-btn,
        .calculator.pro-landscape-sci .top-sd-btn {
            display: none !important;
        }
        .top-angle-btn:hover {
            background-color: var(--hover-bg);
        }
        .top-angle-btn:active {
            transform: scale(0.92);
            background-color: var(--hover-bg);
        }
        .top-angle-btn.active-mode {
            background: transparent;
            color: var(--op-color);
            border-color: var(--op-color);
            font-weight: 600;
        }

        /* Botón volver de vista horizontal Pro */
        .pro-back-btn {
            display: none;
        }

        /* ============ MENÚ DESPLEGABLE (TRES PUNTOS) ============ */
        .menu-backdrop {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: none;
        }
        .menu-backdrop.active {
            display: block;
        }
        .overflow-menu {
            position: absolute;
            top: calc(54px + env(safe-area-inset-top, 0));
            right: calc(14px + env(safe-area-inset-right, 0));
            width: 268px;
            background-color: var(--menu-bg);
            border-radius: 18px;
            padding: 8px 0;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            z-index: 26;
            opacity: 0;
            transform: scale(0.92) translateY(-6px);
            transform-origin: top right;
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease;
        }
        .overflow-menu.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 13px 16px;
            font-size: 0.98rem;
            font-weight: var(--body-weight);
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            cursor: pointer;
            touch-action: manipulation;
        }
        .menu-item:hover,
        .menu-item:active {
            background-color: var(--hover-bg);
        }
        .menu-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .menu-item.pro-option,
        .calculator.pro-open .menu-item.pro-option {
            color: var(--pro-mode-color);
            font-weight: 600;
        }
        .menu-item.pro-option svg {
            opacity: 1;
        }
        .menu-item.accent-option {
            display: flex;
            color: var(--text-color);
            font-weight: var(--body-weight);
        }
        .calculator.pro-open .menu-item.accent-option {
            color: var(--pro-mode-color);
            font-weight: 600;
        }
        .menu-item.pro-sub-option {
            display: none;
            color: var(--pro-mode-color);
            font-weight: 600;
        }
        .calculator.pro-open .menu-item.pro-sub-option {
            display: flex;
        }
        .pro-status-pill {
            margin-left: auto;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            background-color: var(--hover-bg);
            color: var(--preview-color);
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }
        .calculator.pro-open .pro-status-pill {
            background-color: var(--pro-mode-badge-bg);
            color: var(--pro-mode-color);
            font-weight: 700;
        }
        .pro-sub-pill {
            margin-left: auto;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 9px;
            background-color: var(--hover-bg);
            color: var(--preview-color);
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }
        .pro-sub-pill.on {
            background-color: var(--pro-mode-badge-bg);
            color: var(--pro-mode-color);
            font-weight: 700;
        }
        .accent-active-tag {
            display: none;
            margin-left: auto;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 9px;
            background-color: var(--pro-mode-badge-bg);
            color: var(--pro-mode-color);
            letter-spacing: 0.4px;
        }
        .calculator.pro-open .accent-active-tag {
            display: inline-block;
        }
        .accent-dot-preview {
            margin-left: auto;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--equals-bg);
            border: 2px solid rgba(142, 142, 147, 0.35);
            flex-shrink: 0;
        }
        .calculator.pro-open .accent-dot-preview {
            margin-left: 6px;
        }
        .menu-divider {
            height: 1px;
            background-color: var(--hover-bg);
            margin: 4px 14px;
        }

        /* ============ MODALES Y SELECTOR 3x4 / PRO ============ */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 35;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            width: 100%;
            max-width: 356px;
            max-height: 92dvh;
            background-color: var(--modal-bg);
            color: var(--text-color);
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            transition: max-width 0.22s ease;
        }
        .modal-card.fraction-wide-3 {
            max-width: min(96%, 520px);
        }
        .modal-card.fraction-wide-4 {
            max-width: min(98%, 680px);
        }
        .modal-card.help-compact {
            max-width: 324px;
            max-height: 76dvh;
            padding: 14px 16px;
            border-radius: 22px;
            gap: 10px;
            overflow: hidden;
        }
        .modal-card.help-compact .modal-header {
            font-size: 1.02rem;
            flex-shrink: 0;
        }
        .modal-card.help-compact .modal-header .top-btn {
            width: 32px;
            height: 32px;
        }
        .modal-card.help-compact .modal-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
            overscroll-behavior: contain;
        }
        .modal-card.help-compact .modal-actions {
            flex-shrink: 0;
            padding-top: 2px;
        }
        .modal-card.help-compact .modal-btn {
            padding: 8px 14px;
            font-size: 0.88rem;
            border-radius: 12px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.15rem;
            font-weight: 700;
            gap: 8px;
        }
        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .modal-body {
            font-size: 0.94rem;
            font-weight: var(--body-weight);
            line-height: 1.45;
            color: var(--text-color);
            -webkit-user-select: text;
            user-select: text;
        }
        .modal-body p {
            margin-bottom: 10px;
        }
        .modal-body ul {
            padding-left: 18px;
            margin-bottom: 10px;
        }
        .modal-body li {
            margin-bottom: 6px;
        }

        /* ============ HERRAMIENTA DE FRACCIONES (a/b HASTA 4 FRACCIONES) ============ */
        .frac-tool-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
        }
        .frac-toolbar-top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .frac-count-badge {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--preview-color);
        }
        .frac-ctrl-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .frac-count-btn {
            height: 28px;
            padding: 0 10px;
            border-radius: 9px;
            border: 1.5px solid color-mix(in srgb, var(--op-color) 40%, transparent);
            background-color: var(--op-bg);
            color: var(--op-color);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            touch-action: manipulation;
            transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
        }
        .frac-count-btn:active:not(:disabled) {
            transform: scale(0.94);
        }
        .frac-count-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .frac-count-btn.remove-btn {
            background-color: var(--ac-bg);
            color: var(--ac-color);
            border-color: color-mix(in srgb, var(--ac-color) 35%, transparent);
        }
        .frac-calc-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 2px 4px;
        }
        .frac-field-group {
            flex: 1 1 0;
            min-width: 68px;
            max-width: 124px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .frac-input {
            width: 100%;
            text-align: center;
            font-size: clamp(1rem, 2.6vw, 1.18rem);
            font-weight: 700;
            padding: 7px 6px;
            border-radius: 13px;
            border: 1.8px solid color-mix(in srgb, var(--op-color) 40%, transparent);
            background-color: var(--hover-bg);
            color: var(--text-color);
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        .frac-input:focus {
            border-color: var(--op-color);
        }
        .frac-bar-divider {
            width: 100%;
            height: 3px;
            border-radius: 3px;
            background-color: var(--op-color);
            margin: 1px 0;
        }
        .frac-op-select-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-shrink: 0;
        }
        .frac-op-btn {
            width: 30px;
            height: 24px;
            border-radius: 8px;
            border: 1.5px solid color-mix(in srgb, var(--op-color) 35%, transparent);
            background-color: var(--hover-bg);
            color: var(--op-color);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
        }
        .frac-op-btn:active {
            transform: scale(0.92);
        }
        .frac-op-btn.active {
            background-color: var(--equals-bg);
            color: var(--equals-color);
            border-color: transparent;
        }
        .frac-preview-pill {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--op-color);
            min-height: 20px;
            text-align: center;
        }

        /* ============ MANUAL VISUAL DIVIDIDO POR LIBROS EN AYUDA ============ */
        .help-books-shelf {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .help-book-card {
            width: 100%;
            background-color: var(--hover-bg);
            border: 1.5px solid rgba(142, 142, 147, 0.22);
            border-radius: 16px;
            padding: 11px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            color: var(--text-color);

        /* ============ LIBRO 0: COLECCIÓN DE ESTAMPITAS Y NOTIFICACIÓN TOAST ============ */
        .stamp-toast {
            position: absolute;
            top: calc(56px + env(safe-area-inset-top, 0));
            left: 50%;
            transform: translateX(-50%) translateY(-14px);
            background-color: #16151d;
            border: 1.8px solid #9b7bf7;
            border-radius: 16px;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 14px rgba(155, 123, 247, 0.35);
            z-index: 45;
            pointer-events: none;
            opacity: 0;
            max-width: calc(100% - 28px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .stamp-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .stamp-toast-icon {
            width: 30px;
            height: 30px;
            border-radius: 9px;

            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stamp-toast-icon svg {
            width: 22px;
            height: 22px;
        }

            text-align: left;
            line-height: 1.25;
            min-width: 0;

        /* Cuadrícula 3x4 de colores del teclado */
        .color-grid-3x4 {
            display: grid;

            gap: 12px 10px;
            padding: 4px 4px;
            justify-items: center;
